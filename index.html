<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--biru:#12307a;--biru2:#1f4bb5;--kuning:#f7c600;--latar:#eef2f8;--teks:#1d2433;--abu:#5b6475;--garis:#dde3ee;--putih:#fff;
--merah:#b42318;--merahbg:#fde2e1;--hijau:#127a3a;--hijaubg:#d7f2df;--kuningbg:#fff3c4;--kuningtx:#7a5b00;--birubg:#dbe8ff;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--latar);color:var(--teks);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--biru2)}
.hide{display:none!important}
header.top{background:var(--biru);color:#fff;border-bottom:3px solid var(--kuning);position:sticky;top:0;z-index:50}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.top-in img{height:34px}
a.kelogo{display:inline-flex;line-height:0;cursor:pointer}
.judul{font-weight:700;line-height:1.15;font-size:15px}
.judul small{display:block;font-weight:400;opacity:.8;font-size:12px}
.akun{margin-left:auto;position:relative}
.akun>button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.menu{position:absolute;right:0;top:110%;background:#fff;color:var(--teks);border:1px solid var(--garis);border-radius:var(--r);min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.menu div{padding:10px 14px;font-size:13px;color:var(--abu);border-bottom:1px solid var(--garis)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;cursor:pointer}
.menu button:hover{background:var(--latar)}
nav.tab{background:#fff;border-bottom:1px solid var(--garis)}
nav.tab .in{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto}
nav.tab a{padding:11px 14px;text-decoration:none;color:var(--abu);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;display:flex;gap:6px;align-items:center}
nav.tab a.on{color:var(--biru);border-bottom-color:var(--biru)}
nav.tab .n{background:var(--merah);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
main{max-width:1200px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:14px 16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--biru2)}

.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;font-weight:500;background:var(--latar);color:var(--abu)}
.p-merah{background:var(--merahbg);color:var(--merah)}.p-hijau{background:var(--hijaubg);color:var(--hijau)}

.btn:hover{background:var(--latar)}

var FP_AWAL = { status:'Berjalan', periode:'tahun', kategori:'', kecamatan:'' }, filterPeta = Object.assign({}, FP_AWAL);
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var filterKasus = { q:'', status:'Berjalan', tahap:'', kategori:'', kecamatan:'', bulan:'', lewat:false };
var filterAduan = { status:'Baru', q:'' };

/* ---------- util ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function simpan(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function ambil(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
var BATAS_DIAM=60*60*1000, aktivitasTerakhir=Date.now(), aktSimpan=0;
function catatAktivitas(){ aktivitasTerakhir=Date.now(); if(aktivitasTerakhir-aktSimpan>15000){ aktSimpan=aktivitasTerakhir; simpan('ppud_aktif', aktivitasTerakhir); } }
['pointerdown','keydown','wheel','touchstart','scroll'].forEach(function(ev){ window.addEventListener(ev, catatAktivitas, {passive:true, capture:true}); });
function diamSelama(){ return Date.now()-Math.max(aktivitasTerakhir, Number(ambil('ppud_aktif'))||0); }
function tglIndo(t, hari){ if(!t) return '–'; var p=t.slice(0,10).split('-'); if(p.length<3) return t;
  var s=Number(p[2])+' '+BLN[Number(p[1])-1]+' '+p[0];
  if(hari){ var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); s=HARI[d.getUTCDay()]+', '+s; } return s; }
function waktuIndo(w){ if(!w) return '–'; return tglIndo(w.slice(0,10))+(w.length>10?' '+w.slice(11,16):''); }
function hariIni(){ var d=new Date(Date.now()+7*3600e3); return d.toISOString().slice(0,10); }
function liburSet(){ var s={}; (D.libur||[]).forEach(function(l){ if(l.dihitung) s[l.tanggal]=1; }); return s; }
function tambahHK(t,n){ var lib=liburSet(), p=t.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;
  while(c<n){ d.setUTCDate(d.getUTCDate()+1); var w=d.getUTCDay(), s=d.toISOString().slice(0,10); if(w&&w!==6&&!lib[s]) c++; }
  return d.toISOString().slice(0,10); }
function selisihHK(a,b){ if(a===b) return 0; var lib=liburSet(), m=a<b?1:-1, x=a<b?a:b, y=a<b?b:a, p=x.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;
  while(d.toISOString().slice(0,10)<y){ d.setUTCDate(d.getUTCDate()+1); var w=d.getUTCDay(), s=d.toISOString().slice(0,10); if(w&&w!==6&&!lib[s]) c++; }
  return c*m; }
function isAdmin(){ return ME && ME.peran!=='Lihat'; }
function isUtama(){ return ME && ME.peran==='Admin Utama'; }
function nm(u){ return u ? ((D && D.nama && D.nama[u]) || u) : ''; }
function catatanTampil(c){ return String(c||'').replace(/\[(Penutupan|Dibuka kembali) (\d{4}-\d{2}-\d{2})(?: \u00b7 ([^\]]+))?\]/g, function(_,j,t,u){ return '['+j+' '+tglIndo(t)+(u?' \u00b7 '+nm(u):'')+']'; }); }
var KHUSUS={'Penutupan Kasus':'tutup','Dibuka Kembali':'buka'};
function penutup(k){ var m=String(k.catatan||'').match(/\[Penutupan \d{4}-\d{2}-\d{2} \u00b7 [^\]]+\]/g); return m ? nm(m[m.length-1].replace(/^.* \u00b7 |\]$/g,'')) : nm(k.diubahOleh); }
function lewat(k){ return k.status!=='Selesai' && k.tenggat && k.tenggat < D.hariIni; }
function pilTenggat(k){
  if(k.status==='Selesai') return '<span class="pill p-hijau">Selesai</span>';
  if(!k.tenggat) return '<span class="sub">–</span>';
  var n=selisihHK(D.hariIni,k.tenggat);
  if(k.tenggat<D.hariIni) return '<span class="pill p-merah">Lewat '+Math.max(1,-n)+' hari kerja</span>';
  if(k.tenggat===D.hariIni) return '<span class="pill p-merah">Hari ini</span>';
  return '<span class="pill '+(n<=1?'p-kuning':'p-biru')+'">'+tglIndo(k.tenggat)+' · sisa '+n+' hk</span>'; }
function pilTahap(k){ if(!k.tahap) return '<span class="pill">Belum ada tahap</span>'; return '<span class="pill p-biru">'+esc(k.tahap)+'</span>'; }
function judulKasus(k){ return k.objek || k.ringkasan || k.pelanggar || k.no; }
function toast(t){ var e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, 3500); }
var nMuat=0; function muat(on){ nMuat+=on?1:-1; var b=$('.muat'); if(nMuat>0&&!b){ b=document.createElement('div'); b.className='muat'; document.body.appendChild(b); } if(nMuat<=0&&b){ nMuat=0; b.remove(); } }

function api(action, data){
  muat(true);
  var body = Object.assign({ action: action, token: TOKEN, aktif: diamSelama() < BATAS_DIAM }, data||{});
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .catch(function(){ throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); })
    .then(function(j){
      if(!j.ok){ if(j.sesiHabis){ keluar(j.error); } throw new Error(j.error||'Terjadi kesalahan.'); }
      return j; })
    .finally(function(){ muat(false); });
}

/* ---------- login ---------- */
function tampil(id){ ['layarLogin','layarGanti','aplikasi'].forEach(function(x){ $('#'+x).classList.toggle('hide', x!==id); }); }
function keluar(pesan){
  if(TOKEN && !pesan) api('logout').catch(function(){});
  TOKEN=null; ME=null; D=null; tiketDikenal=null; simpan('ppud_sesi', null); var nb=$('#notif'); if(nb) nb.remove();
  tampil('layarLogin'); $('#lgGalat').textContent = pesan||''; $('#lgPass').value='';
}
$('#formLogin').addEventListener('submit', function(e){
  e.preventDefault(); var b=$('#lgBtn'); b.disabled=true; $('#lgGalat').textContent='';
  api('login',{ username: $('#lgUser').value.trim(), password: $('#lgPass').value })
    .then(function(j){ TOKEN=j.token; ME=j.me; aktSimpan=0; filterPeta=Object.assign({}, FP_AWAL); catatAktivitas(); simpan('ppud_sesi',{token:TOKEN, me:ME}); $('#lgPass').value=''; masuk(); })
    .catch(function(err){ $('#lgGalat').textContent=err.message; })
    .finally(function(){ b.disabled=false; });
});
$('#formGanti').addEventListener('submit', function(e){
  e.preventDefault(); var g=$('#gpGalat'); g.textContent='';
  if($('#gpBaru').value!==$('#gpUlang').value){ g.textContent='Ulangi password baru tidak sama.'; return; }
  var b=$('#gpBtn'); b.disabled=true;
  api('gantiPassword',{ lama:$('#gpLama').value, baru:$('#gpBaru').value })
    .then(function(j){ ME=j.me; simpan('ppud_sesi',{token:TOKEN, me:ME}); $('#formGanti').reset(); toast('Password tersimpan'); masuk(); })
    .catch(function(err){ g.textContent=err.message; })
    .finally(function(){ b.disabled=false; });
});
$('#gpBatal').addEventListener('click', function(){ if(ME && ME.wajibGanti) keluar(); else tampil('aplikasi'); });
function bukaGanti(paksa){ $('#gpInfo').textContent = paksa ? 'Ini login pertama Anda. Ganti password sebelum melanjutkan (password lama = username).' : 'Ganti password akun '+ME.username+'.';
  $('#gpBatal').textContent = paksa ? 'Keluar' : 'Batal'; tampil('layarGanti'); }

function masuk(){
  if(ME.wajibGanti){ bukaGanti(true); return; }
  tampil('aplikasi');
  $('#btnAkun').textContent = ME.nama.split(' ')[0] + ' ▾';
  $('#infoAkun').innerHTML = '<b style="color:var(--teks)">'+esc(ME.nama)+'</b><br>'+esc(ME.username)+' · '+esc(ME.peran)+'<br><small style="font-size:12px;opacity:.85">Keluar otomatis setelah 1 jam tanpa aktivitas</small>';
  muatData();
}
$('#btnAkun').addEventListener('click', function(e){ e.stopPropagation(); $('#menuAkun').classList.toggle('hide'); });
document.addEventListener('click', function(){ $('#menuAkun').classList.add('hide'); });
$('#menuAkun').addEventListener('click', function(e){ var a=e.target.getAttribute('data-aksi'); if(!a) return;
  if(a==='keluar') keluar(); if(a==='ganti') bukaGanti(false); if(a==='muatUlang') muatData(); });

var terakhirMuat=0, sedangSegar=false, tiketDikenal=null;
function muatData(diam){
  return api('data').then(function(j){ var y=window.scrollY; D=j; ME=j.me; simpan('ppud_sesi',{token:TOKEN, me:ME}); terakhirMuat=Date.now(); render(); if(diam) window.scrollTo(0,y); cekAduanBaru(); })
    .catch(function(err){ if(diam) return; if(TOKEN) $('#isi').innerHTML='<div class="kartu galat">'+esc(err.message)+' <button class="btn kecil" onclick="muatData()">Coba lagi</button></div>'; });
}

function cekAduanBaru(){
  var b=D.aduan.filter(function(a){ return a.status==='Baru'; }).map(function(a){ return a.tiket; });
  if(tiketDikenal){ var n=b.filter(function(t){ return tiketDikenal.indexOf(t)<0; }).length; if(n) beriTahu(n); }
  tiketDikenal=b;
}
function beriTahu(n){
  var e=$('#notif');
  if(e){ n+=Number(e.getAttribute('data-n'))||0; } else { e=document.createElement('div'); e.id='notif'; e.style.cssText='position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:250;background:#fff;border:1px solid var(--garis,#dfe3ea);border-left:4px solid var(--kuning,#f5c400);border-radius:10px;box-shadow:0 6px 24px rgba(16,32,80,.18);padding:10px 12px 10px 14px;display:flex;gap:10px;align-items:center;font-size:14px;max-width:92vw;width:max-content;white-space:nowrap'; document.body.appendChild(e); }
  e.setAttribute('data-n', n);
  e.innerHTML='<span>\ud83d\udd14 <b>'+n+' aduan baru</b> masuk</span><button class="btn kecil" id="notifLihat">Lihat</button><button id="notifTutup" title="Tutup" style="border:0;background:none;font-size:18px;cursor:pointer;color:#667">\u00d7</button>';
  $('#notifLihat').onclick=function(){ e.remove(); location.hash='aduan'; };
  $('#notifTutup').onclick=function(){ e.remove(); };
}
document.addEventListener('click', function(e){
  var a=e.target.closest && e.target.closest('a.kelogo'); if(!a) return;
  var m=$('#modalBg'); if(!m) return;
  var isi=[].some.call(m.querySelectorAll('input,textarea,select'), function(x){ return x.type!=='hidden' && !x.disabled && !x.readOnly; });
  if(isi && !confirm('Formulir yang sedang terbuka belum disimpan dan isiannya akan hilang. Tetap pindah ke halaman utama?')) e.preventDefault();
});
function sibuk(){
  if($('#modalBg')) return true;
  if($('#aplikasi').classList.contains('hide')) return true;
  var a=document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function segarkan(){
  if(!TOKEN || !D || sedangSegar || sibuk()) return;
  sedangSegar=true; muatData(true).finally(function(){ sedangSegar=false; });
}
function cekDiam(){ if(TOKEN && diamSelama()>=BATAS_DIAM){ tutupModal(); keluar('Anda keluar otomatis karena tidak ada aktivitas selama 1 jam.'); return true; } return false; }
setInterval(function(){ if(cekDiam()) return; if(document.visibilityState==='visible' && Date.now()-terakhirMuat>=5*60*1000) segarkan(); }, 30*1000);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState!=='visible' || cekDiam()) return; if(Date.now()-terakhirMuat>=30*1000) segarkan(); });

/* ---------- routing ---------- */
window.addEventListener('hashchange', function(){ if(D) render(); });
function render(){
  if(peta){ peta.remove(); peta=null; lapPeta=null; }
  hentiB();
  var h = location.hash.replace(/^#\/?/,'') || 'beranda';
  var bag = h.split('/');
  var baru = D.aduan.filter(function(a){ return a.status==='Baru'; }).length;
  var nLewat = D.kasus.filter(lewat).length;
  var menu = [['beranda','Beranda','⌂'],['aduan','Aduan','✉',baru],['kasus','Kasus','▤',nLewat],['kalender','Kalender','▦']];
  if(isAdmin()) menu.push(['bestie','BESTIE','★']);
  if(isUtama()) menu.push(['libur','Hari libur','☼']);
  if(isUtama()) menu.push(['pengguna','Pengguna','☺']);
  $('#nav').innerHTML = menu.map(function(m){ return '<a href="#'+m[0]+'" class="'+(bag[0]===m[0]?'on':'')+'"><span class="ic only-mob">'+m[2]+'</span>'+m[1]+(m[3]?'<span class="n">'+m[3]+'</span>':'')+'</a>'; }).join('');
  var f = { beranda: vBeranda, aduan: vAduan, kasus: bag[1] ? function(){ vDetail(decodeURIComponent(bag[1])); } : vKasus, kalender: vKalender, libur: vLibur, pengguna: vPengguna,
    bestie: bag[1] ? function(){ vBestieSesi(decodeURIComponent(bag[1])); } : vBestie }[bag[0]] || vBeranda;
  f(); window.scrollTo(0,0);
}

/* ---------- beranda ---------- */
function hitung(list, key, kosong){ var o={}; list.forEach(function(x){ var k=x[key]||kosong||'(kosong)'; o[k]=(o[k]||0)+1; }); return o; }
function bars(obj, urutan, maks){
  var keys = urutan ? urutan.filter(function(k){ return obj[k]; }) : Object.keys(obj).sort(function(a,b){ return obj[b]-obj[a]; });
  if(maks) keys = keys.slice(0,maks);
  if(!keys.length) return '<div class="sub">Belum ada data.</div>';
  var mx = Math.max.apply(null, keys.map(function(k){ return obj[k]; }));
  return keys.map(function(k){ return '<div class="bar"><span class="nm" title="'+esc(k)+'">'+esc(k)+'</span><span class="t"><i style="width:'+(obj[k]/mx*100)+'%"></i></span><b>'+obj[k]+'</b></div>'; }).join('');
}
function vBeranda(){
  var t = D.hariIni, bln = t.slice(0,7);
  var berjalan = D.kasus.filter(function(k){ return k.status!=='Selesai'; });
  var lw = berjalan.filter(lewat);
  var selesaiBln = D.kasus.filter(function(k){ return k.status==='Selesai' && (k.tanggalSelesai||'').slice(0,7)===bln; });
  var baru = D.aduan.filter(function(a){ return a.status==='Baru'; });
  var perhatian = berjalan.filter(function(k){ return k.tenggat && selisihHK(t,k.tenggat)<=2; }).sort(function(a,b){ return a.tenggat<b.tenggat?-1:1; });
  $('#isi').innerHTML =
    '<h1>Ringkasan · '+esc(tglIndo(t,true))+'</h1>'+
    '<div class="grid g4">'+
      '<button class="stat" onclick="location.hash=\'aduan\'"><div class="l">Aduan baru</div><div class="v">'+baru.length+'</div></button>'+
      '<button class="stat" onclick="setFK({status:\'Berjalan\',lewat:false})"><div class="l">Kasus berjalan</div><div class="v">'+berjalan.length+'</div></button>'+
      '<button class="stat '+(lw.length?'merah':'')+'" onclick="setFK({status:\'Berjalan\',lewat:true})"><div class="l">Lewat tenggat</div><div class="v">'+lw.length+'</div></button>'+
      '<button class="stat" onclick="setFK({status:\'Selesai\',lewat:false,bulan:\'\'})"><div class="l">Selesai bulan ini</div><div class="v">'+selesaiBln.length+'</div></button>'+
    '</div>'+
    kotakKegiatan(t)+
    '<div class="grid g2" style="margin-top:12px">'+
      '<div class="kartu"><h2>Perlu perhatian</h2>'+(perhatian.length ? '<div class="daftar">'+perhatian.slice(0,8).map(itemKasus).join('')+'</div>'+(perhatian.length>8?'<p class="sub">+'+(perhatian.length-8)+' kasus lagi</p>':'') : '<div class="sub">Tidak ada kasus yang lewat atau mendekati tenggat (≤ 2 hari kerja).</div>')+'</div>'+
      '<div class="kartu"><h2>Kasus berjalan per tahap</h2>'+bars(hitung(berjalan,'tahap','Belum ada tahap'), D.tahap.concat(['Belum ada tahap']))+'</div>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:12px">'+
      '<div class="kartu"><h2>Kasus berjalan per kategori</h2>'+bars(hitung(berjalan,'kategori'))+'</div>'+
      '<div class="kartu"><h2>Kasus berjalan per kecamatan</h2>'+bars(hitung(berjalan,'kecamatan'),null,8)+'</div>'+
    '</div>'+
    '<div class="kartu" style="margin-top:12px"><h2>Sebaran kasus</h2><div id="alatPeta" class="alatPeta"></div><div style="position:relative"><div id="peta"></div><div id="petaKosong" class="petaKosong" hidden>Tidak ada kasus dengan titik lokasi untuk pilihan ini</div></div>'+
    '<div class="sub legenda"><span><span class="dot" style="background:#1f4bb5"></span>Berjalan</span><span><span class="dot" style="background:#b42318"></span>Lewat tenggat</span><span><span class="dot" style="background:#8a94a6"></span>Selesai</span></div>'+
    '<div class="sub" style="margin-top:4px">Hanya kasus yang memiliki titik lokasi.</div></div>';
  if(!window.L){ $('#peta').innerHTML='<div class="kosong">Peta tidak dapat dimuat.</div>'; return; }
  peta = L.map('peta').setView([-6.86,107.95],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ maxZoom:19, attribution:'© OpenStreetMap' }).addTo(peta);
  lapPeta = L.layerGroup().addTo(peta);
  alatPeta(); isiPeta();
}
function alatPeta(){
  var f = filterPeta;
  var kat = D.kategori.slice(); D.kasus.forEach(function(k){ if(k.kategori && kat.indexOf(k.kategori)<0) kat.push(k.kategori); });
  $('#alatPeta').innerHTML = '<div class="seg" id="segPeta">'+['Berjalan','Selesai','Semua'].map(function(s){ return '<button type="button" data-s="'+s+'" class="'+(f.status===s?'on':'')+'">'+s+'</button>'; }).join('')+'</div>'+
    (f.status!=='Berjalan' ? '<select id="pPer" title="Periode kasus selesai">'+opsi([['bulan','Selesai bulan ini'],['tahun','Selesai tahun ini'],['semua','Selesai semua waktu']], f.periode)+'</select>' : '')+
    '<select id="pKat">'+opsi(kat, f.kategori, 'Semua kategori')+'</select>'+
    '<select id="pKec">'+opsi(Object.keys(D.wilayah).sort(), f.kecamatan, 'Semua kecamatan')+'</select>';
  $('#segPeta').querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ f.status=this.getAttribute('data-s'); alatPeta(); isiPeta(); }); });
  var map={pPer:'periode',pKat:'kategori',pKec:'kecamatan'};
  Object.keys(map).forEach(function(id){ var el=$('#'+id); if(el) el.addEventListener('change', function(){ f[map[id]]=this.value; isiPeta(); }); });
}
function isiPeta(){
  if(!peta || !lapPeta) return;
  var f = filterPeta, t = D.hariIni;
  var cocokPeriode = function(k){ var s=k.tanggalSelesai||''; return f.periode==='semua' || (f.periode==='bulan' ? s.slice(0,7)===t.slice(0,7) : s.slice(0,4)===t.slice(0,4)); };
  var titik = D.kasus.filter(function(k){
    var sel = k.status==='Selesai';
    if(f.status==='Berjalan' && sel) return false;
    if(f.status==='Selesai' && !sel) return false;
    if(sel && !cocokPeriode(k)) return false;
    if(f.kategori && k.kategori!==f.kategori) return false;
    if(f.kecamatan && k.kecamatan!==f.kecamatan) return false;
    return k.lat && k.lng && isFinite(+k.lat) && isFinite(+k.lng) && Math.abs(+k.lng) <= 180; });
  lapPeta.clearLayers();
  var b=[]; titik.forEach(function(k){ var ll=[+k.lat,+k.lng], sel=k.status==='Selesai'; b.push(ll); try{
    var isi = sel
      ? '<b>'+esc(k.no)+'</b><br>'+esc(judulKasus(k))+'<br>Selesai '+esc(tglIndo(k.tanggalSelesai))+(k.hasil?' · '+esc(k.hasil):'')+'<br>Ditutup oleh '+esc(penutup(k))
      : '<b>'+esc(k.no)+'</b><br>'+esc(judulKasus(k))+'<br>'+esc(k.tahap||'');
    L.circleMarker(ll,{ radius:8, color:'#fff', weight:2, fillColor: sel?'#8a94a6':(lewat(k)?'#b42318':'#1f4bb5'), fillOpacity:.9 }).addTo(lapPeta)
      .bindPopup(isi+'<br><a href="#kasus/'+encodeURIComponent(k.no)+'">Lihat rincian</a>'); }catch(e){} });
  var ks=$('#petaKosong'); if(ks) ks.hidden = b.length>0;
  if(b.length>1) peta.fitBounds(b,{padding:[30,30],maxZoom:14}); else if(b.length) peta.setView(b[0],14);
}
function kotakKegiatan(t){
  var besok=tglKe(t,1);
  var kol=function(tg, label){
    var list=(D.kegiatan||[]).filter(function(k){ return k.mulai<=tg && k.selesai>=tg; }).sort(function(a,b){ var x=a.seharian?'':a.jamMulai, y=b.seharian?'':b.jamMulai; return x<y?-1:x>y?1:0; });
    return '<div><div class="sub" style="font-weight:600;color:var(--biru);margin-bottom:4px">'+label+' · '+esc(tglIndo(tg,true))+'</div>'+(list.length?list.map(function(k){
      return '<div class="kegb" onclick="detailKegiatan(\''+esc(k.id)+'\')"><div class="tgk" style="border-left:3px solid '+esc(warnaJenis(k.jenis))+'"><b>'+(k.seharian?'—':esc(k.jamMulai))+'</b>'+(k.seharian?'sehari':'WIB')+'</div><div><b>'+esc(k.nama)+'</b><div class="sub">'+[k.jenis,k.lokasi].filter(String).map(esc).join(' · ')+'</div></div></div>'; }).join('')
      :'<div class="sub">Tidak ada kegiatan.</div>')+'</div>'; };
  return '<div class="kartu" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Kegiatan hari ini &amp; besok</h2><a href="#kalender" style="white-space:nowrap">Buka kalender →</a></div>'+
    '<div class="grid g2" style="margin-top:8px">'+kol(t,'Hari ini')+kol(besok,'Besok')+'</div></div>';
}
function setFK(o){ Object.assign(filterKasus,{q:'',tahap:'',kategori:'',kecamatan:'',bulan:''},o); location.hash='kasus'; }

/* ---------- aduan ---------- */
function vAduan(){
  var st=['Baru','Jadi Kasus','Ditolak','Semua'];
  $('#isi').innerHTML='<h1>Aduan warga</h1><div class="alat"><div class="seg" id="segAduan">'+st.map(function(s){ var n = s==='Semua'?D.aduan.length:D.aduan.filter(function(a){return a.status===s;}).length;
      return '<button data-s="'+s+'" class="'+(filterAduan.status===s?'on':'')+'">'+s+' ('+n+')</button>'; }).join('')+'</div>'+
    '<input type="search" id="qAduan" placeholder="Cari tiket, uraian, desa…" value="'+esc(filterAduan.q)+'"></div><div id="listAduan"></div>';
  $('#segAduan').addEventListener('click', function(e){ var s=e.target.getAttribute('data-s'); if(s){ filterAduan.status=s; vAduan(); } });
  $('#qAduan').addEventListener('input', function(){ filterAduan.q=this.value; isiAduan(); });
  isiAduan();
}
function isiAduan(){
  var q=filterAduan.q.toLowerCase();
  var list=D.aduan.filter(function(a){ return (filterAduan.status==='Semua'||a.status===filterAduan.status) &&
    (!q || [a.tiket,a.uraian,a.kategori,a.kecamatan,a.desa,a.alamat].join(' ').toLowerCase().indexOf(q)>=0); })
    .sort(function(a,b){ return a.waktu<b.waktu?1:-1; });
  $('#listAduan').innerHTML = list.length ? '<div class="daftar">'+list.map(function(a){
    var p = a.status==='Baru'?'p-merah':a.status==='Ditolak'?'':'p-hijau';
    return '<div class="item" onclick="bukaAduan(\''+esc(a.tiket)+'\')"><div class="a"><div><b>'+esc(a.kategori)+'</b> · <span class="sub">'+esc(a.tiket)+'</span></div><div style="text-align:right"><span class="pill '+p+'">'+esc(a.status)+'</span>'+(a.statusOleh?'<div class="sub" style="font-size:12px;margin-top:2px;white-space:nowrap">'+(a.status==='Baru'?'dikembalikan ':'oleh ')+esc(nm(a.statusOleh))+'</div>':'')+'</div></div>'+
      '<div class="sub">'+esc(waktuIndo(a.waktu))+' · Desa/Kel. '+esc(a.desa)+', Kec. '+esc(a.kecamatan)+(a.foto.length?' · '+a.foto.length+' foto':'')+'</div>'+
      '<div style="margin-top:4px">'+esc(a.uraian.length>180?a.uraian.slice(0,180)+'…':a.uraian)+'</div></div>'; }).join('')+'</div>'
    : '<div class="kosong">Tidak ada aduan'+(filterAduan.status!=='Semua'?' berstatus '+filterAduan.status:'')+'.</div>';
}
function bukaAduan(tiket){
  var a=D.aduan.filter(function(x){ return x.tiket===tiket; })[0]; if(!a) return;
  var kasus = a.noKasus ? a.noKasus.split(/[,\s]+/).filter(String) : [];
  var aksi = '';
  if(isAdmin()){
    if(a.status==='Baru') aksi = '<button class="btn bahaya" onclick="tolakAduan(\''+esc(a.tiket)+'\')">Tolak</button><button class="btn" onclick="gabungAduan(\''+esc(a.tiket)+'\')">Gabung ke kasus</button><button class="btn utama" onclick="kasusDariAduan(\''+esc(a.tiket)+'\')">Jadikan kasus baru</button>';
    else if(a.status==='Ditolak') aksi = '<button class="btn" onclick="kembalikanAduan(\''+esc(a.tiket)+'\')">Kembalikan ke Baru</button>';
    else aksi = '<button class="btn" onclick="gabungAduan(\''+esc(a.tiket)+'\')">Tautkan ke kasus lain</button><button class="btn" onclick="kasusDariAduan(\''+esc(a.tiket)+'\')">Buat kasus tambahan</button>';
  }
  modal('Aduan '+a.tiket,
    '<dl class="dl"><dt>Status</dt><dd>'+esc(a.status)+(a.statusOleh?' · '+(a.status==='Baru'?'dikembalikan oleh ':'')+esc(nm(a.statusOleh))+(a.waktuStatus?' · '+esc(waktuIndo(a.waktuStatus)):''):'')+(a.alasanTolak?'<div>Alasan: '+esc(a.alasanTolak)+'</div><div class="sub">'+(a.alasanPublik?'Alasan ditampilkan di cek status publik':'Alasan tidak ditampilkan ke publik')+'</div>':'')+'</dd>'+
    (kasus.length?'<dt>Kasus</dt><dd>'+kasus.map(function(n){ return '<a href="#kasus/'+encodeURIComponent(n)+'" onclick="tutupModal()">'+esc(n)+'</a>'; }).join(', ')+'</dd>':'')+
    '<dt>Waktu masuk</dt><dd>'+esc(waktuIndo(a.waktu))+' WIB</dd><dt>Kategori</dt><dd>'+esc(a.kategori)+'</dd>'+
    '<dt>Pelapor</dt><dd>'+esc(a.nama)+' · '+(isAdmin()?'<a href="https://wa.me/'+esc(a.wa)+'" target="_blank" rel="noopener">+'+esc(a.wa)+'</a>':'+'+esc(a.wa))+'</dd>'+
    (a.email?'<dt>Email</dt><dd>'+esc(a.email)+'</dd>':'')+
    '<dt>Waktu kejadian</dt><dd>'+esc(a.waktuKejadian||'–')+'</dd><dt>Lokasi</dt><dd>'+esc(a.alamat)+'\nDesa/Kel. '+esc(a.desa)+', Kec. '+esc(a.kecamatan)+'\n<a href="'+esc(a.peta)+'" target="_blank" rel="noopener">Buka di Google Maps</a></dd>'+
    '<dt>Uraian</dt><dd>'+esc(a.uraian)+'</dd><dt>Foto</dt><dd>'+(a.foto.length?'<div class="foto" id="fotoAduan">'+a.foto.map(function(id){ return '<div class="ph" data-id="'+esc(id)+'">memuat…</div>'; }).join('')+'</div>':'Tidak ada')+'</dd></dl>'+
    (aksi?'<div class="aksi">'+aksi+'</div>':''), true);
  $$('#fotoAduan .ph').forEach(function(el){ muatFoto(el); });
}
var cacheBerkas={};
function ambilBerkas(id){ if(cacheBerkas[id]) return Promise.resolve(cacheBerkas[id]); return api('berkas',{id:id}).then(function(j){ cacheBerkas[id]=j; return j; }); }
function muatFoto(el){ var id=el.getAttribute('data-id');
  ambilBerkas(id).then(function(j){ var img=document.createElement('img'); img.src='data:'+j.mime+';base64,'+j.data; img.alt=j.nama; img.onclick=function(){ lihatBerkas(id); }; el.replaceWith(img); })
    .catch(function(){ el.textContent='gagal dimuat'; }); }
function lihatBerkas(id){
  var w = window.open('', '_blank');
  if(w) w.document.write('<p style="font-family:sans-serif">Memuat berkas…</p>');
  ambilBerkas(id).then(function(j){
    var bin=atob(j.data), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([arr],{type:j.mime}));
    if(w) w.location.href=url; else { var a=document.createElement('a'); a.href=url; a.download=j.nama; a.click(); }
  }).catch(function(err){ if(w) w.close(); toast(err.message); });
}
function tolakAduan(tiket){
  modal('Tolak aduan '+tiket, '<div class="f"><label class="pn wajib"><span>Alasan penolakan <i class="bt">*</i></span><textarea id="alasan" placeholder="Contoh: bukan kewenangan Satpol PP, diteruskan ke dinas terkait"></textarea></label><label class="pn" style="display:flex;flex-direction:row;justify-content:flex-start;text-align:left;gap:8px;align-items:center;font-weight:400;color:var(--teks)"><input type="checkbox" id="alasanPublik" style="min-height:0;width:auto"> Tampilkan alasan ini kepada pelapor di cek status</label></div><div class="galat" id="mg"></div>'+
    '<div class="aksi"><button class="btn" onclick="tutupModal()">Batal</button><button class="btn bahaya" id="ok">Tolak aduan</button></div>');
  $('#ok').onclick=function(){ kirim(this,'tolakAduan',{tiket:tiket, alasan:$('#alasan').value, tampilAlasan:$('#alasanPublik').checked},'Aduan ditolak'); };
}
function kembalikanAduan(tiket){ if(confirm('Kembalikan aduan '+tiket+' ke status Baru?')) api('kembalikanAduan',{tiket:tiket}).then(function(){ tutupModal(); toast('Aduan dikembalikan'); muatData(); }).catch(function(e){ toast(e.message); }); }
function gabungAduan(tiket){
  var list=D.kasus.filter(function(k){ return k.status!=='Selesai'; }).sort(function(a,b){ return a.no<b.no?1:-1; });
  if(!list.length){ toast('Belum ada kasus berjalan.'); return; }
  modal('Gabungkan aduan '+tiket, '<div class="f"><label class="pn wajib"><span>Pilih kasus berjalan <i class="bt">*</i></span><select id="pilihKasus">'+list.map(function(k){ return '<option value="'+esc(k.no)+'">'+esc(k.no+' · '+judulKasus(k)+' · Kec. '+k.kecamatan)+'</option>'; }).join('')+'</select></label></div>'+
    '<div class="galat" id="mg"></div><div class="aksi"><button class="btn" onclick="tutupModal()">Batal</button><button class="btn utama" id="ok">Gabungkan</button></div>');
  $('#ok').onclick=function(){ kirim(this,'tautkanAduan',{tiket:tiket, no:$('#pilihKasus').value},'Aduan ditautkan'); };
}
function kasusDariAduan(tiket){
  var a=D.aduan.filter(function(x){ return x.tiket===tiket; })[0];
  formKasus(null, { asal:'Aduan Warga', kategori: D.kategori.indexOf(a.kategori)>=0?a.kategori:'', uraian:a.uraian, kecamatan:a.kecamatan, desa:a.desa, alamat:a.alamat, lat:a.lat, lng:a.lng }, [tiket]);
}

/* ---------- kasus ---------- */
function itemKasus(k){
  return '<div class="item '+(lewat(k)?'lewat':'')+'" onclick="location.hash=\'kasus/'+encodeURIComponent(k.no)+'\'"><div class="a"><b>'+esc(judulKasus(k))+'</b>'+pilTenggat(k)+'</div>'+
    '<div class="sub">'+esc(k.no)+' · '+esc(k.kategori)+' · Kec. '+esc(k.kecamatan)+'</div><div style="margin-top:4px">'+pilTahap(k)+'</div></div>';
}
function kasusTersaring(){
  var f=filterKasus, q=f.q.toLowerCase();
  return D.kasus.filter(function(k){
    return (!f.status||k.status===f.status) && (!f.tahap||(f.tahap==='(belum)'?!k.tahap:k.tahap===f.tahap)) && (!f.kategori||k.kategori===f.kategori) &&
      (!f.kecamatan||k.kecamatan===f.kecamatan) && (!f.bulan||(k.tanggalDibuka||'').slice(0,7)===f.bulan) && (!f.lewat||lewat(k)) &&
      (!q || [k.no,k.ringkasan,k.objek,k.pelanggar,k.uraian,k.aturan,k.desa,k.alamat,k.tiket.join(' ')].join(' ').toLowerCase().indexOf(q)>=0);
  }).sort(function(a,b){
    if(urut.kol){ var ka=kunciUrut(a,urut.kol), kb=kunciUrut(b,urut.kol); if(ka<kb) return -urut.arah; if(ka>kb) return urut.arah; return a.no<b.no?-1:1; }
    var la=lewat(a), lb=lewat(b); if(la!==lb) return la?-1:1;
    var ta=a.status!=='Selesai'&&a.tenggat||'9', tb=b.status!=='Selesai'&&b.tenggat||'9'; if(ta!==tb) return ta<tb?-1:1; return a.no<b.no?1:-1; });
}
var urut={ kol:'', arah:1 };
var KOLOM=[['no','No. kasus','150px'],['objek','Objek / ringkasan',''],['kategori','Kategori','150px'],['lokasi','Lokasi','150px'],['tahap','Tahap','170px'],['tenggat','Tenggat','190px']];
function kunciUrut(k,kol){
  if(kol==='no') return k.no;
  if(kol==='objek') return String(judulKasus(k)).toLowerCase();
  if(kol==='kategori') return String(k.kategori).toLowerCase();

function siapkanBerkas(f){
  return new Promise(function(ok, gagal){
    if(/^image\//.test(f.type) && f.type!=='image/gif'){
      var img=new Image(), url=URL.createObjectURL(f);
      img.onload=function(){ var m=1600, s=Math.min(1, m/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        var d=c.toDataURL('image/jpeg',0.8); if(d.length*0.75>5*1048576) return gagal(new Error('Foto "'+f.name+'" terlalu besar.'));
        ok({ nama: f.name.replace(/\.[^.]+$/,'')+'.jpg', data:d }); };
      img.onerror=function(){ gagal(new Error('Foto "'+f.name+'" tidak dapat dibaca.')); }; img.src=url;
    } else if(f.type==='application/pdf'){
      if(f.size>5*1048576) return gagal(new Error('Berkas "'+f.name+'" lebih dari 5 MB.'));
      var rd=new FileReader(); rd.onload=function(){ ok({ nama:f.name, data:rd.result }); }; rd.onerror=function(){ gagal(new Error('Berkas tidak dapat dibaca.')); }; rd.readAsDataURL(f);
    } else gagal(new Error('"'+f.name+'" bukan foto atau PDF.'));
  });
}

function tglKe(t,n){ var p=t.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n)); return d.toISOString().slice(0,10); }
function hariMinggu(t){ var p=t.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay(); }
function jamKeg(k){ return k.seharian ? 'Sehari penuh' : k.jamMulai+(k.jamSelesai?'–'+k.jamSelesai:''); }
function rentangKeg(k){ return k.selesai!==k.mulai ? tglIndo(k.mulai)+' – '+tglIndo(k.selesai) : tglIndo(k.mulai,true); }
/** Semua isi kalender untuk satu tanggal: libur, kegiatan, tenggat kasus berjalan. */
function isiTanggal(t){
  var out=[];
  (D.libur||[]).forEach(function(l){ if(l.tanggal===t && l.dihitung) out.push({ tipe:'libur', judul:l.keterangan }); });
  (D.kegiatan||[]).forEach(function(k){ if(k.mulai<=t && k.selesai>=t) out.push({ tipe:'keg', k:k, judul:k.nama }); });
  D.kasus.forEach(function(k){ if(k.status!=='Selesai' && k.tenggat===t) out.push({ tipe:'tenggat', kasus:k, judul:'Tenggat '+(k.tahap||'')+' · '+judulKasus(k) }); });
  out.sort(function(a,b){ var o={libur:0,keg:1,tenggat:2}; if(o[a.tipe]!==o[b.tipe]) return o[a.tipe]-o[b.tipe];
    if(a.tipe==='keg'){ var x=a.k.seharian?'':a.k.jamMulai, y=b.k.seharian?'':b.k.jamMulai; return x<y?-1:x>y?1:0; } return 0; });

  var hariAda=[]; for(var d=awal; d<=akhir; d=tglKe(d,1)){ var isi=isiTanggal(d); if(isi.length || d===D.hariIni) hariAda.push([d,isi]); }

      (bl!==D.hariIni.slice(0,7)?'<button class="btn kecil" onclick="kalBulan=null;kalPilih=null;vKalender()">Hari ini</button>':'')+'</div>'+
      (isAdmin()?'<div class="kalaksi"><button class="btn" onclick="formJenis()">Kelola jenis</button><button class="btn utama" onclick="formKegiatan(null, kalPilih)">+ Kegiatan</button></div>':'')+'</div>'+

/* ---------- rincian sesi & rekap ---------- */
var RB = null;
function vBestieSesi(kode){
  if(!isAdmin()){ location.hash='beranda'; return; }
  $('#isi').innerHTML='<a href="#bestie" class="sub" style="text-decoration:none">‹ Semua sesi BESTIE</a><div id="rinB" class="sub" style="margin-top:10px">Memuat…</div>';
  muatRekapB(kode);
  hentiB();
  bsTimer=setInterval(function(){ if(location.hash!=='#bestie/'+kode){ hentiB(); return; }
    if(RB && /dibuka/.test(RB.sesi.status) && document.visibilityState==='visible' && !sibuk()) muatRekapB(kode, true); }, 30000);
}
function muatRekapB(kode, diam){
  return api('bestieRekap',{kode:kode}).then(function(j){ var y=window.scrollY; RB=j; isiRekapB(); if(diam) window.scrollTo(0,y); })
    .catch(function(e){ if(!diam) $('#rinB').innerHTML='<div class="kartu galat">'+esc(e.message)+'</div>'; });
}
function kunciSiswaB(j){ return String(j.kelas).toUpperCase().replace(/\s+/g,'')+'|'+String(+j.absen||j.absen); }
function hitungB(R){
  var pre={}, post={};
  R.jawaban.forEach(function(j){ var k=kunciSiswaB(j);
    if(j.tes==='pre'){ if(!pre[k]) pre[k]=j; }
    else { var c=post[k]; if(!c) post[k]={ best:j, n:1, semua:[j.skor] }; else { c.n++; c.semua.push(j.skor); if(j.skor>c.best.skor) c.best=j; } } });
  var lPre=Object.keys(pre).map(function(k){ return pre[k]; }), lPost=Object.keys(post).map(function(k){ return post[k].best; });
  function ind(l){ var n=l.length; if(!n) return { n:0 };
    var sk=l.map(function(x){ return x.skor; }), jml=sk.reduce(function(a,b){ return a+b; },0);
    return { n:n, rata:jml/n, maks:Math.max.apply(null,sk), min:Math.min.apply(null,sk), tuntas:sk.filter(function(x){ return x>=70; }).length/n*100 }; }
  var soal=R.sesi.soal.map(function(q,i){
    function pct(l){ if(!l.length) return null; return l.filter(function(x){ return x.jawaban[q.id]===q.k; }).length/l.length*100; }
    return { no:i+1, q:q, pre:pct(lPre), post:pct(lPost) }; });
  var kunci={}; Object.keys(pre).concat(Object.keys(post)).forEach(function(k){ kunci[k]=1; });
  var siswa=Object.keys(kunci).map(function(k){ var a=pre[k], b=post[k]; var ref=b?b.best:a;
    return { kelas:ref.kelas, absen:ref.absen, nama:(b?b.best.nama:a.nama), pre:a?a.skor:null, post:b?b.best.skor:null, nPost:b?b.n:0, semuaPost:b?b.semua:[],
      selisih:(a&&b)?b.best.skor-a.skor:null }; })
    .sort(function(x,y){ return x.kelas===y.kelas ? (+x.absen)-(+y.absen) : (x.kelas<y.kelas?-1:1); });
  var iPre=ind(lPre), iPost=ind(lPost);
  return { pre:iPre, post:iPost, naik:(iPre.n&&iPost.n)?iPost.rata-iPre.rata:null, soal:soal, siswa:siswa };
}
function f1(x){ return x==null||isNaN(x)?'–':(Math.round(x*10)/10).toString().replace('.',','); }
function tombolStatusB(st){
  var b={ 'Belum dibuka':[['Pre-test dibuka','Buka pre-test','utama']],
    'Pre-test dibuka':[['Ditutup','Tutup pre-test','utama']],
    'Ditutup':[['Post-test dibuka','Buka post-test','utama'],['Pre-test dibuka','Buka lagi pre-test','']],
    'Post-test dibuka':[['Selesai','Tutup post-test','utama']],
    'Selesai':[['Post-test dibuka','Buka lagi post-test','']] }[st]||[];
  return b.map(function(x){ return '<button class="btn '+x[2]+'" onclick="ubahStatusB(\''+x[0]+'\',\''+x[1]+'\')">'+x[1]+'</button>'; }).join('');
}
function isiRekapB(){
  var S=RB.sesi, H=hitungB(RB), terbuka=/dibuka/.test(S.status);
  var baris=function(l,a,b){ return '<tr><td>'+l+'</td><td style="text-align:right">'+a+'</td><td style="text-align:right">'+b+'</td></tr>'; };
  var h='<div class="kartu"><div class="kepalaB"><div><h1 style="margin:0">'+esc(S.kode)+' '+pillB(S.status)+'</h1><div style="font-size:16px;font-weight:600;margin-top:4px">'+esc(S.sekolah)+'</div>'+
    '<div class="sub">'+esc(S.jenjang)+' · '+esc(tglIndo(S.tanggal,true))+' · '+S.soal.length+' soal · dibuat '+esc(nm(S.dibuatOleh))+'</div></div>'+
    '<div class="alatB">'+tombolStatusB(S.status)+'</div></div>'+
    '<div class="alatB" style="margin-top:12px;justify-content:flex-start"><button class="btn" onclick="qrB()">QR &amp; tautan</button><button class="btn" onclick="ubahSesiB()">Ubah sesi</button>'+
    '<button class="btn" onclick="eksporB()">Unduh Excel</button><button class="btn" onclick="muatRekapB(RB.sesi.kode)">Muat ulang</button></div>'+
    (terbuka?'<p class="sub" style="margin:10px 0 0">Rekap diperbarui otomatis setiap 30 detik selama tes dibuka. Perubahan status terlihat di HP siswa paling lambat ±15 detik.</p>':'')+'</div>';
  h+='<div class="grid g2" style="margin-top:12px"><div class="kartu"><h2>Hasil pre-test dan post-test</h2><table class="t"><thead><tr><th>Indikator</th><th style="text-align:right">Pre-test</th><th style="text-align:right">Post-test</th></tr></thead><tbody>'+
    baris('Jumlah peserta yang mengerjakan',H.pre.n,H.post.n)+baris('Rata-rata skor',f1(H.pre.rata),f1(H.post.rata))+
    baris('Skor tertinggi / terendah',H.pre.n?H.pre.maks+' / '+H.pre.min:'–',H.post.n?H.post.maks+' / '+H.post.min:'–')+
    baris('Persentase ketuntasan (skor ≥ 70)',H.pre.n?f1(H.pre.tuntas)+'%':'–',H.post.n?f1(H.post.tuntas)+'%':'–')+'</tbody></table>'+
    '<div class="naikB">Peningkatan rata-rata (post-test − pre-test): <b>'+(H.naik==null?'–':(H.naik>0?'+':'')+f1(H.naik))+'</b></div>'+
    '<p class="sub" style="margin-bottom:0">Post-test memakai nilai terbaik tiap siswa (maks. 2 kali). Siswa dipasangkan lewat kelas + nomor absen.</p></div>'+
    '<div class="kartu"><h2>Persentase benar per soal</h2><div class="legenda" style="margin:0 0 8px"><span><span class="dot" style="background:#9fb3e6"></span>Pre-test</span><span><span class="dot" style="background:#1f4bb5"></span>Post-test</span></div>'+
    H.soal.map(function(s){ return '<div class="soalB" title="'+esc(s.q.t)+'"><div class="nmB"><b>'+s.no+'.</b> '+esc(s.q.t)+'</div>'+
      '<div class="barB"><i class="pre" style="width:'+(s.pre||0)+'%"></i></div><span>'+(s.pre==null?'–':Math.round(s.pre)+'%')+'</span>'+
      '<div class="barB"><i style="width:'+(s.post||0)+'%"></i></div><span>'+(s.post==null?'–':Math.round(s.post)+'%')+'</span></div>'; }).join('')+'</div></div>';
  h+='<div class="kartu" style="margin-top:12px"><h2>Daftar siswa ('+H.siswa.length+')</h2>'+(H.siswa.length?'<div style="overflow-x:auto"><table class="t"><thead><tr><th>Nama</th><th>Kelas</th><th>Absen</th><th style="text-align:right">Pre</th><th style="text-align:right">Post</th><th style="text-align:right" class="only-desk">Selisih</th></tr></thead><tbody>'+
    H.siswa.map(function(s){ return '<tr><td>'+esc(s.nama)+'</td><td>'+esc(s.kelas)+'</td><td>'+esc(s.absen)+'</td><td style="text-align:right">'+(s.pre==null?'–':s.pre)+'</td>'+
      '<td style="text-align:right">'+(s.post==null?'–':'<b'+(s.post>=70?' style="color:var(--hijau)"':'')+'>'+s.post+'</b>'+(s.nPost>1?'<div class="sub">'+s.semuaPost.join(' / ')+'</div>':''))+'</td>'+
      '<td style="text-align:right" class="only-desk">'+(s.selisih==null?'–':(s.selisih>0?'+':'')+s.selisih)+'</td></tr>'; }).join('')+'</tbody></table></div>'
    :'<div class="kosong">Belum ada siswa yang mengirim jawaban.</div>')+'</div>';
  $('#rinB').innerHTML=h;
}
function ubahStatusB(status, label){
  var S=RB.sesi;
  var ket={ 'Pre-test dibuka':'Siswa yang memindai QR akan langsung bisa mengerjakan pre-test.', 'Ditutup':'Siswa tidak bisa lagi mengirim pre-test (kecuali yang sedang mengirim, diberi tenggang 5 menit).',
    'Post-test dibuka':'Siswa yang memindai QR akan langsung bisa mengerjakan post-test.', 'Selesai':'Siswa tidak bisa lagi mengirim post-test (tenggang 5 menit untuk yang sedang mengirim).' }[status];
  if(!confirm(label+' untuk '+S.kode+' ('+S.sekolah+')?\n\n'+ket)) return;

    XLSX.writeFile(wb, namaFile('xlsx'));
  }).catch(function(e){ toast(e.message); });
}
function pustakaPDF(){ return muatSkrip('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js').then(function(){ return muatSkrip('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'); }); }
function kopPDF(doc, judul, sub){
  var w=doc.internal.pageSize.getWidth();
  try{ doc.addImage(LOGO_PEMKAB,'PNG',14,10,14,16); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('SATUAN POLISI PAMONG PRAJA KABUPATEN SUMEDANG',32,15);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text('Bidang Penegakan Perundang-undangan Daerah',32,20);
  doc.setDrawColor(18,48,122); doc.setLineWidth(0.6); doc.line(14,28,w-14,28);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(judul,14,37);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text(doc.splitTextToSize(sub,w-28),14,43); doc.setTextColor(0);
  return 50;
}
function kakiPDF(doc){ var n=doc.getNumberOfPages(), w=doc.internal.pageSize.getWidth(), h=doc.internal.pageSize.getHeight();
  for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text('Dicetak '+tglIndo(D.hariIni)+' oleh '+ME.nama+' · Dokumen internal',14,h-8); doc.text('Hal. '+i+'/'+n,w-14,h-8,{align:'right'}); doc.setTextColor(0); } }
function eksporPDF(){
  var list=kasusTersaring();
  pustakaPDF().then(function(){
    var doc=new jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    var y=kopPDF(doc,'Rekap Kasus PPUD', ketFilter()+' · '+list.length+' kasus · per '+tglIndo(D.hariIni,true));
    doc.autoTable({ startY:y, head:[['No. Kasus','Dibuka','Objek / ringkasan','Kategori','Lokasi','Aturan','Tahap','Tenggat / hasil']],
      body:list.map(function(k){ return [k.no, tglIndo(k.tanggalDibuka), judulKasus(k)+(k.objek&&k.ringkasan?'\n'+k.ringkasan:''), k.kategori, 'Kec. '+k.kecamatan+'\n'+k.desa, k.aturan||'-',
        (k.tahap||'-')+(k.tanggalTahap?'\n'+tglIndo(k.tanggalTahap):''), k.status==='Selesai'?'Selesai '+tglIndo(k.tanggalSelesai)+'\n'+k.hasil:(k.tenggat?tglIndo(k.tenggat)+(lewat(k)?'\nLEWAT TENGGAT':''):'-')]; }),
      styles:{fontSize:8, cellPadding:1.8, valign:'top'}, headStyles:{fillColor:[18,48,122]}, columnStyles:{0:{cellWidth:30},1:{cellWidth:20},5:{cellWidth:55}},
      didParseCell:function(h){ if(h.section==='body'&&h.column.index===7&&String(h.cell.raw).indexOf('LEWAT')>=0) h.cell.styles.textColor=[180,35,24]; } });
    kakiPDF(doc); doc.save(namaFile('pdf'));
  }).catch(function(e){ toast(e.message); });
}
function pdfKasus(no){
  var k=D.kasus.filter(function(x){ return x.no===no; })[0], riw=riwayatKasus(no);
  pustakaPDF().then(function(){
    var doc=new jspdf.jsPDF({unit:'mm', format:'a4'});
    var y=kopPDF(doc,'Ringkasan Kasus '+k.no, judulKasus(k)+' · status '+k.status+(k.status==='Selesai'?' ('+k.hasil+')':''));
    var baris=[['Tanggal dibuka',tglIndo(k.tanggalDibuka)],['Asal kasus',k.asal+(k.tiket.length?' ('+k.tiket.join(', ')+')':'')],['Kategori',k.kategori],['Ringkasan',k.ringkasan],['Aturan dilanggar',k.aturan||'-'],['Uraian',k.uraian||'-'],
      ['Pelanggar',k.pelanggar||'-'],['Usaha/objek',k.objek||'-'],['NIK',k.nik||'-'],['No. HP',k.hp?'+'+k.hp:'-'],['Alamat pelanggar',k.alamatPelanggar||'-'],
      ['Lokasi',(k.alamat?k.alamat+', ':'')+'Desa/Kel. '+k.desa+', Kec. '+k.kecamatan+(k.lat?' ('+k.lat+', '+k.lng+')':'')],
      ['Tahap saat ini',(k.tahap||'-')+(k.tenggat&&k.status!=='Selesai'?' · tenggat '+tglIndo(k.tenggat)+(lewat(k)?' (LEWAT)':''):'')]];
    if(k.status==='Selesai') baris.push(['Selesai',tglIndo(k.tanggalSelesai)+' · '+k.hasil]);
    if(k.catatan) baris.push(['Catatan',catatanTampil(k.catatan)]);
    doc.autoTable({ startY:y, body:baris, theme:'plain', styles:{fontSize:9, cellPadding:1.5}, columnStyles:{0:{cellWidth:38, fontStyle:'bold', textColor:[90,90,90]}} });
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Riwayat tahapan', 14, doc.lastAutoTable.finalY+9);
    doc.autoTable({ startY:doc.lastAutoTable.finalY+12, head:[['Tanggal','Tahap','Nomor surat','Tenggat','Petugas / catatan','Berkas']],
      body: riw.length ? riw.map(function(r){ return [tglIndo(r.tanggal), r.tahap, r.nomorSurat||'-', r.tenggat?tglIndo(r.tenggat):'-', (KHUSUS[r.tahap]?['Oleh '+nm(r.dicatatOleh),r.catatan]:[r.petugas,r.catatan]).filter(String).join('\n')||'-', String(r.berkas.length)]; }) : [['-','Belum ada tahap','','','','']],
      styles:{fontSize:8.5, cellPadding:1.8, valign:'top'}, headStyles:{fillColor:[18,48,122]}, columnStyles:{0:{cellWidth:22},1:{cellWidth:34},3:{cellWidth:22},5:{cellWidth:14}} });
    kakiPDF(doc); doc.save('kasus-'+k.no+'.pdf');
  }).catch(function(e){ toast(e.message); });
}
