<head>
<meta charset="utf-8">

<title>Dashboard PPUD · Satpol PP Kab. Sumedang</title>

<link rel="icon" type="image/png" href="/favicon.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style id="tpGaya"></style>
<script>
/* Tampilan (Pengaturan › Tampilan): nama, warna, SEO dari localStorage ppud_tampilan (salinan terakhir dari server, aksi publik "tampilan").
   Dipasang sebelum halaman digambar; logo & teks di halaman dipasang tpTerapkanDOM() di skrip utama. Bawaan = nilai sebelum fitur ini ada. */
(function(){
  var B=window.TP_BAWAAN={ nama:'Dashboard PPUD', organisasi:'Satpol PP Kab. Sumedang', organisasiLengkap:'Satuan Polisi Pamong Praja Kabupaten Sumedang',
    tagline:'Bidang Penegakan Perundang-undangan Daerah', utama:'#1f4bb5', gelap:'#12307a', lembut:'#dbe8ff',
    deskripsi:'', keywords:'', author:'Satpol PP Kab. Sumedang', canonical:'https://ppud.my.id/dashboard/', locale:'id_ID', robots:'noindex, nofollow',
    kop1:'PEMERINTAH KABUPATEN SUMEDANG', kop2:'SATUAN POLISI PAMONG PRAJA', kop3:'Alamat : Jl. Pangaduan Heubeul No.48, No. Tlp: (0261) 201811,', kop4:'Website : satpolpp.sumedangkab.go.id  E-mail : satpol.pp@sumedangkab.go.id, Sumedang 45311' };
  function rgb(h){ h=String(h||'').replace('#',''); return [0,2,4].map(function(i){ return parseInt(h.substr(i,2),16)||0; }); }
  function campur(a,b,p){ var x=rgb(a), y=rgb(b); return '#'+x.map(function(v,i){ var c=Math.round(v*(1-p)+y[i]*p); return (c<16?'0':'')+c.toString(16); }).join(''); }
  window.tpRgb=rgb; window.tpCampur=campur;
  window.tpNilai=function(k){ var t=window.TP_AKTIF; return t && t[k]!=null && t[k]!=='' ? t[k] : B[k]; };
  window.tpCSS=function(t){
    t=t||{}; var u=t.utama||B.utama, g=t.gelap||B.gelap, l=t.lembut||B.lembut, c='';
    if(u===B.utama && g===B.gelap && l===B.lembut) return '';
    var gr=rgb(g), gd=rgb(campur(g,'#000000',.35));
    c+='html:root{--biru:'+g+';--biru2:'+u+';--birubg:'+l+';--aksen:'+g+'}';
    /* tema gelap: turunan otomatis (biru2/aksen lebih terang, birubg gelap) karena nilai terang tidak terbaca di latar gelap */
    c+='html[data-tema=gelap]:root{--biru2:'+campur(u,'#ffffff',.45)+';--aksen:'+campur(u,'#ffffff',.58)+';--birubg:'+campur(g,'#182030',.62)+'}';
    c+='body .login{background:linear-gradient(160deg,rgba('+gr.join(',')+',.62),rgba('+gd.join(',')+',.82)),url(bg-login.jpg) center/cover no-repeat,var(--biru)}';
    c+='body .diseret{box-shadow:0 8px 22px rgba('+gr.join(',')+',.22)}';
    return c; };   /* selektor sengaja lebih spesifik: <style id=tpGaya> berada sebelum gaya utama */
  function meta(attr,k,v){ var m=document.head.querySelector('meta['+attr+'="'+k+'"]');
    if(!v){ if(m) m.remove(); return; } if(!m){ m=document.createElement('meta'); m.setAttribute(attr,k); document.head.appendChild(m); } m.setAttribute('content',v); }
  window.tpTerapkanKepala=function(t){
    window.TP_AKTIF=t||null; var n=tpNilai;
    var st=document.getElementById('tpGaya'); if(st) st.textContent=tpCSS(t);
    document.title=n('nama')+' · '+n('organisasi');
    meta('name','description',n('deskripsi')); meta('name','keywords',n('keywords')); meta('name','author',n('author')); meta('name','robots',n('robots'));
    meta('property','og:type','website'); meta('property','og:title',n('nama')+' — '+n('organisasi')); meta('property','og:description',n('deskripsi'));
    meta('property','og:url',n('canonical')); meta('property','og:locale',n('locale')); meta('property','og:site_name',n('nama'));
    meta('name','twitter:card','summary'); meta('name','twitter:title',n('nama')+' — '+n('organisasi')); meta('name','twitter:description',n('deskripsi'));
    var c=document.head.querySelector('link[rel=canonical]'); if(n('canonical')){ if(!c){ c=document.createElement('link'); c.rel='canonical'; document.head.appendChild(c); } c.href=n('canonical'); } else if(c) c.remove();
    if(window.terapkanTema) terapkanTema(); };
  var t=null; try{ t=JSON.parse(localStorage.getItem('ppud_tampilan')); }catch(e){}
  tpTerapkanKepala(t);
})();
/* Tema (per perangkat): localStorage ppud_tema = sistem | terang | gelap. Dipasang sebelum halaman digambar. */
(function(){ var mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
  window.temaPilihan=function(){ try{ return localStorage.getItem('ppud_tema')||'sistem'; }catch(e){ return 'sistem'; } };
  window.terapkanTema=function(){ var p=temaPilihan(), g=p==='gelap'||(p==='sistem'&&mq&&mq.matches); document.documentElement.setAttribute('data-tema', g?'gelap':'terang');
    var m=document.querySelector('meta[name=theme-color]'); var gl=(window.tpNilai?tpNilai('gelap'):'#12307a'); if(m) m.setAttribute('content', g?(window.tpCampur&&gl!=='#12307a'?tpCampur(gl,'#000000',.4):'#0b1a3f'):gl); };
  terapkanTema(); if(mq){ if(mq.addEventListener) mq.addEventListener('change', terapkanTema); else if(mq.addListener) mq.addListener(terapkanTema); }
})();
</script>
<style>

function $(s, r){ return (r||document).querySelector(s); }

function tglIndo(t, hari){ if(!t) return '–'; var p=t.slice(0,10).split('-'); if(p.length<3) return t;
  var s=Number(p[2])+' '+BLN[Number(p[1])-1]+' '+p[0];
  if(hari){ var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); s=HARI[d.getUTCDay()]+', '+s; } return s; }
function waktuIndo(w){ if(!w) return '–'; return tglIndo(w.slice(0,10))+(w.length>10?' '+w.slice(11,16):''); }
function hariIni(){ var d=new Date(Date.now()+7*3600e3); return d.toISOString().slice(0,10); }
function liburSet(){ var s={}; (D.libur||[]).forEach(function(l){ if(l.dihitung) s[l.tanggal]=1; }); return s; }
function tambahHK(t,n){ var lib=liburSet(), p=t.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;
  while(c<n){ d.setUTCDate(d.getUTCDate()+1); var w=d.getUTCDay(), s=d.toISOString().slice(0,10); if(w&&w!==6&&!lib[s]) c++; }
  return d.toISOString().slice(0,10); }
function selisihHK(a,b){ if(a===b) return 0; var lib=liburSet(), m=a<b?1:-1, x=a<b?a:b, y=a<b?b:a, p=x.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;
  while(d.toISOString().slice(0,10)<y){ d.setUTCDate(d.getUTCDate()+1); var w=d.getUTCDay(), s=d.toISOString().slice(0,10); if(w&&w!==6&&!lib[s]) c++; }
  return c*m; }

function nm(u){ return u ? ((D && D.nama && D.nama[u]) || u) : ''; }
function catatanTampil(c){ return String(c||'').replace(/\[(Penutupan|Dibuka kembali) (\d{4}-\d{2}-\d{2})(?: \u00b7 ([^\]]+))?\]/g, function(_,j,t,u){ return '['+j+' '+tglIndo(t)+(u?' \u00b7 '+nm(u):'')+']'; }); }

/* Tenggat tahap saat ini dihitung x 24 jam (hari kalender)? Dilihat dari entri tahap terakhir kasus itu. */
function tenggat24(k){ var e=null; (D.riwayat||[]).forEach(function(r){ if(r.no===k.no && r.tahap===k.tahap && r.tanggal===k.tanggalTahap) e=r; }); return !!(e && e.hitungan==='24 Jam'); }
function selisihHari(a,b){ var p=a.split('-').map(Number), q=b.split('-').map(Number); return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/864e5); }
function pilTenggat(k){
  if(k.status==='Selesai') return '<span class="pill p-hijau">Selesai</span>';
  if(!k.tenggat) return '<span class="sub">–</span>';
  var j24=tenggat24(k), n=j24?selisihHari(D.hariIni,k.tenggat):selisihHK(D.hariIni,k.tenggat);
  if(k.tenggat<D.hariIni) return '<span class="pill p-merah">Lewat '+Math.max(1,-n)+(j24?' hari':' hari kerja')+'</span>';
  if(k.tenggat===D.hariIni) return '<span class="pill p-merah">Hari ini</span>';
  return '<span class="pill '+(n<=1?'p-kuning':'p-biru')+'">'+tglIndo(k.tenggat)+' · sisa '+n+(j24?' hari':' hk')+'</span>'; }

/* Permintaan baca diulang sekali (jeda 1 dtk) bila gagal tersambung; permintaan simpan tidak diulang supaya tidak dobel.

var API_BACA = { laporanAtur:1, laporanSumber:1, data:1, berkas:1, suratData:1, bestieData:1, bestieRekap:1, daftarPengguna:1, cariTempat:1, agendaBerkas:1, agendaArsipData:1, logAktivitas:1, statusSistem:1, kategoriDaftar:1 };

function api(action, data){
  muat(true);
  var body = JSON.stringify(Object.assign({ action: action, token: TOKEN, aktif: diamSelama() < BATAS_DIAM }, data||{}));
  var t0 = Date.now(), ulang = 0;
  function kirim(){
    return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body })
      .then(function(r){ return r.json(); })
      .catch(function(){
        if(API_BACA[action] && !ulang){ ulang=1; return new Promise(function(ok){ setTimeout(ok, 1000); }).then(kirim); }
        catatKinerja({ w:t0, a:action, ms:Date.now()-t0, u:ulang, g:1 });
        throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); });
  }
  return kirim()
    .then(function(j){
      var s=j._srv||{}; catatKinerja({ w:t0, a:action, ms:Date.now()-t0, s:s.ms, c:s.c?1:0, u:ulang, e:j.ok?0:1 });
      if(!j.ok){ if(j.sesiHabis){ keluar(j.error); } throw new Error(j.error||'Terjadi kesalahan.'); }
      if(j._cfUbah) cfTandaiUbah(j._cfUbah, j._cfWaktu);
      terakhirGoogle=Date.now();
      return j; })
    .finally(function(){ muat(false); });
}
/* ---- Baca dari salinan Cloudflare (akun ke-2, data.ppud.my.id); data asli & semua simpan tetap di Google ----

var CF_PPUD = 'https://data.ppud.my.id/';
function cfPost(o){
  var ctl=window.AbortController?new AbortController():null, t=ctl?setTimeout(function(){ ctl.abort(); },8000):null;

    .then(function(r){ return r.json(); }).finally(function(){ if(t) clearTimeout(t); });
}
function cfKunci(baru){
  if(!baru){ var x=ambil('ppud_cf'); if(x && ME && x.u===ME.username && x.k) return Promise.resolve(x.k); }
  return cfPost({ action:'masuk', token:TOKEN }).then(function(j){ if(!j || !j.ok) throw new Error(j && j.error || 'Izin baca ditolak');

}
function cfTandaiUbah(jenis, w){ var m=ambil('ppud_cfmin')||{}; if(!ME || m.u!==ME.username) m={ u:ME?ME.username:'' }; jenis.forEach(function(x){ m[x]=Math.max(m[x]||0, w||Date.now()); }); simpan('ppud_cfmin', m); }
function cfBaca(jenis){
  var t0=Date.now();
  var pakai=function(k){ return cfPost({ action:'baca', kunci:k, jenis:jenis, token:TOKEN, aktif: diamSelama() < BATAS_DIAM }); };
  return cfKunci().then(pakai).then(function(j){
      if(j && !j.ok && /Izin baca/.test(j.error||'')){ simpan('ppud_cf', null); return cfKunci(true).then(pakai); }
      return j; })
    .then(function(j){
      if(!j || !j.ok || !j._cf) throw new Error(j && j.error || 'Salinan tidak tersedia');
      var m=ambil('ppud_cfmin')||{}; if(ME && m.u===ME.username && (m[jenis]||0) > j._cf.versi) throw new Error('Salinan belum memuat perubahan terakhir');
      catatKinerja({ w:t0, a:'cf:'+jenis, ms:Date.now()-t0 }); return j; })
    .catch(function(e){ catatKinerja({ w:t0, a:'cf:'+jenis, ms:Date.now()-t0, g:1 }); throw e; });
}

/* Karena data kini dibaca dari Cloudflare, sesi login di Google tidak lagi ikut diperpanjang oleh setiap baca.
   jagaSesi(): selama pengguna aktif, menyapa Google (aksi ringan cekToken) paling jarang tiap 10 menit dan sekali saat halaman dibuka;
   sesi diperpanjang, dan bila ternyata sudah berakhir pengguna langsung diminta login ulang (bukan baru ketahuan saat menyimpan). */
var terakhirGoogle=0, sedangJaga=false;
function jagaSesi(paksa){
  if(!TOKEN || sedangJaga || diamSelama() >= BATAS_DIAM) return;
  if(!paksa && Date.now()-terakhirGoogle < 10*60*1000) return;
  sedangJaga=true;
  api('cekToken').then(function(j){ if(j.me){ ME=Object.assign({}, ME, j.me); simpan('ppud_sesi',{token:TOKEN, me:ME}); if(D) D.me=ME; } })
    .catch(function(){}).finally(function(){ sedangJaga=false; });
}

/* Halaman tersembunyi #kinerja: ringkasan 200 permintaan terakhir di perangkat ini. */
function vKinerja(){
  var l=[]; try{ l=JSON.parse(localStorage.getItem('ppud_kinerja')||'[]'); }catch(e){}
  var md=function(a){ a=a.slice().sort(function(x,y){ return x-y; }); return a.length?a[Math.floor(a.length/2)]:0; };
  var p90=function(a){ a=a.slice().sort(function(x,y){ return x-y; }); return a.length?a[Math.min(a.length-1,Math.floor(a.length*0.9))]:0; };
  var dt=function(ms){ return ms==null?'–':(ms/1000).toFixed(1).replace('.',',')+' dtk'; };
  var per={}; l.forEach(function(x){ var p=per[x.a]=per[x.a]||{ n:0, ms:[], c:0, g:0, u:0 }; p.n++; if(!x.g) p.ms.push(x.ms); if(x.c) p.c++; if(x.g) p.g++; if(x.u) p.u++; });
  var h=pgBar()+'<div class="kepalaB"><h'+(pgBar()?'2 style="margin:0"':'1')+'>Kinerja server</h'+(pgBar()?'2':'1')+'><div class="alatB"><button class="btn" onclick="if(confirm(\'Hapus catatan kinerja di perangkat ini?\')){ localStorage.removeItem(\'ppud_kinerja\'); vKinerja(); }">Hapus catatan</button></div></div>'+
    '<p class="sub">'+l.length+' permintaan terakhir di perangkat ini. "Total" = waktu tunggu di layar; "server" = lama proses di Apps Script; "simpanan" = dilayani dari simpanan server; "diulang" = gagal sekali lalu dicoba ulang otomatis.</p>'+
    '<div class="kartu"><table class="t"><thead><tr><th>Aksi</th><th style="text-align:right">Jumlah</th><th style="text-align:right">Total (median)</th><th style="text-align:right">Total (9 dari 10 di bawah)</th><th style="text-align:right">Dari simpanan</th><th style="text-align:right">Diulang</th><th style="text-align:right">Gagal</th></tr></thead><tbody>'+
    Object.keys(per).sort(function(a,b){ return per[b].n-per[a].n; }).map(function(k){ var p=per[k];
      return '<tr><td>'+esc(k)+'</td><td style="text-align:right">'+p.n+'</td><td style="text-align:right">'+dt(md(p.ms))+'</td><td style="text-align:right">'+dt(p90(p.ms))+'</td><td style="text-align:right">'+p.c+'</td><td style="text-align:right">'+p.u+'</td><td style="text-align:right">'+p.g+'</td></tr>'; }).join('')+
    '</tbody></table></div><div class="kartu" style="margin-top:12px"><h2>30 permintaan terakhir</h2><table class="t"><thead><tr><th>Waktu</th><th>Aksi</th><th style="text-align:right">Total</th><th style="text-align:right">Server</th><th>Keterangan</th></tr></thead><tbody>'+
    l.slice(-30).reverse().map(function(x){ var d=new Date(x.w);
      return '<tr><td>'+d.toLocaleString('id-ID',{ day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', second:'2-digit' })+'</td><td>'+esc(x.a)+'</td><td style="text-align:right">'+dt(x.ms)+'</td><td style="text-align:right">'+dt(x.s)+'</td><td>'+
        [x.c?'simpanan':'', x.u?'diulang':'', x.g?'gagal tersambung':'', x.e?'ditolak server':''].filter(String).join(', ')+'</td></tr>'; }).join('')+'</tbody></table></div>';
  $('#isi').innerHTML=h;
}

/* Isi otomatis (Keychain + Face ID/Touch ID, pengelola sandi): begitu username & password terisi otomatis, langsung masuk.
   Mengetik manual tetap menekan Masuk. Bila login otomatis gagal, tidak diulang sampai kolom diubah manual. */
var LG_OTO=false;   // true = kiriman terakhir berasal dari isi otomatis
function lgOtoHasil(ok){ if(LG_OTO && !ok) lgOtoGagal=true; if(ok) lgOtoGagal=false; LG_OTO=false; }
var lgOtoGagal=false;
(function(){
  var u=$('#lgUser'), p=$('#lgPass'), lalu={ lgUser:'', lgPass:'' }, oto=false, t=null;
  function coba(){ clearTimeout(t); t=setTimeout(function(){
    if(!oto || lgOtoGagal || $('#lgBtn').disabled || $('#layarLogin').classList.contains('hide')) return;
    if(!u.value.trim() || !p.value) return;
    oto=false; LG_OTO=true;
    var f=$('#formLogin'); if(f.requestSubmit) f.requestSubmit($('#lgBtn')); else $('#lgBtn').click();
  }, 350); }
  function cek(e){ var el=e.target, v=el.value, lompat=v.length-(lalu[el.id]||'').length; lalu[el.id]=v;
    var it=e.inputType;
    if(it==='insertText' || it==='deleteContentBackward' || it==='insertCompositionText'){ lgOtoGagal=false; oto=false; return; }   // diketik manual
    if(el===p && v && (it===undefined || it==='' || it==='insertReplacementText') && lompat>1){ oto=true; coba(); }
  }
  [u,p].forEach(function(el){ el.addEventListener('input', cek); el.addEventListener('change', function(){ if(oto) coba(); }); });
  p.addEventListener('animationstart', function(e){ if(e.animationName==='lgOto' && p.value){ oto=true; coba(); } });
})();

    if(c && c.u===ME.username && c.d && Date.now()-(c.w||0) < 7*864e5){ D=c.d; D.me=ME; try{ render(); dariSimpan=true; tandaSegar(true); }catch(e){ D=null; } }

/* Tarik-lepas (pegangan ⠿) untuk mengurutkan baris. pindah(dari, ke) dipanggil setelah dilepas. Jalan dengan mouse & sentuh. */
var SR_PEGANG='<span class="pegang" title="Tarik untuk mengurutkan" aria-label="Tarik untuk mengurutkan">⠿</span>';
function srSeret(wadah, pilih, pindah){
  if(!wadah) return;
  [].forEach.call(wadah.querySelectorAll('.pegang'), function(h){
    var baris=h.closest(pilih); if(!baris || baris.parentNode!==wadah) return;
    h.onpointerdown=function(e){
      if(e.button>0) return; e.preventDefault();
      var semua=[].filter.call(wadah.children, function(r){ return r.matches(pilih); }), dari=semua.indexOf(baris), ke=dari;
      if(semua.length<2) return;
      var sy0=window.scrollY, y0=e.clientY, ky=y0, kotak=semua.map(function(r){ var b=r.getBoundingClientRect(); return { a:b.top+sy0, t:b.height }; });
      var jarak=semua.length>1 ? (dari<semua.length-1 ? kotak[dari+1].a-kotak[dari].a : kotak[dari].a-kotak[dari-1].a+kotak[dari].t-kotak[dari-1].t) : kotak[dari].t;
      baris.classList.add('diseret'); document.body.classList.add('lagiSeret');
      semua.forEach(function(r,i){ if(i!==dari) r.classList.add('ikutGeser'); });
      try{ h.setPointerCapture(e.pointerId); }catch(x){}
      var gulir=0, raf=0;
      function hitung(){
        var dy=ky+window.scrollY-(y0+sy0), tengah=ky+window.scrollY; ke=dari;
        for(var i=0;i<semua.length;i++){ if(i===dari) continue; var m=kotak[i].a+kotak[i].t/2;
          if(i>dari && tengah>m) ke=i; if(i<dari && tengah<m && ke===dari) ke=i; }
        baris.style.transform='translateY('+dy+'px)';
        semua.forEach(function(r,i){ if(i===dari) return; var g=0;
          if(dari<ke && i>dari && i<=ke) g=-jarak; if(dari>ke && i<dari && i>=ke) g=jarak; r.style.transform=g?'translateY('+g+'px)':''; });
      }
      function langkah(){ raf=0; if(!gulir) return; window.scrollBy(0,gulir); hitung(); raf=requestAnimationFrame(langkah); }
      function gerak(ev){ ky=ev.clientY; var H=window.innerHeight;
        gulir= ky<90 ? -Math.ceil((90-ky)/6) : ky>H-90 ? Math.ceil((ky-(H-90))/6) : 0;
        if(gulir && !raf) raf=requestAnimationFrame(langkah); hitung(); }
      function lepas(){
        h.removeEventListener('pointermove',gerak); h.removeEventListener('pointerup',lepas); h.removeEventListener('pointercancel',lepas);
        gulir=0; if(raf) cancelAnimationFrame(raf);
        semua.forEach(function(r){ r.style.transform=''; r.classList.remove('diseret','ikutGeser'); }); document.body.classList.remove('lagiSeret');
        if(ke!==dari) pindah(dari, ke);
      }
      h.addEventListener('pointermove',gerak); h.addEventListener('pointerup',lepas); h.addEventListener('pointercancel',lepas);
    };
  });
}

function srPeringatan(){
  srRata(); var w=[], g=SuratDocx.validasi(SF);
  SF.jadwal.forEach(function(j,ji){
    var nm2=SF.jadwal.length>1?'Jadwal '+(ji+1)+': ':'';
    var lihat={}; j.personel.forEach(function(p){ var k=(p.nip||p.nama).toLowerCase(); if(lihat[k]) w.push(nm2+p.nama+' tercantum dua kali.'); lihat[k]=1; });
    srTim(j).forEach(function(t,ti){ if(t.personel.length>1 && !t.personel.some(function(p){ return p.koor; })) w.push(nm2+(j.tim.length>1?srNamaTim(t,ti)+' ':'')+'belum ada koordinator.'); });
    if(j.tim.length>1) j.tim.forEach(function(t,ti){ if(!t.personel.length) w.push(nm2+srNamaTim(t,ti)+' belum ada personel.'); });
    for(var k=ji+1;k<SF.jadwal.length;k++){ var b=SF.jadwal[k];
      if(!j.tanggal || j.tanggal!==b.tanggal) continue;
      var a1=j.jamMulai||'00:00', a2=j.jamSelesai||'23:59', b1=b.jamMulai||'00:00', b2=b.jamSelesai||'23:59';
      if(a1<b2 && b1<a2) j.personel.forEach(function(p){ if(b.personel.some(function(q){ return (q.nip&&q.nip===p.nip) || q.nama===p.nama; })) w.push(p.nama+' bertugas di jadwal '+(ji+1)+' dan '+(k+1)+' pada waktu yang bentrok.'); }); }
  });
  return { galat:g, peringatan:w };
}

/* Perangkat daerah (sheet "Perangkat Daerah"): pilih pimpinan sebagai Yth., lalu cq. dari daftar unitnya. */
function unNorm(t){ return String(t||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function unPerangkatDari(nama){ var n=unNorm(nama); if(!n) return null; return (SRD.perangkat||[]).filter(function(p){ return unNorm(p.yth)===n; })[0]||null; }
function unUnit(pd){ return String(pd.unit||'').split('\n').map(function(l){ var m=l.match(/^\s*(-*)\s*(.*?)\s*$/); return { lvl:Math.min(2,m[1].length), nama:m[2] }; }).filter(function(u){ return u.nama; }); }
var unKetik={};   // baris penerima yang cq.-nya sedang diketik sendiri
function unCqDikenal(pd, cq){ return unUnit(pd).some(function(u){ return unNorm(u.nama)===unNorm(cq); }); }
function unPilihCq(pd, cq, i){
  var U=unUnit(pd); if(!U.length) return ''; var ada=unCqDikenal(pd, cq), lain=(cq&&!ada)||unKetik[i];
  return '<select data-cq="'+i+'" style="width:100%;margin-top:4px" aria-label="cq. dari daftar">'+
    '<option value=""'+(!cq&&!lain?' selected':'')+'>cq. (opsional): pilih bidang/bagian…</option>'+
    U.map(function(u){ var on=!lain&&unNorm(u.nama)===unNorm(cq); return '<option value="'+esc(u.nama)+'"'+(on?' selected':'')+'>'+(u.lvl?new Array(u.lvl*2-1).join('\u00a0\u00a0')+'– ':'')+esc(u.nama)+'</option>'; }).join('')+
    (cq?'<option value="__tanpa">(tanpa cq.)</option>':'')+'<option value="__lain"'+(lain?' selected':'')+'>Ketik cq. sendiri…</option></select>';
}

  modal('Pilih perangkat daerah', '<div class="alat"><input type="search" id="unPDq" placeholder="Cari dinas, badan, camat…" value="'+esc(unSaringPD.q)+'"></div>'+
    '<div class="seg" id="unPDk" style="margin-bottom:10px;display:flex;flex-wrap:wrap"><button data-k="">Semua</button>'+K.map(function(k){ return '<button data-k="'+esc(k)+'">'+esc(k)+'</button>'; }).join('')+'</div>'+
    '<div class="sub" style="margin-bottom:6px">cq. (bidang/bagian/seksi) dipilih setelah ditambahkan, di baris penerima.</div>'+
    '<div class="pilihL" id="unPDL"></div><div class="aksi"><span class="sub" id="unPDn" style="margin-right:auto"></span><button class="btn" onclick="tutupModal()">Batal</button><button class="btn utama" id="unPDok">Tambahkan</button></div>', true);

    var q=unNorm(unSaringPD.q);

    subjek:B.subjek, perintah:B.perintah, objek:B.objek };

/* Pencarian tempat gabungan untuk titik peta (dipakai form lapor publik & form kasus dashboard; teks ini disalin ke keduanya).
 * 1) OpenStreetMap lewat Photon (photon.komoot.io, gratis, tanpa key; dipanggil langsung dari browser): memberi NAMA tempat.
 * 2) Geocoder Google lewat server Apps Script (aksi cariTempat): memberi alamat bila tempat tak ada di OSM.
 * Hasil di Kab. Sumedang diutamakan; hasil Google <120 m dari hasil lain dan hasil bernama sama <400 m digabung (nama OSM dipakai). */
var CARI_KOTAK = { s: -7.05, w: 107.68, n: -6.55, e: 108.25 };
var OSM_JENIS = { mall: 'Pusat perbelanjaan', department_store: 'Pusat perbelanjaan', commercial: 'Kawasan komersial', retail: 'Kawasan komersial',
  supermarket: 'Supermarket', convenience: 'Minimarket', marketplace: 'Pasar', hospital: 'Rumah sakit', clinic: 'Klinik', doctors: 'Klinik',
  school: 'Sekolah', kindergarten: 'Sekolah', university: 'Kampus', college: 'Kampus', park: 'Taman', restaurant: 'Rumah makan', fast_food: 'Rumah makan',
  cafe: 'Kafe', place_of_worship: 'Tempat ibadah', townhall: 'Kantor pemerintah', government: 'Kantor pemerintah', police: 'Kantor polisi',
  bank: 'Bank', fuel: 'SPBU', hotel: 'Penginapan', guest_house: 'Penginapan', industrial: 'Kawasan industri', works: 'Pabrik', factory: 'Pabrik',
  village: 'Desa', hamlet: 'Kampung', suburb: 'Kelurahan', bus_stop: 'Halte', bus_station: 'Terminal', attraction: 'Wisata', viewpoint: 'Wisata',
  waterfall: 'Wisata', peak: 'Gunung', stadium: 'Stadion', sports_centre: 'Olahraga', office: 'Kantor', company: 'Kantor', yes: 'Bangunan' };
function cariDiSumedang(lat, lng) { return lat >= CARI_KOTAK.s && lat <= CARI_KOTAK.n && lng >= CARI_KOTAK.w && lng <= CARI_KOTAK.e; }
function cariJarak(a, b) { var k = 111320, dx = (a.lng - b.lng) * k * Math.cos(a.lat * Math.PI / 180), dy = (a.lat - b.lat) * k; return Math.sqrt(dx * dx + dy * dy); }
function cariOsm(q) {
  var url = function (kotak) {
    return 'https://photon.komoot.io/api/?q=' + encodeURIComponent(q) + '&limit=8&lat=-6.85&lon=107.92' +
      (kotak ? '&bbox=' + [CARI_KOTAK.w, CARI_KOTAK.s, CARI_KOTAK.e, CARI_KOTAK.n].join(',') : '');
  };
  var ubah = function (f) {
    var p = f.properties || {}, c = (f.geometry || {}).coordinates || [];
    if (!p.name || c.length < 2) return null;
    var lat = Number(c[1]), lng = Number(c[0]), lihat = {}, bagian = [];
    [p.street ? p.street + (p.housenumber ? ' No.' + p.housenumber : '') : '', p.locality || p.district, p.city, p.county, p.state].forEach(function (t) {
      t = String(t || '').trim(); var k = t.toLowerCase(); if (t && !lihat[k] && k !== String(p.name).toLowerCase()) { lihat[k] = 1; bagian.push(t); } });
    return { nama: String(p.name), alamat: bagian.join(', '), lat: lat, lng: lng, jenis: OSM_JENIS[p.osm_value] || '', sumber: 'OSM', sumedang: cariDiSumedang(lat, lng) };
  };
  var ambil = function (kotak) {
    return fetch(url(kotak)).then(function (r) { return r.ok ? r.json() : { features: [] }; })
      .then(function (j) { return (j.features || []).map(ubah).filter(Boolean); });
  };
  return ambil(true).then(function (h) { return h.length ? h : ambil(false); }).catch(function () { return []; });
}
/* google: Promise<{ok,hasil}> dari server. Hasil: Promise<{hasil:[...], galat:''}> */
function cariGabung(q, google) {
  var galat = '';
  var g = google.then(function (j) { return (j.hasil || []).map(function (x) { x.sumber = 'Google'; return x; }); })
    .catch(function (e) { galat = (e && e.message) || 'Pencarian gagal.'; return []; });
  return Promise.all([cariOsm(q), g]).then(function (r) {
    var semua = [];
    r[0].concat(r[1]).forEach(function (x) {
      var dobel = semua.filter(function (y) { var d = cariJarak(x, y); return (x.sumber === 'Google' && d < 120) || (y.nama.toLowerCase() === x.nama.toLowerCase() && d < 400); })[0];
      if (dobel) { if (!dobel.alamat && x.alamat) dobel.alamat = x.alamat; return; }
      semua.push(x);
    });
    var urut = function (x) { return (x.sumedang ? 0 : 4) + (x.jenis === 'Wilayah' ? 3 : x.jenis === 'Halte' ? 2 : x.sumber === 'OSM' ? 0 : 1); };   // tempat bernama dulu, halte & wilayah di bawah
    semua = semua.map(function (x, i) { x._i = i; return x; }).sort(function (a, b) { return urut(a) - urut(b) || a._i - b._i; })
      .slice(0, 6).map(function (x) { delete x._i; return x; });
    return { hasil: semua, galat: semua.length ? '' : galat };
  });
}

function siapkanBerkas(f){
  return new Promise(function(ok, gagal){
    if(/^image\//.test(f.type) && f.type!=='image/gif'){
      var img=new Image(), url=URL.createObjectURL(f);
      img.onload=function(){ var m=1600, s=Math.min(1, m/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        var d=c.toDataURL('image/jpeg',0.8); if(d.length*0.75>5*1048576) return gagal(new Error('Foto "'+f.name+'" terlalu besar.'));
        ok({ nama: f.name.replace(/\.[^.]+$/,'')+'.jpg', data:d }); };
      img.onerror=function(){ gagal(new Error('Foto "'+f.name+'" tidak dapat dibaca.')); }; img.src=url;
    } else if(f.type==='application/pdf'){
      if(f.size>5*1048576) return gagal(new Error('Berkas "'+f.name+'" lebih dari 5 MB.'));
      var rd=new FileReader(); rd.onload=function(){ ok({ nama:f.name, data:rd.result }); }; rd.onerror=function(){ gagal(new Error('Berkas tidak dapat dibaca.')); }; rd.readAsDataURL(f);
    } else gagal(new Error('"'+f.name+'" bukan foto atau PDF.'));
  });
}

function tglKe(t,n){ var p=t.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n)); return d.toISOString().slice(0,10); }
function hariMinggu(t){ var p=t.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay(); }
function jamKeg(k){ return k.seharian ? 'Sehari penuh' : k.jamMulai+(k.jamSelesai?'–'+k.jamSelesai:''); }
function rentangKeg(k){ return k.selesai!==k.mulai ? tglIndo(k.mulai)+' – '+tglIndo(k.selesai) : tglIndo(k.mulai,true); }
/** Semua isi kalender untuk satu tanggal: libur, kegiatan, tenggat kasus berjalan. */
function isiTanggal(t){
  var out=[];
  (D.libur||[]).forEach(function(l){ if(l.tanggal===t && l.dihitung) out.push({ tipe:'libur', judul:l.keterangan }); });
  (D.kegiatan||[]).forEach(function(k){ if(k.mulai<=t && k.selesai>=t) out.push({ tipe:'keg', k:k, judul:k.nama }); });
  D.kasus.forEach(function(k){ if(k.status!=='Selesai' && k.tenggat===t) out.push({ tipe:'tenggat', kasus:k, judul:'Tenggat '+(k.tahap||'')+' · '+judulKasus(k) }); });
  out.sort(function(a,b){ var o={libur:0,keg:1,tenggat:2}; if(o[a.tipe]!==o[b.tipe]) return o[a.tipe]-o[b.tipe];
    if(a.tipe==='keg'){ var x=a.k.seharian?'':a.k.jamMulai, y=b.k.seharian?'':b.k.jamMulai; return x<y?-1:x>y?1:0; } return 0; });
  return out;
}

function tpKecilkan(f){

        d=c.toDataURL('image/png'); return d.length<=380000; });
      URL.revokeObjectURL(url);
      if(d.length>380000) gagal(new Error('Logo terlalu rumit untuk disimpan. Coba gambar yang lebih sederhana.')); else ok(d); };
    img.onerror=function(){ URL.revokeObjectURL(url); gagal(new Error('Gambar tidak dapat dibaca.')); };
    img.src=url; });

var BESTIE_URL = 'https://ppud.my.id/bestie/';
/* Apps Script BESTIE: aksi 'sinkron' menyalin sesi ke Cloudflare (jalur utama siswa) dan menarik jawaban baru ke sheet */
var BESTIE_API = 'https://script.google.com/macros/s/AKfycbzlveALckwRQXS6Bm8PlBnkDyo8Iq__MvF-EPSaRIxGP_2dIn3DyzsSIbIWQ8KsG0bb/exec';
function sinkronB(paksa){
  var ctl=window.AbortController?new AbortController():null, t=ctl?setTimeout(function(){ ctl.abort(); },40000):null;
  return fetch(BESTIE_API,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ action:'sinkron', paksa:!!paksa }), signal:ctl?ctl.signal:undefined })
    .then(function(r){ return r.json(); }).then(function(j){ if(t) clearTimeout(t); return j; }).catch(function(){ if(t) clearTimeout(t); return null; });
}
function adaBaruB(j){ var d=j&&j.disalin; return !!(d && (d.jawaban+d.kuesioner+d.buklet)>0); }
/* setelah sesi dibuat/diubah/dibuka/ditutup: kirim segera ke Cloudflare (ulang sekali bila sinkron lain sedang berjalan) */
function dorongB(){ return sinkronB(true).then(function(j){ if(j && (j.jalan||j.sibuk)) return new Promise(function(ok){ setTimeout(function(){ sinkronB(true).then(ok); },4000); }); return j; }); }

  var lPre=Object.keys(pre).map(function(k){ return pre[k]; }), lPost=Object.keys(post).map(function(k){ return post[k].best; });
  function ind(l){ var n=l.length; if(!n) return { n:0 };

    return { no:i+1, q:q, pre:pct(lPre), post:pct(lPost) }; });
  var kunci={}; Object.keys(pre).concat(Object.keys(post)).forEach(function(k){ kunci[k]=1; });
  var siswa=Object.keys(kunci).map(function(k){ var a=pre[k], b=post[k]; var ref=b?b.best:a;
    return { kelas:ref.kelas, absen:ref.absen, nama:(b?b.best.nama:a.nama), pre:a?a.skor:null, post:b?b.best.skor:null, nPost:b?b.n:0, semuaPost:b?b.semua:[],

var PK_TES = 'pre';
/* satu baris per siswa: pre = kiriman pertama; post = kiriman dengan benar terbanyak (bila sama, yang tercepat) */
function peringkatB(R, tes){
  var per={};
  R.jawaban.forEach(function(j){ if(j.tes!==tes) return; var k=kunciSiswaB(j), c=per[k];
    if(!c || (tes==='post' && (j.benar>c.benar || (j.benar===c.benar && j.durasi<c.durasi)))) per[k]=j; });
  var l=Object.keys(per).map(function(k){ return per[k]; }).sort(function(a,b){ return b.benar-a.benar || a.durasi-b.durasi; });
  var rank=0; l.forEach(function(x,i){ if(i===0 || x.benar!==l[i-1].benar || x.durasi!==l[i-1].durasi) rank=i+1; x.peringkat=rank; });
  return l;
}
function mmssB(d){ d=Math.max(0,+d||0); return Math.floor(d/60)+':'+('0'+(d%60)).slice(-2); }

  setTimeout(function(){ var sg=$('#segPk'); if(sg) [].forEach.call(sg.querySelectorAll('button'), function(b){ b.onclick=function(){ PK_TES=b.getAttribute('data-t'); var y=window.scrollY; isiRekapB(); window.scrollTo(0,y); }; }); },0);

  try{ doc.addImage(LOGO_PEMKAB,'PNG',14,10,14,16); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(doc.splitTextToSize(tpNilai('organisasiLengkap').toUpperCase(), w-46)[0],32,15);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(doc.splitTextToSize(tpNilai('tagline'), w-46)[0]||'',32,20);
  doc.setDrawColor.apply(doc, tpRgb(tpNilai('gelap'))); doc.setLineWidth(0.6); doc.line(14,28,w-14,28);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(judul,14,37);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text(doc.splitTextToSize(sub,w-28),14,43); doc.setTextColor(0);
  return 50;
}
function kakiPDF(doc){ var n=doc.getNumberOfPages(), w=doc.internal.pageSize.getWidth(), h=doc.internal.pageSize.getHeight();
  for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text('Dicetak '+tglIndo(D.hariIni)+' oleh '+ME.nama+' · Dokumen internal',14,h-8); doc.text('Hal. '+i+'/'+n,w-14,h-8,{align:'right'}); doc.setTextColor(0); } }
function eksporPDF(){

    var y=kopPDF(doc,'Rekap Kasus PPUD', ketFilter()+' · '+list.length+' kasus · per '+tglIndo(D.hariIni,true));
    doc.autoTable({ startY:y, head:[['No. Kasus','Dibuka','Objek / ringkasan','Kategori','Lokasi','Aturan','Tahap','Tenggat / hasil']],
      body:list.map(function(k){ return [k.no, tglIndo(k.tanggalDibuka), judulKasus(k)+(k.objek&&k.ringkasan?'\n'+k.ringkasan:''), k.kategori, 'Kec. '+k.kecamatan+'\n'+k.desa, k.aturan||'-',
        (k.tahap||'-')+(k.tanggalTahap?'\n'+tglIndo(k.tanggalTahap):''), k.status==='Selesai'?'Selesai '+tglIndo(k.tanggalSelesai)+'\n'+k.hasil:(k.tenggat?tglIndo(k.tenggat)+(lewat(k)?'\nLEWAT TENGGAT':''):'-')]; }),
      styles:{fontSize:8, cellPadding:1.8, valign:'top'}, headStyles:{fillColor:tpRgb(tpNilai('gelap'))}, columnStyles:{0:{cellWidth:30},1:{cellWidth:20},5:{cellWidth:55}},

}

/* Laporan Penegakan — pengolah data (tanpa DOM, bisa diuji di Node).
 * Semua sumber diubah dulu ke FORMAT BAKU (satu baris = satu kejadian penegakan):
 *   { bulan:1-12, tanggal:'YYYY-MM-DD'|null, subjek, kecamatan, perdaUtama, perdaPendamping, jenis, jumlah, hasil, keterangan, lok }
 * Pembuat laporan hanya mengenal format baku ini. Sumber saat ini: rekap Excel / Google Sheet (12 sheet bulanan).
 * Nanti cukup ditambah penerjemah dari data kasus dashboard.
 */
var LaporanData = (function () {
  var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  var KEC26 = ['Buahdua', 'Cibugel', 'Cimalaka', 'Cimanggung', 'Cisarua', 'Cisitu', 'Conggeang', 'Darmaraja', 'Ganeas', 'Jatigede',
    'Jatinangor', 'Jatinunggal', 'Pamulihan', 'Paseh', 'Rancakalong', 'Situraja', 'Sukasari', 'Sumedang Selatan',
    'Sumedang Utara', 'Surian', 'Tanjungkerta', 'Tanjungmedar', 'Tanjungsari', 'Tomo', 'Ujungjaya', 'Wado'];
  /* Bawaan Tahap 1 (Tahap 2: diatur di Pengaturan › Laporan) */
  var BAWAAN = {
    padanan: {
      'Bangunan Liar': 'Perda No. 4 Tahun 2018 (RTRW)',
      'Perizinan Bangunan Gedung': 'Perda No. 15 Tahun 2011 & Perbup No. 81 Tahun 2022 (PBG)',
      'Penertiban Bersama': 'Operasi Gabungan Lintas Sektor',
      'PKL': 'Perda No. 7 Tahun 2014 (Ketertiban Umum)',
      'Perizinan Usaha': 'Perda No. 5 Tahun 2021 (Penyelenggaraan Berusaha)',
      'Moratorium Pendirian Minimarket': 'Perbup No. 73 Tahun 2020',
      'Penyakit Masyarakat': 'Perda No. 7 Tahun 2014 (Ketertiban Umum)',
      'Peredaran Minuman Beralkohol': 'Perda No. 17 Tahun 2003'
    },
    ambangKec: { tinggi: 10, sedang: 2 },          // Tinggi ≥10, Sedang 2–9, Rendah 1, Nihil 0
    ambangBln: { rendah: 5, moderat: 20 },         // Rendah 1–5, Moderat 6–20, Tinggi >20; bulan terbanyak = Puncak
    ejaan: { 'PENTUPAN': 'Penutupan', 'Penhentian Sementara': 'Penghentian Sementara' },
    satukan: { 'Bangunan': 'Perizinan Bangunan Gedung' },   // penyatuan nama jenis: nama asal → nama di laporan
    satukanHasil: { 'SP 1': 'Surat Peringatan 1', 'SP 2': 'Surat Peringatan 2', 'SP 3': 'Surat Peringatan 3' }   // penyatuan nama hasil pemantauan / keterangan
  };
  function bersih(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function adaIsi(r) { return r && r.some(function (v) { return v !== null && v !== undefined && String(v).trim() !== ''; }); }

  /* Nilai tanggal dari sheet: Date, 'YYYY-MM-DD…', serial Excel, atau 'dd/mm/yyyy' */
  function tanggal(v) {
    if (v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + ('0' + (v.getMonth() + 1)).slice(-2) + '-' + ('0' + v.getDate()).slice(-2);
    if (typeof v === 'number' && v > 20000 && v < 80000) { var d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
    var s = bersih(v), m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1] + '-' + m[2] + '-' + m[3];
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
    return null;
  }
  function singkatPerda(s) {
    s = bersih(s); if (!s) return '';
    var m = s.match(/^Peraturan (Daerah|Bupati) Kabupaten Sumedang Nomor ([\w.\-\/]+) Tahun (\d{4}) (?:Tentang )?(.+)$/i);
    if (m) return (m[1].toLowerCase() === 'daerah' ? 'Perda' : 'Perbup') + ' No. ' + m[2] + ' Tahun ' + m[3] + ' tentang ' + m[4].replace(/[.;]+$/, '');
    return s.replace(/[;]+$/, '');
  }
  function cocokKec(k) {
    var n = bersih(k).toLowerCase().replace(/^kec(amatan)?\.?\s*/, '');
    for (var i = 0; i < KEC26.length; i++) if (KEC26[i].toLowerCase() === n) return KEC26[i];
    return null;
  }
  function cariKolom(header) {
    var H = header.map(function (h) { return bersih(h).toLowerCase().replace(/\.$/, ''); });
    var c = function (re, cad) { for (var i = 0; i < H.length; i++) if (re.test(H[i])) return i; return cad; };

      jenis: c(/jenis penegakan/, 10), jumlah: c(/jumlah penegakan/, 11), ket: c(/^keterangan/, 13), hasil: c(/hasil pemantauan/, 14) };
  }

  /* sheets: { 'Januari': [[header...],[...],...], ... } → { baku, periksa, tahun } */
  function dariRekap(sheets, opsi) {
    opsi = opsi || {}; var ej = opsi.ejaan || BAWAAN.ejaan;
    var baku = [], periksa = [], tahunHit = {};
    var catat = function (lok, masalah, usul) { periksa.push({ lok: lok, masalah: masalah, usul: usul }); };
    var namaSheet = Object.keys(sheets);
    BULAN.forEach(function (b, bi) {
      var nm = namaSheet.filter(function (n) { return bersih(n).toLowerCase() === b.toLowerCase(); })[0];
      if (!nm) { catat('Sumber', 'Sheet "' + b + '" tidak ditemukan', 'Bulan ini dianggap tanpa data'); return; }
      var rows = sheets[nm] || [], K = cariKolom(rows[0] || []);
      for (var i = 1; i < rows.length; i++) {
        var r = rows[i]; if (!adaIsi(r)) continue;
        var lok = b + ' baris ' + (i + 1), tgl = tanggal(r[K.tgl]), kec = bersih(r[K.kec]), jenis = bersih(r[K.jenis]);

        if (tgl) { tahunHit[tgl.slice(0, 4)] = (tahunHit[tgl.slice(0, 4)] || 0) + 1; if (+tgl.slice(5, 7) !== bi + 1) catat(lok, 'Tanggal ' + tgl.split('-').reverse().join('-') + ' tidak sesuai sheet ' + b, 'Periksa tanggal; dihitung di bulan ' + b); }
        else catat(lok, 'Tanggal kosong/tidak terbaca', 'Dihitung di bulan ' + b);
        var jml = r[K.jumlah], n = typeof jml === 'number' ? jml : parseFloat(String(jml || '').replace(',', '.'));

        if (kec && !kecB) catat(lok, 'Kecamatan "' + kec + '" tidak dikenal', 'Periksa ejaan; dihitung apa adanya');
        if (!kec) catat(lok, 'Kecamatan kosong', 'Masuk "Tidak tercatat"');
        if (!jenis) catat(lok, 'Jenis penegakan kosong', 'Masuk "Tidak tercatat"');
        var hasil = bersih(r[K.hasil]), ket = bersih(r[K.ket]);
        if (ej[hasil]) { catat(lok, 'Hasil pemantauan "' + hasil + '"', 'Ganti menjadi "' + ej[hasil] + '"'); hasil = ej[hasil]; }
        if (ej[ket]) { catat(lok, 'Keterangan "' + ket + '"', 'Ganti menjadi "' + ej[ket] + '"'); ket = ej[ket]; }
        baku.push({ bulan: bi + 1, tanggal: tgl, subjek: bersih(r[K.subjek]), kecamatan: kecB || kec || 'Tidak tercatat',
          perdaUtama: singkatPerda(r[K.perdaU]) || 'Tidak tercatat', perdaPendamping: singkatPerda(r[K.perdaP]),
          jenis: jenis || 'Tidak tercatat', jumlah: Math.round(n), hasil: hasil || null, keterangan: ket || null, lok: lok });
      }
    });
    var tanpaHasil = baku.filter(function (x) { return !x.hasil; });
    if (tanpaHasil.length) {
      var pb = {}; tanpaHasil.forEach(function (x) { var k = BULAN[x.bulan - 1]; pb[k] = (pb[k] || 0) + 1; });
      catat(Object.keys(pb).map(function (k) { return k + ' (' + pb[k] + ')'; }).join(', '), tanpaHasil.length + ' baris tanpa Hasil Pemantauan',
        'Isi bila ada; di rekap tindak lanjut masuk "Belum dicatat"');
    }
    var tahun = Object.keys(tahunHit).sort(function (a, b) { return tahunHit[b] - tahunHit[a]; })[0] || null;
    return { baku: baku, periksa: periksa, tahun: tahun ? +tahun : null };
  }

  /* Satu tabel (CSV / sheet tunggal) → dikelompokkan per bulan menurut kolom Tanggal, lalu diolah seperti rekap. */
  function dariTabel(rows, opsi) {
    var K = cariKolom(rows[0] || []), sheets = {}, lepas = [];
    BULAN.forEach(function (b) { sheets[b] = [rows[0]]; });
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i]; if (!adaIsi(r)) continue;
      var t = tanggal(r[K.tgl]);
      if (!t) { lepas.push(i + 1); continue; }
      var sh = sheets[BULAN[+t.slice(5, 7) - 1]]; sh[i] = r;   // nomor baris asli tetap
    }
    var o = dariRekap(sheets, opsi);
    o.periksa.forEach(function (x) { x.lok = x.lok.replace(/^\S+ baris/, 'Baris'); });
    if (lepas.length) o.periksa.unshift({ lok: 'Baris ' + lepas.slice(0, 8).join(', ') + (lepas.length > 8 ? ', …' : ''), masalah: lepas.length + ' baris tanpa tanggal yang terbaca', usul: 'Tidak dihitung; isi kolom Tanggal' });
    return o;
  }

  /* Data kasus dashboard → format baku. 1 kasus = 1 kejadian, bulan = tanggal dibuka; jenis = Kategori;
   * Perda utama = baris pertama "Aturan yang dilanggar" (baris lain = pendamping). Hasil & keterangan dihitung per akhir periode di hitung().
   * opsi: { mulaiBulan (1–12; 13 = tidak ada), kecualikan: [hasil akhir yang tidak dihitung] } */
  function dariKasus(kasus, riwayat, tahun, opsi) {
    opsi = opsi || {}; var mulai = opsi.mulaiBulan || 1, kecuali = opsi.kecualikan || ['Tidak Terbukti', 'Digabung ke Kasus Lain'];
    var riw = {}; (riwayat || []).forEach(function (r) { var t = tanggal(r.tanggal); if (t) (riw[r.no] = riw[r.no] || []).push({ tahap: r.tahap, tanggal: t }); });
    Object.keys(riw).forEach(function (k) { riw[k].sort(function (a, b) { return a.tanggal < b.tanggal ? -1 : a.tanggal > b.tanggal ? 1 : 0; }); });
    var baku = [], periksa = [], tanpa = { aturan: [], kec: [], kat: [], tgl: [] }, kecuali0 = 0;
    (kasus || []).forEach(function (k) {
      var t = tanggal(k.tanggalDibuka);
      if (!t) { tanpa.tgl.push(k.no); return; }
      if (+t.slice(0, 4) !== +tahun || +t.slice(5, 7) < mulai) return;
      if (k.status === 'Selesai' && kecuali.indexOf(k.hasil) >= 0) { kecuali0++; return; }
      var at = String(k.aturan || '').split(/\n+/).map(bersih).filter(String);
      var kec = bersih(k.kecamatan), kecB = kec ? cocokKec(kec) : null;
      if (!at.length) tanpa.aturan.push(k.no);
      if (!kecB) tanpa.kec.push(k.no + (kec ? ' (' + kec + ')' : ''));
      if (!bersih(k.kategori)) tanpa.kat.push(k.no);
      baku.push({ bulan: +t.slice(5, 7), tanggal: t, subjek: bersih(k.objek || k.ringkasan || k.no), kecamatan: kecB || kec || 'Tidak tercatat',
        perdaUtama: at.length ? singkatPerda(at[0]) : 'Tidak tercatat', perdaPendamping: at.slice(1).map(singkatPerda).join('; '),
        jenis: bersih(k.kategori) || 'Tidak tercatat', jumlah: 1, hasil: null, keterangan: null, lok: 'Kasus ' + k.no,
        kasus: { riw: riw[k.no] || [], status: k.status, hasil: k.hasil, selesai: tanggal(k.tanggalSelesai) } });
    });
    var daftarNo = function (L) { return L.slice(0, 6).join(', ') + (L.length > 6 ? ', … (' + L.length + ' kasus)' : ''); };

    if (tanpa.kec.length) periksa.push({ lok: daftarNo(tanpa.kec), masalah: 'Kecamatan kosong / tidak dikenal', usul: 'Periksa kecamatan di detail kasus' });
    if (tanpa.kat.length) periksa.push({ lok: daftarNo(tanpa.kat), masalah: 'Kategori kosong', usul: 'Isi kategori di detail kasus' });
    if (tanpa.tgl.length) periksa.push({ lok: daftarNo(tanpa.tgl), masalah: 'Tanggal dibuka tidak terbaca', usul: 'Tidak dihitung; periksa tanggal dibuka' });
    if (kecuali0) periksa.push({ lok: 'Data kasus', masalah: kecuali0 + ' kasus dengan hasil akhir ' + kecuali.join(' / '), usul: 'Tidak dihitung sebagai penegakan (sesuai aturan laporan)', info: true });

  /* jenis: 'bulanan' (nomor 1-12) | 'triwulan' (1-4) | 'tahunan' */
  /* cakupan (bulanan/triwulan): 'periode' = periode itu saja · 'kumulatif' = 1 Januari s.d. akhir periode · 'keduanya' = periode + kolom kumulatif */
  function periode(jenis, nomor, tahun, cakupan) {
    var awal, akhir, judul, nama;
    if (jenis === 'bulanan') { awal = akhir = nomor; nama = 'Bulan ' + BULAN[nomor - 1]; judul = 'BULAN ' + BULAN[nomor - 1].toUpperCase(); }
    else if (jenis === 'triwulan') { awal = (nomor - 1) * 3 + 1; akhir = nomor * 3; nama = 'Triwulan ' + ['I', 'II', 'III', 'IV'][nomor - 1]; judul = nama.toUpperCase(); }
    else { awal = 1; akhir = 12; nama = 'Tahun ' + tahun; judul = ''; }
    cakupan = jenis === 'tahunan' ? 'periode' : (cakupan === 'kumulatif' || cakupan === 'keduanya' ? cakupan : 'periode');
    var kum = cakupan === 'kumulatif'; if (kum) awal = 1;
    var hariAkhir = new Date(Date.UTC(tahun, akhir, 0)).getUTCDate();
    var label = jenis === 'tahunan' ? 'tahun ' + tahun : kum ? (akhir > 1 ? 'periode Januari – ' + BULAN[akhir - 1] + ' ' + tahun : 'bulan Januari ' + tahun) : jenis === 'bulanan' ? 'bulan ' + BULAN[akhir - 1] : nama;
    return { jenis: jenis, nomor: nomor, tahun: tahun, awal: awal, akhir: akhir, nama: nama, cakupan: cakupan, satu: cakupan !== 'keduanya', kum: kum, label: label,
      judul: 'LAPORAN PENEGAKAN ' + (judul ? judul + ' ' : '') + 'TAHUN ' + tahun,
      frase: jenis === 'tahunan' ? 'Tahun ' + tahun : nama + ' Tahun ' + tahun + (kum ? ' secara kumulatif sejak awal tahun' : ''),
      teks: '1 ' + BULAN[awal - 1] + ' – ' + hariAkhir + ' ' + BULAN[akhir - 1] + ' ' + tahun,
      ket: kum ? 'kumulatif sejak awal tahun' : '', blnAkhir: BULAN[akhir - 1], tahunan: jenis === 'tahunan' };
  }

  function hit(rows, key) { var o = {}; rows.forEach(function (x) { var k = x[key] || 'Belum dicatat'; o[k] = (o[k] || 0) + x.jumlah; }); return o; }
  function jml(rows) { return rows.reduce(function (a, x) { return a + x.jumlah; }, 0); }
  function urut(o, o2) { return Object.keys(o).sort(function (a, b) { return (o[b] - o[a]) || ((o2 && (o2[b] || 0) - (o2[a] || 0)) || 0) || a.localeCompare(b, 'id'); }); }

  /* baku + periode → semua angka laporan */
  function hitung(baku, P, opsi) {

function lpUnggah(file){

    return new Promise(function(ok,gagal){ var r=new FileReader(); r.onload=function(){ ok(r.result); }; r.onerror=function(){ gagal(new Error('File tidak dapat dibaca.')); }; r.readAsArrayBuffer(file); });
  }).then(function(buf){
    var wb=XLSX.read(new Uint8Array(buf), { type:'array', cellDates:true });
    var sheets={}; wb.SheetNames.forEach(function(n){ sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{ header:1, raw:true, defval:null, blankrows:true }); });
    var adaBulan=wb.SheetNames.some(function(n){ return LaporanData.BULAN.some(function(b){ return b.toLowerCase()===String(n).trim().toLowerCase(); }); });
    var o=adaBulan ? LaporanData.dariRekap(sheets) : LaporanData.dariTabel(sheets[wb.SheetNames[0]]);
    if(!o.baku.length) throw new Error('Tidak ada baris penegakan yang terbaca dari file ini.');
    o.nama=file.name; o.asal='file'; LP.data=o; LP.ubah={};
    if(o.tahun && o.tahun!==LP.tahun && confirm('Data di file ini tahun '+o.tahun+'. Ganti tahun laporan ke '+o.tahun+'?')){ LP.tahun=o.tahun; vLaporan(); return; }
    lpInfoSumber(); lpHitung();
  }).catch(function(e){ $('#lpSbInfo').textContent=''; toast(e.message||'File tidak dapat dibaca.'); });
}

  var tutup='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  $$('.login input[type=password]').forEach(function(inp){
    var w=document.createElement('div'); w.className='pw'; inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    var b=document.createElement('button'); b.type='button'; b.className='mata'; b.setAttribute('aria-label','Tampilkan password'); b.innerHTML=buka; w.appendChild(b);
    b.addEventListener('click', function(){ var lihat=inp.type==='password'; inp.type=lihat?'text':'password'; b.innerHTML=lihat?tutup:buka; b.setAttribute('aria-label', lihat?'Sembunyikan password':'Tampilkan password'); inp.focus(); });
  });
  ['formLogin','formGanti'].forEach(function(id){ $('#'+id).addEventListener('submit', function(){ $$('#'+id+' .pw input').forEach(function(i){ i.type='password'; }); $$('#'+id+' .mata').forEach(function(b){ b.innerHTML=buka; }); }, true); });
})();
