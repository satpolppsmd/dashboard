<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard PPUD · Satpol PP Kab. Sumedang</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--biru:#12307a;--biru2:#1f4bb5;--kuning:#f7c600;--latar:#eef2f8;--teks:#1d2433;--abu:#5b6475;--garis:#dde3ee;--putih:#fff;
--merah:#b42318;--merahbg:#fde2e1;--hijau:#127a3a;--hijaubg:#d7f2df;--kuningbg:#fff3c4;--kuningtx:#7a5b00;--birubg:#dbe8ff;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--latar);color:var(--teks);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--biru2)}
.hide{display:none!important}
header.top{background:var(--biru);color:#fff;border-bottom:3px solid var(--kuning);position:sticky;top:0;z-index:50}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.top-in img{height:34px}
a.kelogo{display:inline-flex;line-height:0;cursor:pointer}
.judul{font-weight:700;line-height:1.15;font-size:15px}
.judul small{display:block;font-weight:400;opacity:.8;font-size:12px}
.akun{margin-left:auto;position:relative}
.akun>button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.menu{position:absolute;right:0;top:110%;background:#fff;color:var(--teks);border:1px solid var(--garis);border-radius:var(--r);min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.menu div{padding:10px 14px;font-size:13px;color:var(--abu);border-bottom:1px solid var(--garis)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;cursor:pointer}
.menu button:hover{background:var(--latar)}
nav.tab{background:#fff;border-bottom:1px solid var(--garis)}
nav.tab .in{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto}
nav.tab a{padding:11px 14px;text-decoration:none;color:var(--abu);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;display:flex;gap:6px;align-items:center}
nav.tab a.on{color:var(--biru);border-bottom-color:var(--biru)}
nav.tab .n{background:var(--merah);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
main{max-width:1200px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:14px 16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--biru2)}
.stat .l{font-size:13px;color:var(--abu)}
.stat .v{font-size:28px;font-weight:700;line-height:1.2}
.stat.merah{background:var(--merahbg);border-color:#f5b5b0}.stat.merah .v,.stat.merah .l{color:var(--merah)}
.bar{display:grid;grid-template-columns:150px 1fr 32px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar .t{background:var(--latar);border-radius:4px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--biru2);border-radius:4px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--abu)}
.bar b{text-align:right}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;font-weight:500;background:var(--latar);color:var(--abu)}
.p-merah{background:var(--merahbg);color:var(--merah)}.p-hijau{background:var(--hijaubg);color:var(--hijau)}
.p-kuning{background:var(--kuningbg);color:var(--kuningtx)}.p-biru{background:var(--birubg);color:var(--biru)}
.alat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.alat input[type=search]{flex:1 1 220px}
input,select,textarea{border:1px solid #c9d2e3;border-radius:8px;padding:8px 10px;background:#fff;min-height:38px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--biru2);outline-offset:-1px}
.btn{border:1px solid #c9d2e3;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--latar)}
.btn.utama{background:var(--biru);border-color:var(--biru);color:#fff}.btn.utama:hover{background:var(--biru2)}
.btn.bahaya{color:var(--merah);border-color:#f0b3ae}
.btn.kecil{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.seg{display:inline-flex;border:1px solid #c9d2e3;border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;border-right:1px solid #c9d2e3}
.seg button:last-child{border-right:0}.seg button.on{background:var(--biru);color:#fff}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--garis);border-radius:var(--r);overflow:hidden;font-size:14px}
table.t th{background:#f5f7fb;text-align:left;font-weight:600;color:var(--abu);font-size:13px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--garis);vertical-align:top}
table.t tr.klik{cursor:pointer}table.t tr.klik:hover td{background:#f7f9fd}
table.t tr.lewat td:first-child{box-shadow:inset 3px 0 0 var(--merah)}
.sub{color:var(--abu);font-size:13px}
.daftar{display:grid;gap:8px}
.item{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:11px 13px;cursor:pointer}
.item.lewat{border-color:#f0b3ae;box-shadow:inset 4px 0 0 var(--merah)}
.item .a{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item b{font-weight:600}
.kosong{text-align:center;color:var(--abu);padding:30px 10px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px;margin:0}
.dl dt{color:var(--abu)}.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
.lini{position:relative;margin:4px 0 0 6px;padding-left:20px;border-left:2px solid var(--garis)}
.lini .e{position:relative;padding:0 0 16px}
.lini .e:before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--biru2)}
.lini .e.akhir:before{background:var(--biru2)}
.lini .e.lewat:before{border-color:var(--merah);background:var(--merah)}
.lini .e.tutup:before{border-color:#1f8a4c;background:#1f8a4c}.lini .e.tutup b{color:#1f6e3e}
.lini .e.buka:before{border-color:#d49a00;background:#f5c400}.lini .e.buka b{color:#8a6400}
.langkah{display:flex;gap:3px;margin:10px 0 2px}
.langkah span{flex:1;height:6px;border-radius:3px;background:var(--garis)}
.langkah span.ok{background:var(--biru2)}.langkah span.ini{background:var(--kuning)}
.berkas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.foto{display:flex;flex-wrap:wrap;gap:8px}
.foto img,.foto .ph{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--garis);background:var(--latar);cursor:zoom-in}
.foto .ph{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--abu)}
.tutup-bg{position:fixed;inset:0;background:rgba(10,20,45,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:18px 18px 16px}
.modal.lebar{max-width:820px}
.modal .kepala{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.modal .kepala h2{margin:0}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--abu);padding:4px 8px}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--abu);font-weight:500}
.f label.pn{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;color:var(--teks);font-weight:400}
.f .bt{color:var(--merah);font-style:normal}
.galat{color:var(--merah);font-size:13px;margin-top:8px}
.aksi{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.alatPeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.alatPeta select{flex:0 1 auto}
.legenda{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}.legenda .dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:5px;vertical-align:-1px;border:1px solid #fff;box-shadow:0 0 0 1px #c9d2e3}
.petaKosong{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:500;background:rgba(255,255,255,.95);border:1px solid var(--garis);border-radius:8px;padding:8px 12px;font-size:13px;color:#4a5568;text-align:center;max-width:80%;pointer-events:none}.petaKosong[hidden]{display:none}
#peta,#petaPilih{height:300px;border-radius:var(--r);border:1px solid var(--garis);z-index:1}
#petaPilih{height:220px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px;max-width:90vw}
.muat{position:fixed;top:0;left:0;right:0;height:3px;background:var(--kuning);z-index:300;animation:m 1s infinite linear;transform-origin:left}
@keyframes m{0%{transform:scaleX(.05)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:.3}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,rgba(18,48,122,.62),rgba(10,28,78,.82)),url(bg-login.jpg) center/cover no-repeat,var(--biru)}
.login .kartu{max-width:380px;width:100%;padding:24px;box-shadow:0 14px 40px rgba(0,0,0,.3);border:0}
.login .logos{display:flex;justify-content:center;gap:14px;margin-bottom:10px}.login .logos img{height:56px}
.login h1{text-align:center;font-size:18px;margin:0 0 2px}.login p.c{text-align:center;color:var(--abu);margin:0 0 18px;font-size:13px}
.login label{display:block;font-size:13px;color:var(--abu);margin:10px 0 4px;font-weight:500}
.login input{width:100%}
.login .btn{width:100%;justify-content:center;margin-top:16px}
.pw{position:relative}.pw input{padding-right:44px}
.pw .mata{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 8px;cursor:pointer;color:var(--abu);display:flex;width:auto;margin:0;min-height:0}
.pw .mata:hover{color:var(--biru)}.pw .mata svg{width:20px;height:20px}
.only-mob{display:none}
.kalatas{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.kalnav{display:flex;align-items:center;gap:8px}.kalnav b{min-width:140px;text-align:center;font-size:16px}
.kalaksi{display:flex;gap:8px}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--abu);margin:0 0 10px}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kal{background:#fff;border:1px solid var(--garis);border-radius:var(--r);overflow:hidden}
.kh,.kg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.kh div{padding:7px 8px;font-size:12px;font-weight:600;color:var(--abu);background:var(--latar);text-align:center}
.kh div:last-child{color:var(--merah)}
.kd{min-height:108px;border-top:1px solid var(--garis);border-left:1px solid var(--garis);padding:4px 5px 6px;cursor:pointer;overflow:hidden}
.kd:nth-child(7n+1){border-left:0}
.kd:hover{background:#f7f9fd}.kd.pilih{background:#eef3ff;box-shadow:inset 0 0 0 2px var(--biru2)}
.kd.luar{background:#fafbfd}.kd.luar .no{opacity:.4}
.kd .no{font-size:13px;font-weight:600;margin-bottom:3px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.kd.merah .no{color:var(--merah)}.kd.ini .no{background:var(--biru);color:#fff}
.kc{display:block;font-size:11.5px;line-height:1.35;padding:2px 6px;border-radius:5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;color:var(--teks)}
.kc.keg{background:#f3f5fa;background:color-mix(in srgb,var(--w) 15%,#fff);border-left:3px solid var(--w)}
.kc.libur{background:var(--merahbg);color:var(--merah);font-weight:600}
.kc.tenggat{border:1px dashed #c9d2e3;background:#fff;color:var(--abu)}.kc.tenggat.lewat{border-color:var(--merah);color:var(--merah)}
.kd .lain{font-size:11px;color:var(--abu);margin-top:2px;padding-left:4px}
.agenda{display:grid;gap:8px}
.ah .tg{font-weight:700;font-size:14px;margin:10px 0 6px;color:var(--biru)}.ah .tg.merah{color:var(--merah)}
.ah.ini .tg{background:var(--birubg);border-radius:6px;padding:4px 8px}
.ai{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:9px 12px;cursor:pointer;margin-bottom:6px}
.ai.keg{border-left:4px solid var(--w)}.ai.libur{background:var(--merahbg);border-color:#f0b3ae;color:var(--merah);cursor:default}
.ai.tenggat{border-style:dashed}.ai.tenggat.lewat{border-color:var(--merah)}.ai.tenggat.lewat b{color:var(--merah)}
.jrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.jrow .jn{flex:1}.jrow .jw{width:44px;padding:2px;min-height:38px}
.kegb{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--garis);cursor:pointer}.kegb:first-child{border-top:0}
.kegb .tgk{min-width:54px;text-align:center;border-radius:8px;background:var(--latar);padding:4px 2px;font-size:12px;line-height:1.2}.kegb .tgk b{display:block;font-size:17px}
.fwrap{display:contents}
.lvLayar{position:fixed;inset:0;z-index:300;background:#16213f;color:#fff;display:flex;flex-direction:column;font-family:inherit;overflow:auto}
body.lvBuka{overflow:hidden}
.lvAtas{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:rgba(0,0,0,.25)}
.lvAtas b{display:block;font-size:17px}.lvAtas span{font-size:13px;color:#c8d3f0}
.lvAlat{display:flex;gap:8px}.lvAlat button{border:0;border-radius:9px;padding:8px 12px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.lvTengah{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px;gap:16px;width:100%;max-width:1200px;margin:0 auto}
.lvKosong{font-size:22px;color:#c8d3f0}
.lvPapan{width:100%;max-width:820px;display:flex;flex-direction:column;gap:8px}
.lvBaris{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 16px;font-size:clamp(16px,2.2vw,24px)}
.lvBaris.p1{background:#c79100}.lvBaris.p2{background:#7d8aa6}.lvBaris.p3{background:#9a5b2e}
.lvNo{width:38px;font-weight:800;text-align:center}.lvNm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvNm small,.lvNil small{display:block;font-size:.62em;font-weight:500;opacity:.85}.lvNil{text-align:right;font-weight:800}
.lvLobi{flex-direction:row;flex-wrap:wrap;gap:36px}
.lvQR{background:#fff;border-radius:18px;padding:16px;text-align:center;color:#12307a}.lvQR img,.lvQR #lvhQR{width:min(36vh,320px);height:min(36vh,320px);display:flex;align-items:center;justify-content:center}
.lvUrl{font-weight:700;margin-top:8px;font-size:15px}
.lvGabung{flex:1;min-width:300px;max-width:560px}.lvGabung h2{font-size:clamp(20px,2.6vw,30px);margin:0 0 12px;color:#fff}
.lvJumlah{font-size:20px;margin-bottom:10px}.lvJumlah b{font-size:42px;color:#f7c600}
.lvNama{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}.lvNama span{background:rgba(255,255,255,.14);border-radius:20px;padding:5px 11px;font-size:14px}
.lvSoal{justify-content:flex-start}
.lvNomor{font-size:16px;color:#c8d3f0;font-weight:700}
.lvT{font-size:clamp(22px,3.2vw,40px);font-weight:800;text-align:center;line-height:1.3;background:#fff;color:#1d2433;border-radius:14px;padding:18px 24px;width:100%}
.lvInfo{display:flex;gap:18px;align-items:center;font-size:20px;font-weight:700}
.lvSisa{background:#fff;color:#12307a;border-radius:40px;padding:6px 18px;font-size:26px;min-width:120px;text-align:center}.lvSisa.mepet{background:#e21b3c;color:#fff}
.lvOpsi{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.lvO{display:flex;align-items:center;gap:12px;border-radius:12px;padding:16px;font-size:clamp(17px,2.2vw,26px);font-weight:700;min-height:84px;transition:opacity .3s}
.lvO.redup{opacity:.3}.lvB{flex:none;font-size:1.2em}.lvP{flex:1}.lvSeb{flex:none;background:rgba(0,0,0,.25);border-radius:20px;padding:3px 12px}
.lvBawah{display:flex;gap:20px;width:100%;align-items:flex-end;flex-wrap:wrap}.lvTop{flex:1;min-width:300px}.lvTop h3{margin:0 0 8px;color:#f7c600}
.lvTop .lvBaris{padding:6px 12px;font-size:clamp(14px,1.6vw,18px)}
.lvAksi{display:flex;gap:10px;justify-content:center}
.lvBtn{border:0;border-radius:12px;background:#f7c600;color:#1d2433;font-weight:800;font-size:22px;padding:14px 28px;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #b08d00}
.lvBtn.kecil{font-size:15px;padding:9px 16px;background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.lvBtn:disabled{opacity:.5}
.lvHitung{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:8px;background:#1d2433;color:#f7c600;font-variant-numeric:tabular-nums}
.lvAuto{margin-top:14px;text-align:center;font-size:15px;color:#e7ebf3}.lvAuto label{cursor:pointer}.lvAuto input{width:18px;height:18px;vertical-align:-3px}.lvAuto select{font:inherit;padding:3px 6px;border-radius:6px;margin-left:6px;color:#1d2433;background:#fff}.lvAuto select:disabled{opacity:.5}.lvLobi .lvAksi{margin-top:16px}.lvAutoKet{font-size:13px;opacity:.75;margin-top:6px}
.lvJuara{font-size:clamp(28px,4vw,48px);font-weight:800;color:#f7c600}
.lvTop3 .lvBaris{padding:7px 14px;font-size:clamp(15px,1.8vw,22px)}
.lvHasil{gap:10px;padding-top:12px}.lvHasil .lvT{font-size:clamp(18px,2.3vw,30px);padding:10px 20px}.lvHasil .lvO{min-height:52px;padding:10px 14px;font-size:clamp(15px,1.8vw,22px)}.lvHasil .lvOpsi{gap:8px}.lvNil small.lvGerak{font-weight:700;opacity:.95}
.lvPodium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,20px);width:100%;max-width:860px;margin:14px auto 4px}
.lvPod{flex:1;max-width:260px;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.lvPodNm{font-weight:800;font-size:clamp(16px,2.3vw,28px);line-height:1.15;word-break:break-word}.lvPodNm small{display:block;font-size:.6em;font-weight:500;opacity:.85}

function tglIndo(t, hari){ if(!t) return '–'; var p=t.slice(0,10).split('-'); if(p.length<3) return t;

  return d.toISOString().slice(0,10); }
function selisihHK(a,b){ if(a===b) return 0; var lib=liburSet(), m=a<b?1:-1, x=a<b?a:b, y=a<b?b:a, p=x.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;

  return c*m; }

function tenggat24(k){ var e=null; (D.riwayat||[]).forEach(function(r){ if(r.no===k.no && r.tahap===k.tahap && r.tanggal===k.tanggalTahap) e=r; }); return !!(e && e.hitungan==='24 Jam'); }
function selisihHari(a,b){ var p=a.split('-').map(Number), q=b.split('-').map(Number); return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/864e5); }
function pilTenggat(k){

  if(!k.tenggat) return '<span class="sub">–</span>';

  if(k.tenggat<D.hariIni) return '<span class="pill p-merah">Lewat '+Math.max(1,-n)+(j24?' hari':' hari kerja')+'</span>';

  return '<span class="pill '+(n<=1?'p-kuning':'p-biru')+'">'+tglIndo(k.tenggat)+' · sisa '+n+(j24?' hari':' hk')+'</span>'; }

/* Permintaan baca diulang sekali (jeda 1 dtk) bila gagal tersambung; permintaan simpan tidak diulang supaya tidak dobel.
   Setiap permintaan dicatat (aksi, lama, lama di server, dari simpanan/tidak) untuk halaman #kinerja. */
var API_BACA = { data:1, berkas:1, suratData:1, bestieData:1, bestieRekap:1, daftarPengguna:1, cariTempat:1 };
function catatKinerja(x){ try{ var l=JSON.parse(localStorage.getItem('ppud_kinerja')||'[]'); l.push(x); if(l.length>200) l=l.slice(-200); localStorage.setItem('ppud_kinerja', JSON.stringify(l)); }catch(e){} }
function api(action, data){
  muat(true);
  var body = JSON.stringify(Object.assign({ action: action, token: TOKEN, aktif: diamSelama() < BATAS_DIAM }, data||{}));
  var t0 = Date.now(), ulang = 0;
  function kirim(){
    return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body })
      .then(function(r){ return r.json(); })
      .catch(function(){
        if(API_BACA[action] && !ulang){ ulang=1; return new Promise(function(ok){ setTimeout(ok, 1000); }).then(kirim); }
        catatKinerja({ w:t0, a:action, ms:Date.now()-t0, u:ulang, g:1 });
        throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); });
  }
  return kirim()
    .then(function(j){
      var s=j._srv||{}; catatKinerja({ w:t0, a:action, ms:Date.now()-t0, s:s.ms, c:s.c?1:0, u:ulang, e:j.ok?0:1 });
      if(!j.ok){ if(j.sesiHabis){ keluar(j.error); } throw new Error(j.error||'Terjadi kesalahan.'); }
      if(j._cfUbah) cfTandaiUbah(j._cfUbah, j._cfWaktu);
      terakhirGoogle=Date.now();
      return j; })
    .finally(function(){ muat(false); });
}
/* ---- Baca dari salinan Cloudflare (akun ke-2, data.ppud.my.id); data asli & semua simpan tetap di Google ----
   Izin baca diminta dengan token login (disimpan per akun, dihapus saat keluar). Salinan dipakai hanya bila tidak lebih tua
   dari perubahan terakhir yang dibuat dari perangkat ini; selain itu (atau bila gagal) dibaca dari Google seperti biasa. */
var CF_PPUD = 'https://data.ppud.my.id/';
function cfPost(o){
  var ctl=window.AbortController?new AbortController():null, t=ctl?setTimeout(function(){ ctl.abort(); },8000):null;
  return fetch(CF_PPUD, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(o), signal:ctl?ctl.signal:undefined })
    .then(function(r){ return r.json(); }).finally(function(){ if(t) clearTimeout(t); });
}
function cfKunci(baru){
  if(!baru){ var x=ambil('ppud_cf'); if(x && ME && x.u===ME.username && x.k) return Promise.resolve(x.k); }
  return cfPost({ action:'masuk', token:TOKEN }).then(function(j){ if(!j || !j.ok) throw new Error(j && j.error || 'Izin baca ditolak');
    simpan('ppud_cf', { u:ME.username, k:j.kunci }); return j.kunci; });
}
function cfTandaiUbah(jenis, w){ var m=ambil('ppud_cfmin')||{}; if(!ME || m.u!==ME.username) m={ u:ME?ME.username:'' }; jenis.forEach(function(x){ m[x]=Math.max(m[x]||0, w||Date.now()); }); simpan('ppud_cfmin', m); }
function cfBaca(jenis){
  var t0=Date.now();
  var pakai=function(k){ return cfPost({ action:'baca', kunci:k, jenis:jenis, token:TOKEN, aktif: diamSelama() < BATAS_DIAM }); };
  return cfKunci().then(pakai).then(function(j){
      if(j && !j.ok && /Izin baca/.test(j.error||'')){ simpan('ppud_cf', null); return cfKunci(true).then(pakai); }
      return j; })
    .then(function(j){
      if(!j || !j.ok || !j._cf) throw new Error(j && j.error || 'Salinan tidak tersedia');
      var m=ambil('ppud_cfmin')||{}; if(ME && m.u===ME.username && (m[jenis]||0) > j._cf.versi) throw new Error('Salinan belum memuat perubahan terakhir');
      catatKinerja({ w:t0, a:'cf:'+jenis, ms:Date.now()-t0 }); return j; })
    .catch(function(e){ catatKinerja({ w:t0, a:'cf:'+jenis, ms:Date.now()-t0, g:1 }); throw e; });
}
function ambilData(){ return cfBaca('data').then(function(j){ j.me=ME; return j; }, function(){ return api('data'); }); }
/* Karena data kini dibaca dari Cloudflare, sesi login di Google tidak lagi ikut diperpanjang oleh setiap baca.
   jagaSesi(): selama pengguna aktif, menyapa Google (aksi ringan cekToken) paling jarang tiap 10 menit dan sekali saat halaman dibuka;
   sesi diperpanjang, dan bila ternyata sudah berakhir pengguna langsung diminta login ulang (bukan baru ketahuan saat menyimpan). */
var terakhirGoogle=0, sedangJaga=false;
function jagaSesi(paksa){
  if(!TOKEN || sedangJaga || diamSelama() >= BATAS_DIAM) return;
  if(!paksa && Date.now()-terakhirGoogle < 10*60*1000) return;
  sedangJaga=true;
  api('cekToken').then(function(j){ if(j.me){ ME=Object.assign({}, ME, j.me); simpan('ppud_sesi',{token:TOKEN, me:ME}); if(D) D.me=ME; } })
    .catch(function(){}).finally(function(){ sedangJaga=false; });
}
function ambilSurat(){ return cfBaca('surat').catch(function(){ return api('suratData'); }); }

function vKinerja(){
  var l=[]; try{ l=JSON.parse(localStorage.getItem('ppud_kinerja')||'[]'); }catch(e){}

   lalu diperbarui diam-diam dari server. Dihapus saat keluar. */
function tandaSegar(on){
  var e=$('#tandaSegar');
  if(!on){ if(e) e.remove(); return; }
  if(!e){ e=document.createElement('div'); e.id='tandaSegar'; e.textContent='Memperbarui data…';
    e.style.cssText='position:fixed;right:12px;bottom:76px;z-index:240;background:#1f2a44;color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:.92;pointer-events:none';
    document.body.appendChild(e); }
}
function muatData(diam){
  var dariSimpan=false;
  if(!diam && !D && ME){
    var c=ambil('ppud_data');
    if(c && c.u===ME.username && c.d && Date.now()-(c.w||0) < 7*864e5){ D=c.d; D.me=ME; try{ render(); dariSimpan=true; tandaSegar(true); }catch(e){ D=null; } }
  }
  return ambilData().then(function(j){
      var y=window.scrollY; D=j; ME=j.me; simpan('ppud_sesi',{token:TOKEN, me:ME}); simpan('ppud_data',{u:ME.username, w:Date.now(), d:j}); terakhirMuat=Date.now();
      if(!(dariSimpan && sibuk())){ render(); if(diam||dariSimpan) window.scrollTo(0,y); }
      cekAduanBaru(); })
    .catch(function(err){ if(diam) return; if(dariSimpan){ toast('Gagal memperbarui: '+err.message+' · menampilkan data terakhir'); return; }
      if(TOKEN) $('#isi').innerHTML='<div class="kartu galat">'+esc(err.message)+' <button class="btn kecil" onclick="muatData()">Coba lagi</button></div>'; })
    .finally(function(){ if(dariSimpan) tandaSegar(false); });
}

function cekAduanBaru(){

  if(tiketDikenal){ var n=b.filter(function(t){ return tiketDikenal.indexOf(t)<0; }).length; if(n) beriTahu(n); }

  e.setAttribute('data-n', n);
  e.innerHTML='<span>\ud83d\udd14 <b>'+n+' aduan baru</b> masuk</span><button class="btn kecil" id="notifLihat">Lihat</button><button id="notifTutup" title="Tutup" style="border:0;background:none;font-size:18px;cursor:pointer;color:#667">\u00d7</button>';

document.addEventListener('click', function(e){
  var a=e.target.closest && e.target.closest('a.kelogo'); if(!a) return;
  var m=$('#modalBg'); if(!m) return;
  var isi=[].some.call(m.querySelectorAll('input,textarea,select'), function(x){ return x.type!=='hidden' && !x.disabled && !x.readOnly; });
  if(isi && !confirm('Formulir yang sedang terbuka belum disimpan dan isiannya akan hilang. Tetap pindah ke halaman utama?')) e.preventDefault();

function sibuk(){
  if($('#modalBg')) return true;

}
function segarkan(){
  if(!TOKEN || !D || sedangSegar || sibuk()) return;
  sedangSegar=true; muatData(true).finally(function(){ sedangSegar=false; });
}
function cekDiam(){ if(TOKEN && diamSelama()>=BATAS_DIAM){ tutupModal(); keluar('Anda keluar otomatis karena tidak ada aktivitas selama 1 jam.'); return true; } return false; }
setInterval(function(){ if(cekDiam()) return; jagaSesi(); if(document.visibilityState==='visible' && Date.now()-terakhirMuat>=5*60*1000) segarkan(); }, 30*1000);

  if(!/\.docx$/i.test(file.name)){ toast('Pilih berkas .docx dari e-office.'); return; }
  if(file.size>10*1024*1024){ toast('Berkas terlalu besar.'); return; }
  var idBtn=btn.id; btn.disabled=true; var t0=btn.innerHTML; btn.textContent='Menyiapkan…';
  srPustaka().then(function(){ return file.arrayBuffer(); }).then(function(buf){ return M.isiDraf(buf, SF); })
    .then(function(b){ srUnduh(b, file.name);
      if(b.length>2*1024*1024) alert('Perhatian: ukuran berkas '+(b.length/1048576).toFixed(1)+' MB, lebih dari batas e-office 2 MB.');
      toast('Draf terisi diunduh'); return srSimpanRiwayat(); })
    .catch(function(e){ toast(e.message); alert(e.message); })
    .finally(function(){ var b2=$('#'+idBtn); if(b2){ b2.disabled=false; b2.innerHTML=t0; } });
}

/* Tarik-lepas (pegangan ⠿) untuk mengurutkan baris. pindah(dari, ke) dipanggil setelah dilepas. Jalan dengan mouse & sentuh. */
var SR_PEGANG='<span class="pegang" title="Tarik untuk mengurutkan" aria-label="Tarik untuk mengurutkan">⠿</span>';
function srSeret(wadah, pilih, pindah){
  if(!wadah) return;
  [].forEach.call(wadah.querySelectorAll('.pegang'), function(h){
    var baris=h.closest(pilih); if(!baris || baris.parentNode!==wadah) return;
    h.onpointerdown=function(e){
      if(e.button>0) return; e.preventDefault();
      var semua=[].filter.call(wadah.children, function(r){ return r.matches(pilih); }), dari=semua.indexOf(baris), ke=dari;
      if(semua.length<2) return;
      var sy0=window.scrollY, y0=e.clientY, ky=y0, kotak=semua.map(function(r){ var b=r.getBoundingClientRect(); return { a:b.top+sy0, t:b.height }; });
      var jarak=semua.length>1 ? (dari<semua.length-1 ? kotak[dari+1].a-kotak[dari].a : kotak[dari].a-kotak[dari-1].a+kotak[dari].t-kotak[dari-1].t) : kotak[dari].t;
      baris.classList.add('diseret'); document.body.classList.add('lagiSeret');
      semua.forEach(function(r,i){ if(i!==dari) r.classList.add('ikutGeser'); });
      try{ h.setPointerCapture(e.pointerId); }catch(x){}
      var gulir=0, raf=0;
      function hitung(){
        var dy=ky+window.scrollY-(y0+sy0), tengah=ky+window.scrollY; ke=dari;
        for(var i=0;i<semua.length;i++){ if(i===dari) continue; var m=kotak[i].a+kotak[i].t/2;
          if(i>dari && tengah>m) ke=i; if(i<dari && tengah<m && ke===dari) ke=i; }
        baris.style.transform='translateY('+dy+'px)';
        semua.forEach(function(r,i){ if(i===dari) return; var g=0;
          if(dari<ke && i>dari && i<=ke) g=-jarak; if(dari>ke && i<dari && i>=ke) g=jarak; r.style.transform=g?'translateY('+g+'px)':''; });
      }
      function langkah(){ raf=0; if(!gulir) return; window.scrollBy(0,gulir); hitung(); raf=requestAnimationFrame(langkah); }
      function gerak(ev){ ky=ev.clientY; var H=window.innerHeight;
        gulir= ky<90 ? -Math.ceil((90-ky)/6) : ky>H-90 ? Math.ceil((ky-(H-90))/6) : 0;
        if(gulir && !raf) raf=requestAnimationFrame(langkah); hitung(); }
      function lepas(){
        h.removeEventListener('pointermove',gerak); h.removeEventListener('pointerup',lepas); h.removeEventListener('pointercancel',lepas);
        gulir=0; if(raf) cancelAnimationFrame(raf);
        semua.forEach(function(r){ r.style.transform=''; r.classList.remove('diseret','ikutGeser'); }); document.body.classList.remove('lagiSeret');
        if(ke!==dari) pindah(dari, ke);
      }
      h.addEventListener('pointermove',gerak); h.addEventListener('pointerup',lepas); h.addEventListener('pointercancel',lepas);
    };
  });
}
function srPindahkan(L, dari, ke){ var x=L.splice(dari,1)[0]; L.splice(ke,0,x); }

function srPeringatan(){
  srRata(); var w=[], g=SuratDocx.validasi(SF);
  SF.jadwal.forEach(function(j,ji){
    var nm2=SF.jadwal.length>1?'Jadwal '+(ji+1)+': ':'';
    var lihat={}; j.personel.forEach(function(p){ var k=(p.nip||p.nama).toLowerCase(); if(lihat[k]) w.push(nm2+p.nama+' tercantum dua kali.'); lihat[k]=1; });

    if(j.tim.length>1) j.tim.forEach(function(t,ti){ if(!t.personel.length) w.push(nm2+srNamaTim(t,ti)+' belum ada personel.'); });
    for(var k=ji+1;k<SF.jadwal.length;k++){ var b=SF.jadwal[k];
      if(!j.tanggal || j.tanggal!==b.tanggal) continue;
      var a1=j.jamMulai||'00:00', a2=j.jamSelesai||'23:59', b1=b.jamMulai||'00:00', b2=b.jamSelesai||'23:59';
      if(a1<b2 && b1<a2) j.personel.forEach(function(p){ if(b.personel.some(function(q){ return (q.nip&&q.nip===p.nip) || q.nama===p.nama; })) w.push(p.nama+' bertugas di jadwal '+(ji+1)+' dan '+(k+1)+' pada waktu yang bentrok.'); }); }

  return { galat:g, peringatan:w };
}

function dhGambar(){
  var D2=srDH.dasar;
  $('#dhL').innerHTML=D2.map(function(d,i){ return '<div class="srD"><span class="no">'+(i+1)+'.</span><textarea class="auto" rows="2" data-i="'+i+'">'+esc(d.teks)+'</textarea><div class="tb">'+

function dhGambarPaket(){
  var D2=srDH.dasar;
  $('#dhP').innerHTML=srDH.paket.map(function(p,pi){ return '<div class="srJ"><div class="kepalaE"><input value="'+esc(p.nama)+'" data-p="'+pi+'" placeholder="Nama paket" style="flex:1"><button class="btn kecil bahaya" onclick="srDH.paket.splice('+pi+',1);dhGambarPaket()">Hapus paket</button></div>'+
    '<div class="pilihL" style="max-height:none">'+D2.map(function(d,i){ var k=d.id||('baru'+i); return d.teks.trim()?'<label class="cekB"><input type="checkbox" data-p="'+pi+'" data-i="'+i+'"'+(d.id&&p.ids.indexOf(d.id)>=0||(!d.id&&(p.idsBaru||[]).indexOf(i)>=0)?' checked':'')+'><span>'+(i+1)+'. '+esc(d.teks.length>140?d.teks.slice(0,140)+'…':d.teks)+'</span></label>':''; }).join('')+'</div></div>'; }).join('')||'<div class="sub">Belum ada paket.</div>';
  [].forEach.call(document.querySelectorAll('#dhP input[data-p]:not([type=checkbox])'), function(x){ x.oninput=function(){ srDH.paket[+x.getAttribute('data-p')].nama=x.value; }; });
  [].forEach.call(document.querySelectorAll('#dhP input[type=checkbox]'), function(c){ c.onchange=function(){ var p=srDH.paket[+c.getAttribute('data-p')], d=D2[+c.getAttribute('data-i')];

function dhGeser(i,a){ var x=srDH.dasar.splice(i,1)[0]; srDH.dasar.splice(i+a,0,x); srDH.paket.forEach(function(p){ p.ids.sort(function(a2,b){ return srDH.dasar.findIndex(function(x2){ return x2.id===a2; })-srDH.dasar.findIndex(function(x2){ return x2.id===b; }); }); }); dhGambar(); }
function dhHapus(i){ var d=srDH.dasar[i]; if(d.teks.trim() && !confirm('Hapus dasar ini dari daftar?')) return; srDH.dasar.splice(i,1); srDH.paket.forEach(function(p){ var k=p.ids.indexOf(d.id); if(k>=0) p.ids.splice(k,1); }); dhGambar(); }

function unGambarModel(){ [].forEach.call($('#unModel').children, function(b){ b.classList.toggle('on', b.getAttribute('data-m')===(SF.model||'rakor')); }); }
function unPilihModel(m){
  if(m===SF.model) return;
  var M=UndanganDocx.MODEL, lama=M[SF.model||'rakor']||{}, baru=M[m];
  var bidang=[['pembuka', SF], ['penutup', SF], ['acara', SF.acara], ['catatan', SF.acara]];
  var ubahan=bidang.filter(function(b){ var v=String(b[1][b[0]]||'').trim(); return v && v!==lama[b[0]]; });
  var ganti=!ubahan.length || confirm('Teks pembuka/penutup/Acara/Catatan sudah Anda ubah. Ganti semuanya dengan contoh “'+baru.nama+'”?\n\nPilih Batal untuk hanya mengganti bagian yang belum diubah.');
  bidang.forEach(function(b){ var v=String(b[1][b[0]]||'').trim(); if(ganti || !v || v===lama[b[0]]) b[1][b[0]]=baru[b[0]]; });
  SF.model=m; unUbah(); vUndanganForm(SF.id||'baru');
}

/* Perangkat daerah (sheet "Perangkat Daerah"): pilih pimpinan sebagai Yth., lalu cq. dari daftar unitnya. */
function unNorm(t){ return String(t||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function unPerangkatDari(nama){ var n=unNorm(nama); if(!n) return null; return (SRD.perangkat||[]).filter(function(p){ return unNorm(p.yth)===n; })[0]||null; }
function unUnit(pd){ return String(pd.unit||'').split('\n').map(function(l){ var m=l.match(/^\s*(-*)\s*(.*?)\s*$/); return { lvl:Math.min(2,m[1].length), nama:m[2] }; }).filter(function(u){ return u.nama; }); }
var unKetik={};   // baris penerima yang cq.-nya sedang diketik sendiri
function unCqDikenal(pd, cq){ return unUnit(pd).some(function(u){ return unNorm(u.nama)===unNorm(cq); }); }
function unPilihCq(pd, cq, i){
  var U=unUnit(pd); if(!U.length) return ''; var ada=unCqDikenal(pd, cq), lain=(cq&&!ada)||unKetik[i];
  return '<select data-cq="'+i+'" style="width:100%;margin-top:4px" aria-label="cq. dari daftar">'+
    '<option value=""'+(!cq&&!lain?' selected':'')+'>cq. (opsional): pilih bidang/bagian…</option>'+
    U.map(function(u){ var on=!lain&&unNorm(u.nama)===unNorm(cq); return '<option value="'+esc(u.nama)+'"'+(on?' selected':'')+'>'+(u.lvl?new Array(u.lvl*2-1).join('\u00a0\u00a0')+'– ':'')+esc(u.nama)+'</option>'; }).join('')+
    (cq?'<option value="__tanpa">(tanpa cq.)</option>':'')+'<option value="__lain"'+(lain?' selected':'')+'>Ketik cq. sendiri…</option></select>';
}
var unSaringPD={ q:'', k:'' };
function unPilihPerangkat(){
  var L=SRD.perangkat||[], K=[]; L.forEach(function(p){ if(p.kelompok && K.indexOf(p.kelompok)<0) K.push(p.kelompok); });
  if(!L.length){ toast('Daftar perangkat daerah belum ada.'); return; }
  modal('Pilih perangkat daerah', '<div class="alat"><input type="search" id="unPDq" placeholder="Cari dinas, badan, camat…" value="'+esc(unSaringPD.q)+'"></div>'+
    '<div class="seg" id="unPDk" style="margin-bottom:10px;display:flex;flex-wrap:wrap"><button data-k="">Semua</button>'+K.map(function(k){ return '<button data-k="'+esc(k)+'">'+esc(k)+'</button>'; }).join('')+'</div>'+
    '<div class="sub" style="margin-bottom:6px">cq. (bidang/bagian/seksi) dipilih setelah ditambahkan, di baris penerima.</div>'+
    '<div class="pilihL" id="unPDL"></div><div class="aksi"><span class="sub" id="unPDn" style="margin-right:auto"></span><button class="btn" onclick="tutupModal()">Batal</button><button class="btn utama" id="unPDok">Tambahkan</button></div>', true);
  var dipilih={}, ada={}; SF.penerima.forEach(function(p){ ada[unNorm(p.nama)]=1; });
  function gambar(){
    var q=unNorm(unSaringPD.q);
    [].forEach.call($('#unPDk').children, function(b){ b.classList.toggle('on', b.getAttribute('data-k')===unSaringPD.k); });

function prDariTahap(idTahap){
  var e=D.riwayat.filter(function(x){ return x.id===idTahap; })[0]; if(!e) return null;
  var k=D.kasus.filter(function(x){ return x.no===e.no; })[0]||{}, t=prTingkat(e.tahap), B=PeringatanDocx.BAWAAN;
  var riw=riwayatKasus(e.no), iE=riw.indexOf(e);
  var lalu=riw.slice(0, iE<0?riw.length:iE).filter(function(x){ var j=PR_TAHAP_LALU.indexOf(x.tahap); return j>=0 && (prTingkat(x.tahap)===0 || prTingkat(x.tahap)<t); });
  var bi=-1, dasarSP=null; lalu.forEach(function(x,i){ var s=prSuratDari(x.idSurat); if(s){ bi=i; dasarSP=s.data; } });
  var butir=dasarSP?(dasarSP.pertimbangan||[]).slice():[];
  lalu.slice(bi<0?0:bi).forEach(function(x){ var s=prSuratDari(x.idSurat), b=PeringatanDocx.butirOtomatis(x, s&&s.data); if(b) butir.push(b); });
  var o={ jenis:PR_JENIS, id:'', tingkat:t, no:e.no, idTahap:e.id, tanggal:e.tanggal, hitungan:e.hitungan||'Hari Kerja',
    hal:'Peringatan '+PeringatanDocx.TINGKAT[t], yth:prBarisYth(k), di:'Tempat', paket:'', dasar:[], pertimbangan:butir,
    subjek:B.subjek, perintah:B.perintah, objek:B.objek };
  if(dasarSP){ ['yth','di','paket','dasar','subjek','perintah','objek'].forEach(function(f){ if(dasarSP[f]) o[f]=JSON.parse(JSON.stringify(dasarSP[f])); }); }
  else { var p=(SRD.paket||[]).filter(function(x){ return x.nama===PR_PAKET; })[0];
    if(p){ var m={}; (SRD.dasar||[]).forEach(function(d){ m[d.id]=d.teks; }); o.paket=p.nama; o.dasar=p.ids.map(function(i){ return m[i]; }).filter(Boolean); } }
  return o;
}

/* Pencarian tempat gabungan untuk titik peta (dipakai form lapor publik & form kasus dashboard; teks ini disalin ke keduanya).
 * 1) OpenStreetMap lewat Photon (photon.komoot.io, gratis, tanpa key; dipanggil langsung dari browser): memberi NAMA tempat.
 * 2) Geocoder Google lewat server Apps Script (aksi cariTempat): memberi alamat bila tempat tak ada di OSM.
 * Hasil di Kab. Sumedang diutamakan; hasil Google <120 m dari hasil lain dan hasil bernama sama <400 m digabung (nama OSM dipakai). */
var CARI_KOTAK = { s: -7.05, w: 107.68, n: -6.55, e: 108.25 };
var OSM_JENIS = { mall: 'Pusat perbelanjaan', department_store: 'Pusat perbelanjaan', commercial: 'Kawasan komersial', retail: 'Kawasan komersial',
  supermarket: 'Supermarket', convenience: 'Minimarket', marketplace: 'Pasar', hospital: 'Rumah sakit', clinic: 'Klinik', doctors: 'Klinik',
  school: 'Sekolah', kindergarten: 'Sekolah', university: 'Kampus', college: 'Kampus', park: 'Taman', restaurant: 'Rumah makan', fast_food: 'Rumah makan',
  cafe: 'Kafe', place_of_worship: 'Tempat ibadah', townhall: 'Kantor pemerintah', government: 'Kantor pemerintah', police: 'Kantor polisi',
  bank: 'Bank', fuel: 'SPBU', hotel: 'Penginapan', guest_house: 'Penginapan', industrial: 'Kawasan industri', works: 'Pabrik', factory: 'Pabrik',
  village: 'Desa', hamlet: 'Kampung', suburb: 'Kelurahan', bus_stop: 'Halte', bus_station: 'Terminal', attraction: 'Wisata', viewpoint: 'Wisata',
  waterfall: 'Wisata', peak: 'Gunung', stadium: 'Stadion', sports_centre: 'Olahraga', office: 'Kantor', company: 'Kantor', yes: 'Bangunan' };
function cariDiSumedang(lat, lng) { return lat >= CARI_KOTAK.s && lat <= CARI_KOTAK.n && lng >= CARI_KOTAK.w && lng <= CARI_KOTAK.e; }
function cariJarak(a, b) { var k = 111320, dx = (a.lng - b.lng) * k * Math.cos(a.lat * Math.PI / 180), dy = (a.lat - b.lat) * k; return Math.sqrt(dx * dx + dy * dy); }
function cariOsm(q) {
  var url = function (kotak) {
    return 'https://photon.komoot.io/api/?q=' + encodeURIComponent(q) + '&limit=8&lat=-6.85&lon=107.92' +
      (kotak ? '&bbox=' + [CARI_KOTAK.w, CARI_KOTAK.s, CARI_KOTAK.e, CARI_KOTAK.n].join(',') : '');
  };
  var ubah = function (f) {
    var p = f.properties || {}, c = (f.geometry || {}).coordinates || [];
    if (!p.name || c.length < 2) return null;
    var lat = Number(c[1]), lng = Number(c[0]), lihat = {}, bagian = [];
    [p.street ? p.street + (p.housenumber ? ' No.' + p.housenumber : '') : '', p.locality || p.district, p.city, p.county, p.state].forEach(function (t) {
      t = String(t || '').trim(); var k = t.toLowerCase(); if (t && !lihat[k] && k !== String(p.name).toLowerCase()) { lihat[k] = 1; bagian.push(t); } });
    return { nama: String(p.name), alamat: bagian.join(', '), lat: lat, lng: lng, jenis: OSM_JENIS[p.osm_value] || '', sumber: 'OSM', sumedang: cariDiSumedang(lat, lng) };
  };
  var ambil = function (kotak) {
    return fetch(url(kotak)).then(function (r) { return r.ok ? r.json() : { features: [] }; })
      .then(function (j) { return (j.features || []).map(ubah).filter(Boolean); });
  };
  return ambil(true).then(function (h) { return h.length ? h : ambil(false); }).catch(function () { return []; });
}
/* google: Promise<{ok,hasil}> dari server. Hasil: Promise<{hasil:[...], galat:''}> */
function cariGabung(q, google) {
  var galat = '';
  var g = google.then(function (j) { return (j.hasil || []).map(function (x) { x.sumber = 'Google'; return x; }); })
    .catch(function (e) { galat = (e && e.message) || 'Pencarian gagal.'; return []; });
  return Promise.all([cariOsm(q), g]).then(function (r) {
    var semua = [];
    r[0].concat(r[1]).forEach(function (x) {
      var dobel = semua.filter(function (y) { var d = cariJarak(x, y); return (x.sumber === 'Google' && d < 120) || (y.nama.toLowerCase() === x.nama.toLowerCase() && d < 400); })[0];
      if (dobel) { if (!dobel.alamat && x.alamat) dobel.alamat = x.alamat; return; }
      semua.push(x);
    });
    var urut = function (x) { return (x.sumedang ? 0 : 4) + (x.jenis === 'Wilayah' ? 3 : x.jenis === 'Halte' ? 2 : x.sumber === 'OSM' ? 0 : 1); };   // tempat bernama dulu, halte & wilayah di bawah
    semua = semua.map(function (x, i) { x._i = i; return x; }).sort(function (a, b) { return urut(a) - urut(b) || a._i - b._i; })
      .slice(0, 6).map(function (x) { delete x._i; return x; });
    return { hasil: semua, galat: semua.length ? '' : galat };
  });
}

function siapkanBerkas(f){
  return new Promise(function(ok, gagal){
    if(/^image\//.test(f.type) && f.type!=='image/gif'){
      var img=new Image(), url=URL.createObjectURL(f);
      img.onload=function(){ var m=1600, s=Math.min(1, m/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        var d=c.toDataURL('image/jpeg',0.8); if(d.length*0.75>5*1048576) return gagal(new Error('Foto "'+f.name+'" terlalu besar.'));
        ok({ nama: f.name.replace(/\.[^.]+$/,'')+'.jpg', data:d }); };
      img.onerror=function(){ gagal(new Error('Foto "'+f.name+'" tidak dapat dibaca.')); }; img.src=url;
    } else if(f.type==='application/pdf'){
      if(f.size>5*1048576) return gagal(new Error('Berkas "'+f.name+'" lebih dari 5 MB.'));
      var rd=new FileReader(); rd.onload=function(){ ok({ nama:f.name, data:rd.result }); }; rd.onerror=function(){ gagal(new Error('Berkas tidak dapat dibaca.')); }; rd.readAsDataURL(f);
    } else gagal(new Error('"'+f.name+'" bukan foto atau PDF.'));
  });
}

function kirim(btn, aksi, data, pesan, lanjut){

/* ---------- kalender kegiatan ---------- */
var kalBulan = null, kalPilih = null;
function warnaJenis(j){ var x=(D.jenisKegiatan||[]).filter(function(a){ return a.nama===j; })[0]; return x?x.warna:'#5b6475'; }
function tglKe(t,n){ var p=t.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n)); return d.toISOString().slice(0,10); }
function hariMinggu(t){ var p=t.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay(); }
function jamKeg(k){ return k.seharian ? 'Sehari penuh' : k.jamMulai+(k.jamSelesai?'–'+k.jamSelesai:''); }
function rentangKeg(k){ return k.selesai!==k.mulai ? tglIndo(k.mulai)+' – '+tglIndo(k.selesai) : tglIndo(k.mulai,true); }
/** Semua isi kalender untuk satu tanggal: libur, kegiatan, tenggat kasus berjalan. */
function isiTanggal(t){
  var out=[];
  (D.libur||[]).forEach(function(l){ if(l.tanggal===t && l.dihitung) out.push({ tipe:'libur', judul:l.keterangan }); });
  (D.kegiatan||[]).forEach(function(k){ if(k.mulai<=t && k.selesai>=t) out.push({ tipe:'keg', k:k, judul:k.nama }); });
  D.kasus.forEach(function(k){ if(k.status!=='Selesai' && k.tenggat===t) out.push({ tipe:'tenggat', kasus:k, judul:'Tenggat '+(k.tahap||'')+' · '+judulKasus(k) }); });
  out.sort(function(a,b){ var o={libur:0,keg:1,tenggat:2}; if(o[a.tipe]!==o[b.tipe]) return o[a.tipe]-o[b.tipe];
    if(a.tipe==='keg'){ var x=a.k.seharian?'':a.k.jamMulai, y=b.k.seharian?'':b.k.jamMulai; return x<y?-1:x>y?1:0; } return 0; });
  return out;
}
function chipKal(x, ringkas){
  if(x.tipe==='libur') return '<div class="kc libur" title="'+esc(x.judul)+'">'+esc(x.judul)+'</div>';
  if(x.tipe==='tenggat'){ var lw=x.kasus.tenggat<D.hariIni;
    return '<a class="kc tenggat'+(lw?' lewat':'')+'" href="#kasus/'+encodeURIComponent(x.kasus.no)+'" title="'+esc(x.judul)+'" onclick="event.stopPropagation()">⏰ '+esc(ringkas?x.kasus.no:x.judul)+'</a>'; }
  var k=x.k;
  return '<a class="kc keg" href="javascript:void 0" style="--w:'+esc(warnaJenis(k.jenis))+'" title="'+esc(k.nama)+'" onclick="event.stopPropagation();detailKegiatan(\''+esc(k.id)+'\')">'+(k.seharian?'':'<b>'+esc(k.jamMulai)+'</b> ')+esc(k.nama)+'</a>';
}
function vKalender(){
  var bl = kalBulan || D.hariIni.slice(0,7), p=bl.split('-').map(Number);
  var awal=bl+'-01', nHari=new Date(Date.UTC(p[0],p[1],0)).getUTCDate(), akhir=bl+'-'+('0'+nHari).slice(-2);
  var geser=(hariMinggu(awal)+6)%7, mulaiGrid=tglKe(awal,-geser), sel=[];
  for(var i=0;i<42;i++){ var t=tglKe(mulaiGrid,i); if(i>=35 && t>akhir) break; sel.push(t); }
  var prev=new Date(Date.UTC(p[0],p[1]-2,1)).toISOString().slice(0,7), next=new Date(Date.UTC(p[0],p[1],1)).toISOString().slice(0,7);
  var legenda=(D.jenisKegiatan||[]).map(function(j){ return '<span><i style="background:'+esc(j.warna)+'"></i>'+esc(j.nama)+'</span>'; }).join('')+
    '<span><i style="background:#fde2e1;border:1px solid #f0b3ae"></i>Hari libur</span><span><i style="background:#fff;border:1px dashed var(--merah)"></i>Tenggat surat</span>';
  var grid='<div class="kal only-desk"><div class="kh">'+['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(function(h){ return '<div>'+h+'</div>'; }).join('')+'</div><div class="kg">'+
    sel.map(function(t){ var isi=isiTanggal(t), luar=t.slice(0,7)!==bl, lib=isi.some(function(x){ return x.tipe==='libur'; }), mg=hariMinggu(t)===0;
      var tampil=isi.slice(0,3);
      return '<div class="kd'+(luar?' luar':'')+(t===D.hariIni?' ini':'')+(lib||mg?' merah':'')+(t===kalPilih?' pilih':'')+'" onclick="pilihTanggal(\''+t+'\')">'+
        '<div class="no">'+(+t.slice(8))+'</div>'+tampil.map(function(x){ return chipKal(x,true); }).join('')+(isi.length>3?'<div class="lain">+'+(isi.length-3)+' lainnya</div>':'')+'</div>'; }).join('')+'</div></div>';
  var hariAda=[]; for(var d=awal; d<=akhir; d=tglKe(d,1)){ var isi=isiTanggal(d); if(isi.length || d===D.hariIni) hariAda.push([d,isi]); }
  var agenda='<div class="only-mob"><div class="agenda">'+(hariAda.length?hariAda.map(function(h){
      return '<div class="ah'+(h[0]===D.hariIni?' ini':'')+'" id="ag-'+h[0]+'"><div class="tg'+(hariMinggu(h[0])===0||h[1].some(function(x){return x.tipe==='libur';})?' merah':'')+'">'+esc(tglIndo(h[0],true))+(h[0]===D.hariIni?' · Hari ini':'')+'</div>'+
        (h[1].length?h[1].map(function(x){ return barisAgenda(x); }).join(''):'<div class="sub">Tidak ada kegiatan.</div>')+'</div>'; }).join('')
    :'<div class="kosong">Tidak ada kegiatan di bulan ini.</div>')+'</div></div>';
  $('#isi').innerHTML='<div class="kalatas"><h1 style="margin:0">Kalender kegiatan</h1><div class="kalnav">'+
      '<button class="btn" onclick="kalBulan=\''+prev+'\';kalPilih=null;vKalender()" aria-label="Bulan sebelumnya">‹</button>'+
      '<b>'+BULAN[p[1]-1]+' '+p[0]+'</b><button class="btn" onclick="kalBulan=\''+next+'\';kalPilih=null;vKalender()" aria-label="Bulan berikutnya">›</button>'+
      (bl!==D.hariIni.slice(0,7)?'<button class="btn kecil" onclick="kalBulan=null;kalPilih=null;vKalender()">Hari ini</button>':'')+'</div>'+
      (isAdmin()?'<div class="kalaksi"><button class="btn" onclick="formJenis()">Kelola jenis</button><button class="btn utama" onclick="formKegiatan(null, kalPilih)">+ Kegiatan</button></div>':'')+'</div>'+
    '<div class="legenda">'+legenda+'</div>'+grid+agenda+'<div id="kalHari" class="only-desk"></div>';
  if(kalPilih) tampilHari(kalPilih);
  if(bl===D.hariIni.slice(0,7) && window.innerWidth<=760){ var e=$('#ag-'+D.hariIni); if(e) setTimeout(function(){ e.scrollIntoView({block:'start'}); window.scrollBy(0,-70); },50); }
}

function kunciSiswaB(j){ return String(j.kelas).toUpperCase().replace(/\s+/g,'')+'|'+String(+j.absen||j.absen); }
function hitungB(R){
  var pre={}, post={};
  R.jawaban.forEach(function(j){ var k=kunciSiswaB(j);
    if(j.tes==='pre'){ if(!pre[k]) pre[k]=j; }
    else { var c=post[k]; if(!c) post[k]={ best:j, n:1, semua:[j.skor] }; else { c.n++; c.semua.push(j.skor); if(j.skor>c.best.skor) c.best=j; } } });
  var lPre=Object.keys(pre).map(function(k){ return pre[k]; }), lPost=Object.keys(post).map(function(k){ return post[k].best; });
  function ind(l){ var n=l.length; if(!n) return { n:0 };
    var sk=l.map(function(x){ return x.skor; }), jml=sk.reduce(function(a,b){ return a+b; },0);
    return { n:n, rata:jml/n, maks:Math.max.apply(null,sk), min:Math.min.apply(null,sk), tuntas:sk.filter(function(x){ return x>=70; }).length/n*100 }; }
  var soal=R.sesi.soal.map(function(q,i){
    function pct(l){ if(!l.length) return null; return l.filter(function(x){ return x.jawaban[q.id]===q.k; }).length/l.length*100; }
    return { no:i+1, q:q, pre:pct(lPre), post:pct(lPost) }; });
  var kunci={}; Object.keys(pre).concat(Object.keys(post)).forEach(function(k){ kunci[k]=1; });
  var siswa=Object.keys(kunci).map(function(k){ var a=pre[k], b=post[k]; var ref=b?b.best:a;
    return { kelas:ref.kelas, absen:ref.absen, nama:(b?b.best.nama:a.nama), pre:a?a.skor:null, post:b?b.best.skor:null, nPost:b?b.n:0, semuaPost:b?b.semua:[],
      selisih:(a&&b)?b.best.skor-a.skor:null }; })
    .sort(function(x,y){ return x.kelas===y.kelas ? (+x.absen)-(+y.absen) : (x.kelas<y.kelas?-1:1); });
  var iPre=ind(lPre), iPost=ind(lPost);
  return { pre:iPre, post:iPost, naik:(iPre.n&&iPost.n)?iPost.rata-iPre.rata:null, soal:soal, siswa:siswa };
}

var PK_TES = 'pre';
/* satu baris per siswa: pre = kiriman pertama; post = kiriman dengan benar terbanyak (bila sama, yang tercepat) */
function peringkatB(R, tes){
  var per={};
  R.jawaban.forEach(function(j){ if(j.tes!==tes) return; var k=kunciSiswaB(j), c=per[k];
    if(!c || (tes==='post' && (j.benar>c.benar || (j.benar===c.benar && j.durasi<c.durasi)))) per[k]=j; });
  var l=Object.keys(per).map(function(k){ return per[k]; }).sort(function(a,b){ return b.benar-a.benar || a.durasi-b.durasi; });
  var rank=0; l.forEach(function(x,i){ if(i===0 || x.benar!==l[i-1].benar || x.durasi!==l[i-1].durasi) rank=i+1; x.peringkat=rank; });
  return l;
}

  var tutup='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  $$('.login input[type=password]').forEach(function(inp){
    var w=document.createElement('div'); w.className='pw'; inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    var b=document.createElement('button'); b.type='button'; b.className='mata'; b.setAttribute('aria-label','Tampilkan password'); b.innerHTML=buka; w.appendChild(b);
    b.addEventListener('click', function(){ var lihat=inp.type==='password'; inp.type=lihat?'text':'password'; b.innerHTML=lihat?tutup:buka; b.setAttribute('aria-label', lihat?'Sembunyikan password':'Tampilkan password'); inp.focus(); });
  });
  ['formLogin','formGanti'].forEach(function(id){ $('#'+id).addEventListener('submit', function(){ $$('#'+id+' .pw input').forEach(function(i){ i.type='password'; }); $$('#'+id+' .mata').forEach(function(b){ b.innerHTML=buka; }); }, true); });
})();

/* ---------- mulai ---------- */
(function(){
  var s=ambil('ppud_sesi');
  if(s && s.token && s.me && s.me.kedaluwarsa > Date.now() && Date.now()-(Number(ambil('ppud_aktif'))||0) < BATAS_DIAM){ TOKEN=s.token; ME=s.me; catatAktivitas(); masuk(); }
  else { simpan('ppud_sesi', null); tampil('layarLogin'); }
})();
</script>
