<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Kasus PPUD · Satpol PP Kab. Sumedang</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--biru:#12307a;--biru2:#1f4bb5;--kuning:#f7c600;--latar:#eef2f8;--teks:#1d2433;--abu:#5b6475;--garis:#dde3ee;--putih:#fff;
--merah:#b42318;--merahbg:#fde2e1;--hijau:#127a3a;--hijaubg:#d7f2df;--kuningbg:#fff3c4;--kuningtx:#7a5b00;--birubg:#dbe8ff;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--latar);color:var(--teks);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--biru2)}
.hide{display:none!important}
header.top{background:var(--biru);color:#fff;border-bottom:3px solid var(--kuning);position:sticky;top:0;z-index:50}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.top-in img{height:34px}
.judul{font-weight:700;line-height:1.15;font-size:15px}
.judul small{display:block;font-weight:400;opacity:.8;font-size:12px}
.akun{margin-left:auto;position:relative}
.akun>button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.menu{position:absolute;right:0;top:110%;background:#fff;color:var(--teks);border:1px solid var(--garis);border-radius:var(--r);min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.menu div{padding:10px 14px;font-size:13px;color:var(--abu);border-bottom:1px solid var(--garis)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;cursor:pointer}
.menu button:hover{background:var(--latar)}
nav.tab{background:#fff;border-bottom:1px solid var(--garis)}
nav.tab .in{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto}
nav.tab a{padding:11px 14px;text-decoration:none;color:var(--abu);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;display:flex;gap:6px;align-items:center}
nav.tab a.on{color:var(--biru);border-bottom-color:var(--biru)}
nav.tab .n{background:var(--merah);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
main{max-width:1200px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:14px 16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--biru2)}
.stat .l{font-size:13px;color:var(--abu)}
.stat .v{font-size:28px;font-weight:700;line-height:1.2}
.stat.merah{background:var(--merahbg);border-color:#f5b5b0}.stat.merah .v,.stat.merah .l{color:var(--merah)}
.bar{display:grid;grid-template-columns:150px 1fr 32px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar .t{background:var(--latar);border-radius:4px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--biru2);border-radius:4px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--abu)}
.bar b{text-align:right}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;font-weight:500;background:var(--latar);color:var(--abu)}
.p-merah{background:var(--merahbg);color:var(--merah)}.p-hijau{background:var(--hijaubg);color:var(--hijau)}
.p-kuning{background:var(--kuningbg);color:var(--kuningtx)}.p-biru{background:var(--birubg);color:var(--biru)}
.alat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.alat input[type=search]{flex:1 1 220px}
input,select,textarea{border:1px solid #c9d2e3;border-radius:8px;padding:8px 10px;background:#fff;min-height:38px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--biru2);outline-offset:-1px}
.btn{border:1px solid #c9d2e3;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--latar)}
.btn.utama{background:var(--biru);border-color:var(--biru);color:#fff}.btn.utama:hover{background:var(--biru2)}
.btn.bahaya{color:var(--merah);border-color:#f0b3ae}
.btn.kecil{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.seg{display:inline-flex;border:1px solid #c9d2e3;border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;border-right:1px solid #c9d2e3}
.seg button:last-child{border-right:0}.seg button.on{background:var(--biru);color:#fff}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--garis);border-radius:var(--r);overflow:hidden;font-size:14px}
table.t th{background:#f5f7fb;text-align:left;font-weight:600;color:var(--abu);font-size:13px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--garis);vertical-align:top}
table.t tr.klik{cursor:pointer}table.t tr.klik:hover td{background:#f7f9fd}
table.t tr.lewat td:first-child{box-shadow:inset 3px 0 0 var(--merah)}
.sub{color:var(--abu);font-size:13px}
.daftar{display:grid;gap:8px}
.item{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:11px 13px;cursor:pointer}
.item.lewat{border-color:#f0b3ae;box-shadow:inset 4px 0 0 var(--merah)}
.item .a{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item b{font-weight:600}
.kosong{text-align:center;color:var(--abu);padding:30px 10px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px;margin:0}
.dl dt{color:var(--abu)}.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
.lini{position:relative;margin:4px 0 0 6px;padding-left:20px;border-left:2px solid var(--garis)}
.lini .e{position:relative;padding:0 0 16px}
.lini .e:before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--biru2)}
.lini .e.akhir:before{background:var(--biru2)}
.lini .e.lewat:before{border-color:var(--merah);background:var(--merah)}
.langkah{display:flex;gap:3px;margin:10px 0 2px}
.langkah span{flex:1;height:6px;border-radius:3px;background:var(--garis)}
.langkah span.ok{background:var(--biru2)}.langkah span.ini{background:var(--kuning)}
.berkas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.foto{display:flex;flex-wrap:wrap;gap:8px}
.foto img,.foto .ph{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--garis);background:var(--latar);cursor:zoom-in}
.foto .ph{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--abu)}
.tutup-bg{position:fixed;inset:0;background:rgba(10,20,45,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:18px 18px 16px}
.modal.lebar{max-width:820px}
.modal .kepala{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.modal .kepala h2{margin:0}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--abu);padding:4px 8px}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--abu);font-weight:500}
.f label.pn{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;color:var(--teks);font-weight:400}
.f .bt{color:var(--merah);font-style:normal}
.galat{color:var(--merah);font-size:13px;margin-top:8px}
.aksi{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#peta,#petaPilih{height:300px;border-radius:var(--r);border:1px solid var(--garis);z-index:1}
#petaPilih{height:220px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px;max-width:90vw}
.muat{position:fixed;top:0;left:0;right:0;height:3px;background:var(--kuning);z-index:300;animation:m 1s infinite linear;transform-origin:left}
@keyframes m{0%{transform:scaleX(.05)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:.3}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,rgba(18,48,122,.62),rgba(10,28,78,.82)),url(bg-login.jpg) center/cover no-repeat,var(--biru)}
.login .kartu{max-width:380px;width:100%;padding:24px;box-shadow:0 14px 40px rgba(0,0,0,.3);border:0}
.login .logos{display:flex;justify-content:center;gap:14px;margin-bottom:10px}.login .logos img{height:56px}
.login h1{text-align:center;font-size:18px;margin:0 0 2px}.login p.c{text-align:center;color:var(--abu);margin:0 0 18px;font-size:13px}
.login label{display:block;font-size:13px;color:var(--abu);margin:10px 0 4px;font-weight:500}
.login input{width:100%}
.login .btn{width:100%;justify-content:center;margin-top:16px}
.pw{position:relative}.pw input{padding-right:44px}
.pw .mata{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 8px;cursor:pointer;color:var(--abu);display:flex;width:auto;margin:0;min-height:0}
.pw .mata:hover{color:var(--biru)}.pw .mata svg{width:20px;height:20px}
.only-mob{display:none}
.fwrap{display:contents}
@media (max-width:760px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}
  .only-desk{display:none!important}.only-mob{display:block}
  nav.tab{position:fixed;bottom:0;left:0;right:0;z-index:60;border-top:1px solid var(--garis);border-bottom:0}
  nav.tab .in{justify-content:space-around;padding:0}
  nav.tab a{flex-direction:column;gap:0;font-size:11px;padding:7px 4px 9px;border-bottom:0;border-top:3px solid transparent;position:relative}
  nav.tab a.on{border-top-color:var(--biru)}
  nav.tab a .ic{font-size:18px;line-height:1.2}
  nav.tab .n{position:absolute;top:2px;right:2px}
  .judul small{display:none}
  .f{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:0}.dl dt{margin-top:8px}
  .bar{grid-template-columns:110px 1fr 28px}
  .tutup-bg{padding:0;align-items:stretch}.modal{border-radius:0;min-height:100%}
  .alat .seg{width:100%;display:flex}.alat .seg button{flex:1}
  .alat input[type=search]{flex:1 1 0;min-width:0}
  .fwrap{display:none;width:100%;grid-template-columns:1fr 1fr;gap:8px}.fwrap.buka{display:grid}.fwrap select{width:100%}
  .fwrap label{grid-column:1/-1}
  main{padding-top:12px}
}
@media print{header.top,nav.tab,.alat,.aksi,.btn{display:none!important}main{padding:0}}
</style>
</head>

var D = null, TOKEN = null, ME = null, peta = null;
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var filterKasus = { q:'', status:'Berjalan', tahap:'', kategori:'', kecamatan:'', bulan:'', lewat:false };
var filterAduan = { status:'Baru', q:'' };

/* ---------- util ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function simpan(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function ambil(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function tglIndo(t, hari){ if(!t) return '–'; var p=t.slice(0,10).split('-'); if(p.length<3) return t;
  var s=Number(p[2])+' '+BLN[Number(p[1])-1]+' '+p[0];
  if(hari){ var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); s=HARI[d.getUTCDay()]+', '+s; } return s; }
function waktuIndo(w){ if(!w) return '–'; return tglIndo(w.slice(0,10))+(w.length>10?' '+w.slice(11,16):''); }
function hariIni(){ var d=new Date(Date.now()+7*3600e3); return d.toISOString().slice(0,10); }
function liburSet(){ var s={}; (D.libur||[]).forEach(function(l){ if(l.dihitung) s[l.tanggal]=1; }); return s; }
function tambahHK(t,n){ var lib=liburSet(), p=t.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;
  while(c<n){ d.setUTCDate(d.getUTCDate()+1); var w=d.getUTCDay(), s=d.toISOString().slice(0,10); if(w&&w!==6&&!lib[s]) c++; }
  return d.toISOString().slice(0,10); }
function selisihHK(a,b){ if(a===b) return 0; var lib=liburSet(), m=a<b?1:-1, x=a<b?a:b, y=a<b?b:a, p=x.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;
  while(d.toISOString().slice(0,10)<y){ d.setUTCDate(d.getUTCDate()+1); var w=d.getUTCDay(), s=d.toISOString().slice(0,10); if(w&&w!==6&&!lib[s]) c++; }
  return c*m; }
function isAdmin(){ return ME && ME.peran!=='Lihat'; }
function isUtama(){ return ME && ME.peran==='Admin Utama'; }
function lewat(k){ return k.status!=='Selesai' && k.tenggat && k.tenggat < D.hariIni; }
function pilTenggat(k){
  if(k.status==='Selesai') return '<span class="pill p-hijau">Selesai</span>';
  if(!k.tenggat) return '<span class="sub">–</span>';
  var n=selisihHK(D.hariIni,k.tenggat);
  if(k.tenggat<D.hariIni) return '<span class="pill p-merah">Lewat '+Math.max(1,-n)+' hari kerja</span>';
  if(k.tenggat===D.hariIni) return '<span class="pill p-merah">Hari ini</span>';
  return '<span class="pill '+(n<=1?'p-kuning':'p-biru')+'">'+tglIndo(k.tenggat)+' · sisa '+n+' hk</span>'; }
function pilTahap(k){ if(!k.tahap) return '<span class="pill">Belum ada tahap</span>'; return '<span class="pill p-biru">'+esc(k.tahap)+'</span>'; }
function judulKasus(k){ return k.objek || k.ringkasan || k.pelanggar || k.no; }
function toast(t){ var e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, 3500); }
var nMuat=0; function muat(on){ nMuat+=on?1:-1; var b=$('.muat'); if(nMuat>0&&!b){ b=document.createElement('div'); b.className='muat'; document.body.appendChild(b); } if(nMuat<=0&&b){ nMuat=0; b.remove(); } }

function api(action, data){
  muat(true);
  var body = Object.assign({ action: action, token: TOKEN }, data||{});
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .catch(function(){ throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); })
    .then(function(j){
      if(!j.ok){ if(j.sesiHabis){ keluar(j.error); } throw new Error(j.error||'Terjadi kesalahan.'); }
      return j; })
    .finally(function(){ muat(false); });
}

/* ---------- login ---------- */
function tampil(id){ ['layarLogin','layarGanti','aplikasi'].forEach(function(x){ $('#'+x).classList.toggle('hide', x!==id); }); }
function keluar(pesan){
  if(TOKEN && !pesan) api('logout').catch(function(){});
  TOKEN=null; ME=null; D=null; simpan('ppud_sesi', null);
  tampil('layarLogin'); $('#lgGalat').textContent = pesan||''; $('#lgPass').value='';
}
$('#formLogin').addEventListener('submit', function(e){
  e.preventDefault(); var b=$('#lgBtn'); b.disabled=true; $('#lgGalat').textContent='';
  api('login',{ username: $('#lgUser').value.trim(), password: $('#lgPass').value })
    .then(function(j){ TOKEN=j.token; ME=j.me; simpan('ppud_sesi',{token:TOKEN, me:ME}); $('#lgPass').value=''; masuk(); })
    .catch(function(err){ $('#lgGalat').textContent=err.message; })
    .finally(function(){ b.disabled=false; });
});
$('#formGanti').addEventListener('submit', function(e){
  e.preventDefault(); var g=$('#gpGalat'); g.textContent='';
  if($('#gpBaru').value!==$('#gpUlang').value){ g.textContent='Ulangi password baru tidak sama.'; return; }
  var b=$('#gpBtn'); b.disabled=true;
  api('gantiPassword',{ lama:$('#gpLama').value, baru:$('#gpBaru').value })
    .then(function(j){ ME=j.me; simpan('ppud_sesi',{token:TOKEN, me:ME}); $('#formGanti').reset(); toast('Password tersimpan'); masuk(); })
    .catch(function(err){ g.textContent=err.message; })
    .finally(function(){ b.disabled=false; });
});
$('#gpBatal').addEventListener('click', function(){ if(ME && ME.wajibGanti) keluar(); else tampil('aplikasi'); });
function bukaGanti(paksa){ $('#gpInfo').textContent = paksa ? 'Ini login pertama Anda. Ganti password sebelum melanjutkan (password lama = username).' : 'Ganti password akun '+ME.username+'.';
  $('#gpBatal').textContent = paksa ? 'Keluar' : 'Batal'; tampil('layarGanti'); }

function masuk(){
  if(ME.wajibGanti){ bukaGanti(true); return; }
  tampil('aplikasi');
  $('#btnAkun').textContent = ME.nama.split(' ')[0] + ' ▾';
  $('#infoAkun').innerHTML = '<b style="color:var(--teks)">'+esc(ME.nama)+'</b><br>'+esc(ME.username)+' · '+esc(ME.peran)+'<br>Sesi berakhir '+new Date(ME.kedaluwarsa).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  muatData();
}
$('#btnAkun').addEventListener('click', function(e){ e.stopPropagation(); $('#menuAkun').classList.toggle('hide'); });
document.addEventListener('click', function(){ $('#menuAkun').classList.add('hide'); });
$('#menuAkun').addEventListener('click', function(e){ var a=e.target.getAttribute('data-aksi'); if(!a) return;
  if(a==='keluar') keluar(); if(a==='ganti') bukaGanti(false); if(a==='muatUlang') muatData(); });

function muatData(){
  return api('data').then(function(j){ D=j; ME=j.me; render(); })
    .catch(function(err){ if(TOKEN) $('#isi').innerHTML='<div class="kartu galat">'+esc(err.message)+' <button class="btn kecil" onclick="muatData()">Coba lagi</button></div>'; });
}

/* ---------- routing ---------- */
window.addEventListener('hashchange', function(){ if(D) render(); });
function render(){
  if(peta){ peta.remove(); peta=null; }
  var h = location.hash.replace(/^#\/?/,'') || 'beranda';
  var bag = h.split('/');
  var baru = D.aduan.filter(function(a){ return a.status==='Baru'; }).length;
  var nLewat = D.kasus.filter(lewat).length;
  var menu = [['beranda','Beranda','⌂'],['aduan','Aduan','✉',baru],['kasus','Kasus','▤',nLewat],['libur','Hari libur','▦']];
  if(isUtama()) menu.push(['pengguna','Pengguna','☺']);
  $('#nav').innerHTML = menu.map(function(m){ return '<a href="#'+m[0]+'" class="'+(bag[0]===m[0]?'on':'')+'"><span class="ic only-mob">'+m[2]+'</span>'+m[1]+(m[3]?'<span class="n">'+m[3]+'</span>':'')+'</a>'; }).join('');
  var f = { beranda: vBeranda, aduan: vAduan, kasus: bag[1] ? function(){ vDetail(decodeURIComponent(bag[1])); } : vKasus, libur: vLibur, pengguna: vPengguna }[bag[0]] || vBeranda;
  f(); window.scrollTo(0,0);
}

/* ---------- beranda ---------- */
function hitung(list, key, kosong){ var o={}; list.forEach(function(x){ var k=x[key]||kosong||'(kosong)'; o[k]=(o[k]||0)+1; }); return o; }
function bars(obj, urutan, maks){
  var keys = urutan ? urutan.filter(function(k){ return obj[k]; }) : Object.keys(obj).sort(function(a,b){ return obj[b]-obj[a]; });
  if(maks) keys = keys.slice(0,maks);
  if(!keys.length) return '<div class="sub">Belum ada data.</div>';
  var mx = Math.max.apply(null, keys.map(function(k){ return obj[k]; }));
  return keys.map(function(k){ return '<div class="bar"><span class="nm" title="'+esc(k)+'">'+esc(k)+'</span><span class="t"><i style="width:'+(obj[k]/mx*100)+'%"></i></span><b>'+obj[k]+'</b></div>'; }).join('');
}
function vBeranda(){
  var t = D.hariIni, bln = t.slice(0,7);
  var berjalan = D.kasus.filter(function(k){ return k.status!=='Selesai'; });
  var lw = berjalan.filter(lewat);
  var selesaiBln = D.kasus.filter(function(k){ return k.status==='Selesai' && (k.tanggalSelesai||'').slice(0,7)===bln; });
  var baru = D.aduan.filter(function(a){ return a.status==='Baru'; });
  var perhatian = berjalan.filter(function(k){ return k.tenggat && selisihHK(t,k.tenggat)<=2; }).sort(function(a,b){ return a.tenggat<b.tenggat?-1:1; });
  $('#isi').innerHTML =
    '<h1>Ringkasan · '+esc(tglIndo(t,true))+'</h1>'+
    '<div class="grid g4">'+
      '<button class="stat" onclick="location.hash=\'aduan\'"><div class="l">Aduan baru</div><div class="v">'+baru.length+'</div></button>'+
      '<button class="stat" onclick="setFK({status:\'Berjalan\',lewat:false})"><div class="l">Kasus berjalan</div><div class="v">'+berjalan.length+'</div></button>'+
      '<button class="stat '+(lw.length?'merah':'')+'" onclick="setFK({status:\'Berjalan\',lewat:true})"><div class="l">Lewat tenggat</div><div class="v">'+lw.length+'</div></button>'+
      '<button class="stat" onclick="setFK({status:\'Selesai\',lewat:false,bulan:\'\'})"><div class="l">Selesai bulan ini</div><div class="v">'+selesaiBln.length+'</div></button>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:12px">'+
      '<div class="kartu"><h2>Perlu perhatian</h2>'+(perhatian.length ? '<div class="daftar">'+perhatian.slice(0,8).map(itemKasus).join('')+'</div>'+(perhatian.length>8?'<p class="sub">+'+(perhatian.length-8)+' kasus lagi</p>':'') : '<div class="sub">Tidak ada kasus yang lewat atau mendekati tenggat (≤ 2 hari kerja).</div>')+'</div>'+
      '<div class="kartu"><h2>Kasus berjalan per tahap</h2>'+bars(hitung(berjalan,'tahap','Belum ada tahap'), D.tahap.concat(['Belum ada tahap']))+'</div>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:12px">'+
      '<div class="kartu"><h2>Kasus berjalan per kategori</h2>'+bars(hitung(berjalan,'kategori'))+'</div>'+
      '<div class="kartu"><h2>Kasus berjalan per kecamatan</h2>'+bars(hitung(berjalan,'kecamatan'),null,8)+'</div>'+
    '</div>'+

    .catch(function(){ el.textContent='gagal dimuat'; }); }
function lihatBerkas(id){
  var w = window.open('', '_blank');
  if(w) w.document.write('<p style="font-family:sans-serif">Memuat berkas…</p>');

function siapkanBerkas(f){
  return new Promise(function(ok, gagal){
    if(/^image\//.test(f.type) && f.type!=='image/gif'){
      var img=new Image(), url=URL.createObjectURL(f);
      img.onload=function(){ var m=1600, s=Math.min(1, m/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        var d=c.toDataURL('image/jpeg',0.8); if(d.length*0.75>5*1048576) return gagal(new Error('Foto "'+f.name+'" terlalu besar.'));
        ok({ nama: f.name.replace(/\.[^.]+$/,'')+'.jpg', data:d }); };
      img.onerror=function(){ gagal(new Error('Foto "'+f.name+'" tidak dapat dibaca.')); }; img.src=url;
    } else if(f.type==='application/pdf'){
      if(f.size>5*1048576) return gagal(new Error('Berkas "'+f.name+'" lebih dari 5 MB.'));
      var rd=new FileReader(); rd.onload=function(){ ok({ nama:f.name, data:rd.result }); }; rd.onerror=function(){ gagal(new Error('Berkas tidak dapat dibaca.')); }; rd.readAsDataURL(f);
    } else gagal(new Error('"'+f.name+'" bukan foto atau PDF.'));
  });
}

    var nos={}; list.forEach(function(k){ nos[k.no]=1; });
    var riw=D.riwayat.filter(function(r){ return nos[r.no]; }).sort(function(a,b){ return a.no===b.no?(a.tanggal<b.tanggal?-1:1):(a.no<b.no?-1:1); })
      .map(function(r){ return { 'No. Kasus':r.no, 'Tahap':r.tahap, 'Tanggal':r.tanggal, 'Nomor Surat':r.nomorSurat, 'Petugas':r.petugas, 'Tenggat':r.tenggat, 'Catatan':r.catatan, 'Jumlah Berkas':r.berkas.length, 'Dicatat Oleh':r.dicatatOleh }; });
    var wb=XLSX.utils.book_new();
    var ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'No. Kasus':'(tidak ada data)'}]); ws['!cols']=Object.keys(rows[0]||{a:1}).map(function(){ return {wch:18}; });
    XLSX.utils.book_append_sheet(wb, ws, 'Kasus');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(riw.length?riw:[{'No. Kasus':'(tidak ada data)'}]), 'Riwayat Tahapan');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Rekap kasus PPUD Satpol PP Kab. Sumedang'],['Diunduh',waktuIndo(new Date(Date.now()+7*3600e3).toISOString().replace('T',' ')),],['Oleh',ME.nama+' ('+ME.peran+')'],['Filter',ketFilter()],['Jumlah kasus',list.length]]), 'Info');
    XLSX.writeFile(wb, namaFile('xlsx'));
  }).catch(function(e){ toast(e.message); });
}
function pustakaPDF(){ return muatSkrip('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js').then(function(){ return muatSkrip('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'); }); }
function kopPDF(doc, judul, sub){
  var w=doc.internal.pageSize.getWidth();
  try{ doc.addImage(LOGO_PEMKAB,'PNG',14,10,14,16); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('SATUAN POLISI PAMONG PRAJA KABUPATEN SUMEDANG',32,15);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text('Bidang Penegakan Perundang-undangan Daerah',32,20);
  doc.setDrawColor(18,48,122); doc.setLineWidth(0.6); doc.line(14,28,w-14,28);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(judul,14,37);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text(doc.splitTextToSize(sub,w-28),14,43); doc.setTextColor(0);
  return 50;
}
function kakiPDF(doc){ var n=doc.getNumberOfPages(), w=doc.internal.pageSize.getWidth(), h=doc.internal.pageSize.getHeight();
  for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text('Dicetak '+tglIndo(D.hariIni)+' oleh '+ME.nama+' · Dokumen internal',14,h-8); doc.text('Hal. '+i+'/'+n,w-14,h-8,{align:'right'}); doc.setTextColor(0); } }
function eksporPDF(){
  var list=kasusTersaring();
  pustakaPDF().then(function(){
    var doc=new jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    var y=kopPDF(doc,'Rekap Kasus PPUD', ketFilter()+' · '+list.length+' kasus · per '+tglIndo(D.hariIni,true));
    doc.autoTable({ startY:y, head:[['No. Kasus','Dibuka','Objek / ringkasan','Kategori','Lokasi','Aturan','Tahap','Tenggat / hasil']],
      body:list.map(function(k){ return [k.no, tglIndo(k.tanggalDibuka), judulKasus(k)+(k.objek&&k.ringkasan?'\n'+k.ringkasan:''), k.kategori, 'Kec. '+k.kecamatan+'\n'+k.desa, k.aturan||'-',
        (k.tahap||'-')+(k.tanggalTahap?'\n'+tglIndo(k.tanggalTahap):''), k.status==='Selesai'?'Selesai '+tglIndo(k.tanggalSelesai)+'\n'+k.hasil:(k.tenggat?tglIndo(k.tenggat)+(lewat(k)?'\nLEWAT TENGGAT':''):'-')]; }),
      styles:{fontSize:8, cellPadding:1.8, valign:'top'}, headStyles:{fillColor:[18,48,122]}, columnStyles:{0:{cellWidth:30},1:{cellWidth:20},5:{cellWidth:55}},
      didParseCell:function(h){ if(h.section==='body'&&h.column.index===7&&String(h.cell.raw).indexOf('LEWAT')>=0) h.cell.styles.textColor=[180,35,24]; } });
    kakiPDF(doc); doc.save(namaFile('pdf'));
  }).catch(function(e){ toast(e.message); });
}
function pdfKasus(no){
  var k=D.kasus.filter(function(x){ return x.no===no; })[0], riw=riwayatKasus(no);
  pustakaPDF().then(function(){
    var doc=new jspdf.jsPDF({unit:'mm', format:'a4'});
    var y=kopPDF(doc,'Ringkasan Kasus '+k.no, judulKasus(k)+' · status '+k.status+(k.status==='Selesai'?' ('+k.hasil+')':''));
    var baris=[['Tanggal dibuka',tglIndo(k.tanggalDibuka)],['Asal kasus',k.asal+(k.tiket.length?' ('+k.tiket.join(', ')+')':'')],['Kategori',k.kategori],['Ringkasan',k.ringkasan],['Aturan dilanggar',k.aturan||'-'],['Uraian',k.uraian||'-'],
      ['Pelanggar',k.pelanggar||'-'],['Usaha/objek',k.objek||'-'],['NIK',k.nik||'-'],['No. HP',k.hp?'+'+k.hp:'-'],['Alamat pelanggar',k.alamatPelanggar||'-'],
      ['Lokasi',(k.alamat?k.alamat+', ':'')+'Desa/Kel. '+k.desa+', Kec. '+k.kecamatan+(k.lat?' ('+k.lat+', '+k.lng+')':'')],
      ['Tahap saat ini',(k.tahap||'-')+(k.tenggat&&k.status!=='Selesai'?' · tenggat '+tglIndo(k.tenggat)+(lewat(k)?' (LEWAT)':''):'')]];
    if(k.status==='Selesai') baris.push(['Selesai',tglIndo(k.tanggalSelesai)+' · '+k.hasil]);
    if(k.catatan) baris.push(['Catatan',k.catatan]);
    doc.autoTable({ startY:y, body:baris, theme:'plain', styles:{fontSize:9, cellPadding:1.5}, columnStyles:{0:{cellWidth:38, fontStyle:'bold', textColor:[90,90,90]}} });
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Riwayat tahapan', 14, doc.lastAutoTable.finalY+9);
    doc.autoTable({ startY:doc.lastAutoTable.finalY+12, head:[['Tanggal','Tahap','Nomor surat','Tenggat','Petugas / catatan','Berkas']],
      body: riw.length ? riw.map(function(r){ return [tglIndo(r.tanggal), r.tahap, r.nomorSurat||'-', r.tenggat?tglIndo(r.tenggat):'-', [r.petugas,r.catatan].filter(String).join('\n')||'-', String(r.berkas.length)]; }) : [['-','Belum ada tahap','','','','']],
      styles:{fontSize:8.5, cellPadding:1.8, valign:'top'}, headStyles:{fillColor:[18,48,122]}, columnStyles:{0:{cellWidth:22},1:{cellWidth:34},3:{cellWidth:22},5:{cellWidth:14}} });
    kakiPDF(doc); doc.save('kasus-'+k.no+'.pdf');
  }).catch(function(e){ toast(e.message); });
}
