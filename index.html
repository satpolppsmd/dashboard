<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--biru:#12307a;--biru2:#1f4bb5;--kuning:#f7c600;--latar:#eef2f8;--teks:#1d2433;--abu:#5b6475;--garis:#dde3ee;--putih:#fff;
--merah:#b42318;--merahbg:#fde2e1;--hijau:#127a3a;--hijaubg:#d7f2df;--kuningbg:#fff3c4;--kuningtx:#7a5b00;--birubg:#dbe8ff;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--latar);color:var(--teks);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--biru2)}
.hide{display:none!important}
header.top{background:var(--biru);color:#fff;border-bottom:3px solid var(--kuning);position:sticky;top:0;z-index:50}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.top-in img{height:34px}
a.kelogo{display:inline-flex;line-height:0;cursor:pointer}
.judul{font-weight:700;line-height:1.15;font-size:15px}
.judul small{display:block;font-weight:400;opacity:.8;font-size:12px}
.akun{margin-left:auto;position:relative}
.akun>button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.menu{position:absolute;right:0;top:110%;background:#fff;color:var(--teks);border:1px solid var(--garis);border-radius:var(--r);min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.menu div{padding:10px 14px;font-size:13px;color:var(--abu);border-bottom:1px solid var(--garis)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;cursor:pointer}
.menu button:hover{background:var(--latar)}
nav.tab{background:#fff;border-bottom:1px solid var(--garis)}
nav.tab .in{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto}
nav.tab a{padding:11px 14px;text-decoration:none;color:var(--abu);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;display:flex;gap:6px;align-items:center}
nav.tab a.on{color:var(--biru);border-bottom-color:var(--biru)}
nav.tab .n{background:var(--merah);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
main{max-width:1200px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:14px 16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--biru2)}

var D = null, TOKEN = null, ME = null, peta = null, lapPeta = null;
var FP_AWAL = { status:'Berjalan', periode:'tahun', kategori:'', kecamatan:'' }, filterPeta = Object.assign({}, FP_AWAL);
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var filterKasus = { q:'', status:'Berjalan', tahap:'', kategori:'', kecamatan:'', bulan:'', lewat:false };
var filterAduan = { status:'Baru', q:'' };

/* ---------- util ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function simpan(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function ambil(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
var BATAS_DIAM=60*60*1000, aktivitasTerakhir=Date.now(), aktSimpan=0;
function catatAktivitas(){ aktivitasTerakhir=Date.now(); if(aktivitasTerakhir-aktSimpan>15000){ aktSimpan=aktivitasTerakhir; simpan('ppud_aktif', aktivitasTerakhir); } }
['pointerdown','keydown','wheel','touchstart','scroll'].forEach(function(ev){ window.addEventListener(ev, catatAktivitas, {passive:true, capture:true}); });
function diamSelama(){ return Date.now()-Math.max(aktivitasTerakhir, Number(ambil('ppud_aktif'))||0); }
function tglIndo(t, hari){ if(!t) return '–'; var p=t.slice(0,10).split('-'); if(p.length<3) return t;
  var s=Number(p[2])+' '+BLN[Number(p[1])-1]+' '+p[0];
  if(hari){ var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); s=HARI[d.getUTCDay()]+', '+s; } return s; }
function waktuIndo(w){ if(!w) return '–'; return tglIndo(w.slice(0,10))+(w.length>10?' '+w.slice(11,16):''); }
function hariIni(){ var d=new Date(Date.now()+7*3600e3); return d.toISOString().slice(0,10); }
function liburSet(){ var s={}; (D.libur||[]).forEach(function(l){ if(l.dihitung) s[l.tanggal]=1; }); return s; }
function tambahHK(t,n){ var lib=liburSet(), p=t.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;
  while(c<n){ d.setUTCDate(d.getUTCDate()+1); var w=d.getUTCDay(), s=d.toISOString().slice(0,10); if(w&&w!==6&&!lib[s]) c++; }
  return d.toISOString().slice(0,10); }
function selisihHK(a,b){ if(a===b) return 0; var lib=liburSet(), m=a<b?1:-1, x=a<b?a:b, y=a<b?b:a, p=x.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2])), c=0;
  while(d.toISOString().slice(0,10)<y){ d.setUTCDate(d.getUTCDate()+1); var w=d.getUTCDay(), s=d.toISOString().slice(0,10); if(w&&w!==6&&!lib[s]) c++; }
  return c*m; }
function isAdmin(){ return ME && ME.peran!=='Lihat'; }
function isUtama(){ return ME && ME.peran==='Admin Utama'; }
function nm(u){ return u ? ((D && D.nama && D.nama[u]) || u) : ''; }
function catatanTampil(c){ return String(c||'').replace(/\[(Penutupan|Dibuka kembali) (\d{4}-\d{2}-\d{2})(?: \u00b7 ([^\]]+))?\]/g, function(_,j,t,u){ return '['+j+' '+tglIndo(t)+(u?' \u00b7 '+nm(u):'')+']'; }); }
var KHUSUS={'Penutupan Kasus':'tutup','Dibuka Kembali':'buka'};
function penutup(k){ var m=String(k.catatan||'').match(/\[Penutupan \d{4}-\d{2}-\d{2} \u00b7 [^\]]+\]/g); return m ? nm(m[m.length-1].replace(/^.* \u00b7 |\]$/g,'')) : nm(k.diubahOleh); }
function lewat(k){ return k.status!=='Selesai' && k.tenggat && k.tenggat < D.hariIni; }
function pilTenggat(k){
  if(k.status==='Selesai') return '<span class="pill p-hijau">Selesai</span>';
  if(!k.tenggat) return '<span class="sub">–</span>';
  var n=selisihHK(D.hariIni,k.tenggat);
  if(k.tenggat<D.hariIni) return '<span class="pill p-merah">Lewat '+Math.max(1,-n)+' hari kerja</span>';
  if(k.tenggat===D.hariIni) return '<span class="pill p-merah">Hari ini</span>';
  return '<span class="pill '+(n<=1?'p-kuning':'p-biru')+'">'+tglIndo(k.tenggat)+' · sisa '+n+' hk</span>'; }
function pilTahap(k){ if(!k.tahap) return '<span class="pill">Belum ada tahap</span>'; return '<span class="pill p-biru">'+esc(k.tahap)+'</span>'; }
function judulKasus(k){ return k.objek || k.ringkasan || k.pelanggar || k.no; }
function toast(t){ var e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, 3500); }
var nMuat=0; function muat(on){ nMuat+=on?1:-1; var b=$('.muat'); if(nMuat>0&&!b){ b=document.createElement('div'); b.className='muat'; document.body.appendChild(b); } if(nMuat<=0&&b){ nMuat=0; b.remove(); } }

function api(action, data){
  muat(true);
  var body = Object.assign({ action: action, token: TOKEN, aktif: diamSelama() < BATAS_DIAM }, data||{});
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .catch(function(){ throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); })
    .then(function(j){
      if(!j.ok){ if(j.sesiHabis){ keluar(j.error); } throw new Error(j.error||'Terjadi kesalahan.'); }
      return j; })
    .finally(function(){ muat(false); });
}

/* ---------- login ---------- */
function tampil(id){ ['layarLogin','layarGanti','aplikasi'].forEach(function(x){ $('#'+x).classList.toggle('hide', x!==id); }); }
function keluar(pesan){
  if(TOKEN && !pesan) api('logout').catch(function(){});
  TOKEN=null; ME=null; D=null; SRD=null; SF=null; tiketDikenal=null; simpan('ppud_sesi', null); var nb=$('#notif'); if(nb) nb.remove();
  tampil('layarLogin'); $('#lgGalat').textContent = pesan||''; $('#lgPass').value='';
}
$('#formLogin').addEventListener('submit', function(e){
  e.preventDefault(); var b=$('#lgBtn'); b.disabled=true; $('#lgGalat').textContent='';
  api('login',{ username: $('#lgUser').value.trim(), password: $('#lgPass').value })
    .then(function(j){ TOKEN=j.token; ME=j.me; aktSimpan=0; filterPeta=Object.assign({}, FP_AWAL); catatAktivitas(); simpan('ppud_sesi',{token:TOKEN, me:ME}); $('#lgPass').value=''; masuk(); })
    .catch(function(err){ $('#lgGalat').textContent=err.message; })
    .finally(function(){ b.disabled=false; });
});
$('#formGanti').addEventListener('submit', function(e){
  e.preventDefault(); var g=$('#gpGalat'); g.textContent='';
  if($('#gpBaru').value!==$('#gpUlang').value){ g.textContent='Ulangi password baru tidak sama.'; return; }
  var b=$('#gpBtn'); b.disabled=true;
  api('gantiPassword',{ lama:$('#gpLama').value, baru:$('#gpBaru').value })
    .then(function(j){ ME=j.me; simpan('ppud_sesi',{token:TOKEN, me:ME}); $('#formGanti').reset(); toast('Password tersimpan'); masuk(); })
    .catch(function(err){ g.textContent=err.message; })
    .finally(function(){ b.disabled=false; });
});
$('#gpBatal').addEventListener('click', function(){ if(ME && ME.wajibGanti) keluar(); else tampil('aplikasi'); });
function bukaGanti(paksa){ $('#gpInfo').textContent = paksa ? 'Ini login pertama Anda. Ganti password sebelum melanjutkan (password lama = username).' : 'Ganti password akun '+ME.username+'.';
  $('#gpBatal').textContent = paksa ? 'Keluar' : 'Batal'; tampil('layarGanti'); }

function masuk(){
  if(ME.wajibGanti){ bukaGanti(true); return; }
  tampil('aplikasi');
  $('#btnAkun').textContent = ME.nama.split(' ')[0] + ' ▾';
  $('#infoAkun').innerHTML = '<b style="color:var(--teks)">'+esc(ME.nama)+'</b><br>'+esc(ME.username)+' · '+esc(ME.peran)+'<br><small style="font-size:12px;opacity:.85">Keluar otomatis setelah 1 jam tanpa aktivitas</small>';
  muatData();
}
$('#btnAkun').addEventListener('click', function(e){ e.stopPropagation(); $('#menuAkun').classList.toggle('hide'); });
document.addEventListener('click', function(){ $('#menuAkun').classList.add('hide'); });
$('#menuAkun').addEventListener('click', function(e){ var a=e.target.getAttribute('data-aksi'); if(!a) return;
  if(a==='keluar') keluar(); if(a==='ganti') bukaGanti(false); if(a==='muatUlang') muatData(); });

var terakhirMuat=0, sedangSegar=false, tiketDikenal=null;
function muatData(diam){
  return api('data').then(function(j){ var y=window.scrollY; D=j; ME=j.me; simpan('ppud_sesi',{token:TOKEN, me:ME}); terakhirMuat=Date.now(); render(); if(diam) window.scrollTo(0,y); cekAduanBaru(); })
    .catch(function(err){ if(diam) return; if(TOKEN) $('#isi').innerHTML='<div class="kartu galat">'+esc(err.message)+' <button class="btn kecil" onclick="muatData()">Coba lagi</button></div>'; });
}

function cekAduanBaru(){
  var b=D.aduan.filter(function(a){ return a.status==='Baru'; }).map(function(a){ return a.tiket; });
  if(tiketDikenal){ var n=b.filter(function(t){ return tiketDikenal.indexOf(t)<0; }).length; if(n) beriTahu(n); }
  tiketDikenal=b;
}
function beriTahu(n){
  var e=$('#notif');
  if(e){ n+=Number(e.getAttribute('data-n'))||0; } else { e=document.createElement('div'); e.id='notif'; e.style.cssText='position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:250;background:#fff;border:1px solid var(--garis,#dfe3ea);border-left:4px solid var(--kuning,#f5c400);border-radius:10px;box-shadow:0 6px 24px rgba(16,32,80,.18);padding:10px 12px 10px 14px;display:flex;gap:10px;align-items:center;font-size:14px;max-width:92vw;width:max-content;white-space:nowrap'; document.body.appendChild(e); }
  e.setAttribute('data-n', n);
  e.innerHTML='<span>\ud83d\udd14 <b>'+n+' aduan baru</b> masuk</span><button class="btn kecil" id="notifLihat">Lihat</button><button id="notifTutup" title="Tutup" style="border:0;background:none;font-size:18px;cursor:pointer;color:#667">\u00d7</button>';
  $('#notifLihat').onclick=function(){ e.remove(); location.hash='aduan'; };
  $('#notifTutup').onclick=function(){ e.remove(); };
}
document.addEventListener('click', function(e){
  var a=e.target.closest && e.target.closest('a.kelogo'); if(!a) return;
  var m=$('#modalBg'); if(!m) return;
  var isi=[].some.call(m.querySelectorAll('input,textarea,select'), function(x){ return x.type!=='hidden' && !x.disabled && !x.readOnly; });
  if(isi && !confirm('Formulir yang sedang terbuka belum disimpan dan isiannya akan hilang. Tetap pindah ke halaman utama?')) e.preventDefault();
});
function sibuk(){
  if($('#modalBg')) return true;
  if($('#aplikasi').classList.contains('hide')) return true;
  var a=document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function segarkan(){
  if(!TOKEN || !D || sedangSegar || sibuk()) return;
  sedangSegar=true; muatData(true).finally(function(){ sedangSegar=false; });
}
function cekDiam(){ if(TOKEN && diamSelama()>=BATAS_DIAM){ tutupModal(); keluar('Anda keluar otomatis karena tidak ada aktivitas selama 1 jam.'); return true; } return false; }

/* ---------- SURAT (Surat Perintah) ---------- */
var SRD = null, SF = null, srMuat = null;
var SR_DRAF0 = 'ppud_surat_draf_';
function srKunci(){ return SR_DRAF0+(ME?ME.username:''); }
var SEKSI_SR = ['Binwasluh', 'Sidiklidik'];
function srMuatData(paksa){
  if(SRD && !paksa) return Promise.resolve(SRD);
  if(srMuat && !paksa) return srMuat;
  srMuat = api('suratData').then(function(j){ SRD=j; return j; }).finally(function(){ srMuat=null; });
  return srMuat;
}
function srPerlu(lanjut){
  if(SRD){ lanjut(); return; }
  $('#isi').innerHTML='<div class="sub">Memuat data surat…</div>';
  var h=location.hash;
  srMuatData().then(function(){ if(location.hash===h) lanjut(); })
    .catch(function(e){ $('#isi').innerHTML='<div class="kartu galat">'+esc(e.message)+' <button class="btn kecil" onclick="srMuatData(true).then(render)">Coba lagi</button></div>'; });
}
function rSurat(bag){
  if(!isAdmin()){ location.hash='beranda'; return; }
  var b=bag[1]||'';
  if(b==='pegawai' || b==='dasar'){ if(!isUtama()){ location.hash='surat'; return; } srPerlu(b==='pegawai'?vPegawai:vDasarHukum); return; }
  if(b) srPerlu(function(){ vSuratForm(decodeURIComponent(b)); }); else srPerlu(vSurat);
}
function srHari(t){ return SuratDocx.hari(t); }
function srTgl(t){ return t?tglIndo(t):'–'; }
function srSalin(teks, nama){
  function cadang(){ var t=document.createElement('textarea'); t.value=teks; t.setAttribute('readonly',''); t.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(t); t.select(); t.setSelectionRange(0, teks.length); var ok=false; try{ ok=document.execCommand('copy'); }catch(e){} t.remove(); toast(ok?nama+' disalin':'Gagal menyalin. Salin manual dari kotak teks.'); }

  var keys = urutan ? urutan.filter(function(k){ return obj[k]; }) : Object.keys(obj).sort(function(a,b){ return obj[b]-obj[a]; });
  if(maks) keys = keys.slice(0,maks);

function siapkanBerkas(f){
  return new Promise(function(ok, gagal){
    if(/^image\//.test(f.type) && f.type!=='image/gif'){
      var img=new Image(), url=URL.createObjectURL(f);
      img.onload=function(){ var m=1600, s=Math.min(1, m/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        var d=c.toDataURL('image/jpeg',0.8); if(d.length*0.75>5*1048576) return gagal(new Error('Foto "'+f.name+'" terlalu besar.'));
        ok({ nama: f.name.replace(/\.[^.]+$/,'')+'.jpg', data:d }); };
      img.onerror=function(){ gagal(new Error('Foto "'+f.name+'" tidak dapat dibaca.')); }; img.src=url;
    } else if(f.type==='application/pdf'){
      if(f.size>5*1048576) return gagal(new Error('Berkas "'+f.name+'" lebih dari 5 MB.'));

function tglKe(t,n){ var p=t.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n)); return d.toISOString().slice(0,10); }
function hariMinggu(t){ var p=t.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay(); }
function jamKeg(k){ return k.seharian ? 'Sehari penuh' : k.jamMulai+(k.jamSelesai?'–'+k.jamSelesai:''); }
function rentangKeg(k){ return k.selesai!==k.mulai ? tglIndo(k.mulai)+' – '+tglIndo(k.selesai) : tglIndo(k.mulai,true); }
/** Semua isi kalender untuk satu tanggal: libur, kegiatan, tenggat kasus berjalan. */
function isiTanggal(t){
  var out=[];
  (D.libur||[]).forEach(function(l){ if(l.tanggal===t && l.dihitung) out.push({ tipe:'libur', judul:l.keterangan }); });
  (D.kegiatan||[]).forEach(function(k){ if(k.mulai<=t && k.selesai>=t) out.push({ tipe:'keg', k:k, judul:k.nama }); });
  D.kasus.forEach(function(k){ if(k.status!=='Selesai' && k.tenggat===t) out.push({ tipe:'tenggat', kasus:k, judul:'Tenggat '+(k.tahap||'')+' · '+judulKasus(k) }); });
  out.sort(function(a,b){ var o={libur:0,keg:1,tenggat:2}; if(o[a.tipe]!==o[b.tipe]) return o[a.tipe]-o[b.tipe];
    if(a.tipe==='keg'){ var x=a.k.seharian?'':a.k.jamMulai, y=b.k.seharian?'':b.k.jamMulai; return x<y?-1:x>y?1:0; } return 0; });
  return out;
}

      (bl!==D.hariIni.slice(0,7)?'<button class="btn kecil" onclick="kalBulan=null;kalPilih=null;vKalender()">Hari ini</button>':'')+'</div>'+
      (isAdmin()?'<div class="kalaksi"><button class="btn" onclick="formJenis()">Kelola jenis</button><button class="btn utama" onclick="formKegiatan(null, kalPilih)">+ Kegiatan</button></div>':'')+'</div>'+

function sinkronB(paksa){

  return api('bestieRekap',{kode:kode}).then(function(j){ var y=window.scrollY; RB=j; isiRekapB(); if(diam) window.scrollTo(0,y);
      if(!tanpaSinkron) sinkronB().then(function(s){ if(adaBaruB(s) && location.hash==='#bestie/'+kode) muatRekapB(kode, true, true); });   // tarik jawaban terbaru dari Cloudflare
    })

}
function kunciSiswaB(j){ return String(j.kelas).toUpperCase().replace(/\s+/g,'')+'|'+String(+j.absen||j.absen); }
function hitungB(R){
  var pre={}, post={};
  R.jawaban.forEach(function(j){ var k=kunciSiswaB(j);
    if(j.tes==='pre'){ if(!pre[k]) pre[k]=j; }
    else { var c=post[k]; if(!c) post[k]={ best:j, n:1, semua:[j.skor] }; else { c.n++; c.semua.push(j.skor); if(j.skor>c.best.skor) c.best=j; } } });
  var lPre=Object.keys(pre).map(function(k){ return pre[k]; }), lPost=Object.keys(post).map(function(k){ return post[k].best; });
  function ind(l){ var n=l.length; if(!n) return { n:0 };
    var sk=l.map(function(x){ return x.skor; }), jml=sk.reduce(function(a,b){ return a+b; },0);
    return { n:n, rata:jml/n, maks:Math.max.apply(null,sk), min:Math.min.apply(null,sk), tuntas:sk.filter(function(x){ return x>=70; }).length/n*100 }; }
  var soal=R.sesi.soal.map(function(q,i){
    function pct(l){ if(!l.length) return null; return l.filter(function(x){ return x.jawaban[q.id]===q.k; }).length/l.length*100; }
    return { no:i+1, q:q, pre:pct(lPre), post:pct(lPost) }; });
  var kunci={}; Object.keys(pre).concat(Object.keys(post)).forEach(function(k){ kunci[k]=1; });
  var siswa=Object.keys(kunci).map(function(k){ var a=pre[k], b=post[k]; var ref=b?b.best:a;
    return { kelas:ref.kelas, absen:ref.absen, nama:(b?b.best.nama:a.nama), pre:a?a.skor:null, post:b?b.best.skor:null, nPost:b?b.n:0, semuaPost:b?b.semua:[],
      selisih:(a&&b)?b.best.skor-a.skor:null }; })
    .sort(function(x,y){ return x.kelas===y.kelas ? (+x.absen)-(+y.absen) : (x.kelas<y.kelas?-1:1); });
  var iPre=ind(lPre), iPost=ind(lPost);
  return { pre:iPre, post:iPost, naik:(iPre.n&&iPost.n)?iPost.rata-iPre.rata:null, soal:soal, siswa:siswa };
}

  h+='<div class="grid g2" style="margin-top:12px"><div class="kartu"><h2>Hasil pre-test dan post-test</h2><table class="t"><thead><tr><th>Indikator</th><th style="text-align:right">Pre-test</th><th style="text-align:right">Post-test</th></tr></thead><tbody>'+
